<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stand-Up Històric: Comedy Club</title>
    <!-- Fonts: Oswald for Titles, Roboto Slab for Cards (Readable) -->
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Roboto+Slab:wght@500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary-color: #ffd700;
            --secondary-color: #d32f2f;
            --text-color: #ffffff;
            --bg-color: #050505;
            --card-bg: #f8f1e0;
            --card-text: #1a1a1a;
            --font-main: 'Roboto Slab', serif;
            --font-display: 'Oswald', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-display);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
            cursor: default;
            /* Show cursor as requested */
        }

        /* --- SCENE LAYOUT --- */
        #scene {
            width: 100%;
            height: 100%;
            position: relative;
            /* USER PROVIDED BACKGROUND */
            background: url('img/fons.jpg') no-repeat center center;
            background-size: cover;
            overflow: hidden;
        }

        /* --- SPOTLIGHT (Mouse Follower) --- */
        #spotlight-mask {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            /* Dark mask with hole */
            background: radial-gradient(circle 200px at 50% 50%, transparent 0%, rgba(0, 0, 0, 0.85) 100%);
            transition: background 0.1s;
        }

        /* --- DECOR --- */
        .neon-sign {
            position: absolute;
            top: 5%;
            right: 5%;
            font-family: 'Oswald', sans-serif;
            font-size: 1.5rem;
            color: #ff00de;
            text-shadow: 0 0 10px #ff00de, 0 0 20px #ff00de;
            border: 3px solid #ff00de;
            padding: 5px 15px;
            border-radius: 10px;
            transform: rotate(-5deg);
            z-index: 5;
            opacity: 0.9;
            box-shadow: 0 0 15px rgba(255, 0, 222, 0.4);
        }

        .mic-stand-container {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 6;
            pointer-events: none;
        }

        .mic {
            font-size: 4rem;
            filter: drop-shadow(0 0 10px rgba(0, 0, 0, 0.8));
        }

        /* --- AUDIENCE --- */
        .audience-layer {
            position: absolute;
            bottom: -30px;
            left: 0;
            width: 100%;
            height: 250px;
            z-index: 60;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            pointer-events: none;
            opacity: 0.95;
            filter: blur(2px) contrast(1.2);
        }

        .head {
            width: 90px;
            height: 100px;
            background: #080808;
            border-radius: 50% 50% 10% 10%;
            margin: 0 -20px;
            box-shadow: 0 0 20px black;
            transform-origin: bottom center;
            animation: bob 3s infinite ease-in-out alternate;
        }

        .head:nth-child(even) {
            animation-delay: 0.5s;
            transform: scale(0.9) translateY(10px);
            z-index: 1;
            opacity: 0.9;
        }

        .head:nth-child(odd) {
            animation-duration: 4s;
            z-index: 2;
        }

        @keyframes bob {
            0% {
                transform: rotate(-3deg);
            }

            100% {
                transform: rotate(3deg);
            }
        }

        /* Laugh animation class */
        .head.laughing {
            animation: laugh 0.5s infinite;
        }

        @keyframes laugh {
            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }

            100% {
                transform: translateY(0);
            }
        }

        /* --- HUD --- */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.95), transparent);
        }

        .meter-container {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 400px;
        }

        .meter-label {
            color: var(--primary-color);
            font-size: 1.5rem;
            text-shadow: 0 2px 4px black;
        }

        .laughter-bar-bg {
            flex-grow: 1;
            height: 25px;
            background: #222;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #555;
            box-shadow: 0 0 10px black;
        }

        .laughter-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff4d4d, #ffd700);
            transition: width 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .controls {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .vol-slider {
            width: 100px;
            accent-color: var(--primary-color);
            cursor: pointer;
        }

        .vol-label {
            font-size: 0.8rem;
            color: #aaa;
            text-align: center;
            display: block;
        }

        /* --- CARDS (NOTES) --- */
        #cards-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -45%);
            width: 85%;
            max-width: 1100px;
            z-index: 50;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .note-card {
            background: var(--card-bg);
            color: var(--card-text);
            font-family: var(--font-main);
            font-size: 1.4rem;
            line-height: 1.4;
            padding: 20px 30px;
            border-radius: 5px;
            width: auto;
            transform: rotate(-1deg);
            box-shadow: 5px 10px 20px rgba(0, 0, 0, 0.6);
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            border: 1px solid #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            height: 130px;
        }

        .note-card:hover {
            transform: rotate(0deg) scale(1.05) translateY(-5px);
            background: #fff;
            z-index: 55;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.7);
        }

        .note-card:nth-child(even) {
            transform: rotate(1deg);
        }

        .note-card:nth-child(even):hover {
            transform: rotate(0deg) scale(1.05) translateY(-5px);
        }

        /* --- FEEDBACK BUBBLES --- */
        .bubble {
            position: absolute;
            font-size: 3rem;
            pointer-events: none;
            z-index: 80;
            animation: floatUp 1.5s forwards;
            opacity: 0;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.8);
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.5);
                opacity: 0;
            }

            20% {
                opacity: 1;
                transform: translateY(-30px) scale(1.2);
            }

            100% {
                transform: translateY(-150px) scale(1);
                opacity: 0;
            }
        }

        /* --- SCREENS --- */
        .screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 200;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
        }

        .screen h1 {
            font-size: 5rem;
            color: var(--primary-color);
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .btn-main {
            padding: 15px 60px;
            font-size: 1.8rem;
            font-family: var(--font-display);
            background: var(--primary-color);
            border: none;
            color: #000;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            text-transform: uppercase;
            margin-top: 30px;
        }

        .btn-main:hover {
            transform: scale(1.1);
            background: white;
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.5);
        }

        .era-badge {
            background: #fff;
            color: #000;
            padding: 5px 20px;
            border-radius: 30px;
            font-family: var(--font-display);
            font-size: 1.2rem;
            margin-top: 15px;
            transform: rotate(-3deg);
            display: inline-block;
            box-shadow: 0 5px 15px black;
        }
    </style>

    <!-- INICIO_AUTO_ZOOM_ANTIGRAVITY -->
    <script>
        function autoEscalar() {
            const anchoDiseno = 1920; 
            const escala = window.innerWidth / anchoDiseno;
            if (escala < 1) {
                document.body.style.zoom = escala;
            } else {
                document.body.style.zoom = 1;
            }
        }
        window.addEventListener('resize', autoEscalar);
        window.addEventListener('DOMContentLoaded', autoEscalar);
    </script>
    <!-- FIN_AUTO_ZOOM_ANTIGRAVITY -->

</head>

<body>

    <!-- SCENE -->
    <div id="scene">
        <div class="neon-sign">COMEDY CLUB</div>

        <div class="mic-stand-container">
            <div class="mic">🎙️</div>
        </div>

        <!-- Audience -->
        <div class="audience-layer" id="audience">
            <!-- Heads generated by JS -->
        </div>

        <!-- Spotlight Mask -->
        <div id="spotlight-mask"></div>

        <!-- HUD -->
        <div id="hud">
            <div class="meter-container">
                <span class="meter-label">Rialles:</span>
                <div class="laughter-bar-bg">
                    <div class="laughter-bar-fill" id="laugh-meter"></div>
                </div>
            </div>

            <div class="controls">
                <div>
                    <span class="vol-label">VOL</span>
                    <input type="range" class="vol-slider" min="0" max="1" step="0.1" value="0.5" id="vol-slider">
                </div>
            </div>
        </div>

        <!-- Cards Area -->
        <div id="cards-container"></div>
    </div>

    <!-- SCREENS -->
    <!-- SCREEN: START -->
    <div id="start-screen" class="screen">
        <h1>STAND-UP HISTÒRIC</h1>
        <p style="font-size:1.4rem; color:#bbb; max-width:700px; line-height: 1.6;">
            Benvingut al club més dur de la història.<br>
            El públic viatja en el temps i tu has d'encertar l'humor de cada època.
        </p>
        <button class="btn-main" onclick="showSelector()">ENTRAR AL CLUB</button>
    </div>

    <!-- SCREEN: SELECTOR -->
    <div id="selector-screen" class="screen" style="display:none;">
        <h1 style="font-size:3rem; color:var(--primary-color);">TRIA LA TEVA ACTUACIÓ</h1>
        <div id="era-buttons-container"
            style="display:grid; grid-template-columns: 1fr 1fr; gap:20px; max-width:800px; margin-top:20px;">
            <!-- Buttons generated by JS -->
        </div>
        <button class="btn-main" style="margin-top:40px; font-size:1.2rem; background:#333; color:#fff;"
            onclick="location.reload()">SORTIR DEL CLUB</button>
    </div>

    <div id="round-screen" class="screen" style="display:none; background:rgba(0,0,0,0.85);">
        <h2 style="font-size:3rem; margin-bottom: 10px;">PÚBLIC DE:</h2>
        <div id="round-era"
            style="font-size:5rem; color:var(--primary-color); font-family: 'Oswald'; text-shadow: 0 5px 15px black;">
            Example Era</div>
        <p style="color:#fff; margin-top:30px; font-size: 1.5rem;">Prepara el teu material (4 Acudits)...</p>
        <button class="btn-main" onclick="startRound()">SOM-HI!</button>
    </div>

    <div id="end-screen" class="screen" style="display:none;">
        <h1 id="end-title">SHOW OVER</h1>
        <p id="end-msg" style="font-size:1.8rem; margin-top: 20px;">...</p>
        <button class="btn-main" onclick="showSelector()">TORNAR AL CAMERINO</button>
    </div>

    <!-- AUDIO -->
    <audio id="bg-jazz" loop src="audio/jazz_bg.m4a"></audio>
    <audio id="sfx-laugh" src="audio/laughter.m4a"></audio>
    <audio id="sfx-boo" src="audio/boo.m4a"></audio>

    <script>
        // --- DATA ---
        const JOKES = {
            "EDAT MITJANA": [
                { text: "La música d'avui és massa curta... només una línia? Jo sense 3 hores de gregorià no m'aixeco!", correct: true },
                { text: "He intentat fer un 'solo' a l'església i m'han excomunicat per supèrbia.", correct: true },
                { text: "No és que sigui monòton, és que soc fidel a una sola nota!", correct: true },
                { text: "Els neumes són com la meva lletra de metge: ningú sap què signifiquen exactament.", correct: true }
            ],
            "RENAIXEMENT": [
                { text: "La polifonia és com un grup de WhatsApp: tothom parla alhora i ningú s'entén.", correct: true },
                { text: "Ara tot és 'Humanisme'... abans n'hi havia prou amb resar i callar!", correct: true },
                { text: "M'agrada el Madrigal perquè puc plorar en italià i sembla culte.", correct: true },
                { text: "He imprès la meva partitura... sembla màgia negra però és Gutenberg!", correct: true }
            ],
            "BARROC": [
                { text: "Si no hi ha or, perruques i dramatisme, no és música, és soroll!", correct: true },
                { text: "El baix continu no para mai... és com la meva sogra!", correct: true },
                { text: "Més notes! Sempre falten més notes! L'horror vacui és vida!", correct: true },
                { text: "He intentat fer dieta, però el Barroc és època d'excessos!", correct: true }
            ],
            "CLASSICISME": [
                { text: "Busco parella: ha de ser simètrica, ordenada i previsible. Com una Sonata.", correct: true },
                { text: "He vist un músic plorant. L'hem multat per falta de control emocional.", correct: true },
                { text: "Tot ha d'estar clar i net. La música complicada és de mal gust.", correct: true },
                { text: "La meva perruca és més blanca i pentinada que el teu futur.", correct: true }
            ],
            "ROMANTICISME": [
                { text: "El director m'ha demanat tempo constant i l'he acomiadat. Visca el Rubato!", correct: true },
                { text: "Estic tan trist que he escrit 4 simfonies sobre la meva exdona.", correct: true },
                { text: "L'orquestra és tan gran que necessitem un mapa per trobar el solista.", correct: true },
                { text: "Soc un virtuós incomprensible i m'encanta.", correct: true }
            ],
            "SEGLE XX": [
                { text: "He gravat el soroll d'una nevera i diuen que és art. 500€ l'entrada!", correct: true },
                { text: "La melodia està sobrevalorada. Jo prefereixo el soroll blanc.", correct: true },
                { text: "He trencat la tonalitat i ara les notes fan el que volen. Anarquia musical!", correct: true },
                { text: "El silenci és la millor música. (4'33'')", correct: true }
            ]
        };

        const ERAS = Object.keys(JOKES);
        let currentEra = "";
        let meter = 0; // 0 to 100
        let currentRound = 0;
        let eraQueue = [];
        let jokesQueue = []; // Queue of jokes for the current era
        let completedEras = []; // Track completed eras
        let isWorldTour = false;

        // --- SETUP ---
        // Generate Audience Heads
        const audContainer = document.getElementById('audience');
        for (let i = 0; i < 18; i++) {
            let h = document.createElement('div');
            h.className = 'head';
            h.style.background = `rgb(${Math.random() * 20},${Math.random() * 20},${Math.random() * 20})`;
            h.style.height = (80 + Math.random() * 50) + 'px';
            audContainer.appendChild(h);
        }

        // Spotlight Logic
        document.addEventListener('mousemove', (e) => {
            const mask = document.getElementById('spotlight-mask');
            mask.style.background = `radial-gradient(circle 250px at ${e.clientX}px ${e.clientY}px, rgba(0,0,0,0) 0%, rgba(0,0,0,0.92) 100%)`;
        });

        // Volume
        document.getElementById('vol-slider').addEventListener('input', (e) => {
            document.querySelectorAll('audio').forEach(a => a.volume = e.target.value);
        });

        // --- NAVIGATION ---
        function showSelector() {
            // Hide everything else
            document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
            document.getElementById('selector-screen').style.display = 'flex';

            // Render Buttons
            const container = document.getElementById('era-buttons-container');
            container.innerHTML = '';

            // 1. World Tour Button
            const btnAll = document.createElement('button');
            btnAll.className = 'btn-main';
            btnAll.innerText = 'GIRA MUNDIAL (TOTES)';
            btnAll.style.gridColumn = "span 2";
            btnAll.style.background = "linear-gradient(45deg, #ff00de, #ffd700)";
            btnAll.onclick = () => startGame("ALL");
            container.appendChild(btnAll);

            // 2. Individual Eras
            ERAS.forEach(era => {
                const btn = document.createElement('button');
                btn.className = 'btn-main';
                btn.innerText = era;
                btn.style.fontSize = "1.2rem";
                btn.style.padding = "15px";
                btn.style.marginTop = "0";

                if (completedEras.includes(era)) {
                    btn.style.background = "#28a745"; // Green
                    btn.style.color = "#fff";
                    btn.innerText += " ✅";
                } else {
                    btn.style.background = "rgba(255,255,255,0.1)";
                    btn.style.border = "2px solid var(--primary-color)";
                    btn.style.color = "var(--primary-color)";
                }

                btn.onclick = () => startGame(era);
                container.appendChild(btn);
            });
        }

        function startGame(selection) {
            document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');

            // Audio check
            const bgm = document.getElementById('bg-jazz');
            bgm.volume = document.getElementById('vol-slider').value;
            if (bgm.paused) {
                bgm.play().catch(e => console.log("Audio autoplay block"));
            }

            if (selection === "ALL") {
                isWorldTour = true;
                eraQueue = ["EDAT MITJANA", "RENAIXEMENT", "BARROC", "CLASSICISME", "ROMANTICISME", "SEGLE XX"];
            } else {
                isWorldTour = false;
                eraQueue = [selection];
            }

            currentRound = 0;
            prepareRound();
        }

        function prepareRound() {
            if (eraQueue.length === 0) {
                // VICTORY (End of queue)
                gameOver(true);
                return;
            }

            currentRound++;
            currentEra = eraQueue.shift(); // Take first in queue (Sequential)

            // Prepare Jokes Queue for this Era
            let validJokes = JOKES[currentEra].filter(j => j.correct);
            jokesQueue = [...validJokes];
            jokesQueue.sort(() => Math.random() - 0.5);

            // Interstitial
            const rs = document.getElementById('round-screen');
            rs.style.display = 'flex';
            document.getElementById('round-era').innerText = currentEra;

            // Reset Meter
            meter = 30; // Start with a bit of confidence
            updateMeter();
        }

        function startRound() {
            document.getElementById('round-screen').style.display = 'none';
            generateCards();
        }

        function generateCards() {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            // Check if we have jokes left
            if (jokesQueue.length === 0) {
                // Era Complete!
                // If single era mode, mark as completed
                if (!isWorldTour) {
                    if (!completedEras.includes(currentEra)) {
                        completedEras.push(currentEra);
                    }
                }
                setTimeout(prepareRound, 1000);
                return;
            }

            // 1 Correct from Current Era Queue
            let correctJoke = jokesQueue.pop();

            // 3 Distractors from Other Eras
            let otherEras = ERAS.filter(e => e !== currentEra);
            otherEras.sort(() => Math.random() - 0.5);

            let dEr1 = otherEras[0];
            let dEr2 = otherEras[1];
            let dEr3 = otherEras[2];

            // Helper to get random joke
            const getRand = (era) => JOKES[era][Math.floor(Math.random() * JOKES[era].length)];

            let hand = [
                { text: correctJoke.text, isMatch: true },
                { text: getRand(dEr1).text, isMatch: false },
                { text: getRand(dEr2).text, isMatch: false },
                { text: getRand(dEr3).text, isMatch: false }
            ];

            // Shuffle
            hand.sort(() => Math.random() - 0.5);

            hand.forEach(item => {
                let card = document.createElement('div');
                card.className = 'note-card';
                card.innerText = item.text;
                card.onclick = (e) => selectJoke(item, card, e);
                container.appendChild(card);
            });
        }

        function selectJoke(item, card, e) {
            const container = document.getElementById('cards-container');
            Array.from(container.children).forEach(c => c.style.pointerEvents = 'none');

            if (item.isMatch) {
                // SUCCESS
                meter += 20; // 5 * 20 = 100 (but max is 100). 4 * 25 is better. 20 is fine.
                spawnBubble("😂", e.clientX, e.clientY);
                spawnBubble("👏", e.clientX + 50, e.clientY - 50);

                let sfx = document.getElementById('sfx-laugh');
                sfx.currentTime = 0; sfx.play().catch(e => { });

                animateAudience(true);
                card.style.background = "#d4edda";
                card.style.transform = "scale(1.05)";
                card.style.borderColor = "#28a745";
            } else {
                // FAIL
                meter -= 15;
                spawnBubble("🍅", e.clientX, e.clientY);
                spawnBubble("😤", e.clientX - 30, e.clientY - 40);

                let sfx = document.getElementById('sfx-boo');
                sfx.currentTime = 0; sfx.play().catch(e => { });

                card.style.background = "#f8d7da";
                card.style.transform = "rotate(5deg)";
                card.style.borderColor = "#dc3545";
            }

            updateMeter();

            if (meter >= 100) {
                // Max meter just means good job, but we must finish jokes.
                meter = 100;
                setTimeout(generateCards, 1200);
            } else if (meter <= 0) {
                setTimeout(() => gameOver(false), 1500); // Game Over
            } else {
                // Next Question
                setTimeout(generateCards, 1200);
            }
        }

        function updateMeter() {
            if (meter > 100) meter = 100;
            if (meter < 0) meter = 0;
            document.getElementById('laugh-meter').style.width = meter + "%";

            // Dynamic color
            const bar = document.getElementById('laugh-meter');
            if (meter < 30) bar.style.background = "linear-gradient(90deg, #ff4d4d, #ff8800)";
            else if (meter > 70) bar.style.background = "linear-gradient(90deg, #00b09b, #96c93d)";
            else bar.style.background = "linear-gradient(90deg, #ff8800, #ffd700)";
        }

        function spawnBubble(text, x, y) {
            const b = document.createElement('div');
            b.className = 'bubble';
            b.innerText = text;
            b.style.left = x + 'px';
            b.style.top = y + 'px';
            document.body.appendChild(b);
            setTimeout(() => b.remove(), 1500);
        }

        function animateAudience(laughing) {
            const heads = document.querySelectorAll('.head');
            if (laughing) {
                heads.forEach(h => h.classList.add('laughing'));
                setTimeout(() => heads.forEach(h => h.classList.remove('laughing')), 2000);
            }
        }

        function gameOver(won) {
            const es = document.getElementById('end-screen');
            es.style.display = 'flex';
            const h1 = document.getElementById('end-title');
            const msg = document.getElementById('end-msg');

            if (won) {
                h1.innerText = "🏆 LLEGENDA DE LA COMÈDIA! 🏆";
                h1.style.color = "gold";
                h1.style.textShadow = "0 0 30px gold";
                if (isWorldTour) {
                    msg.innerText = "Has conquerit la Gira Mundial completa! Netflix et vol fer un especial.";
                } else {
                    msg.innerText = "Has triomfat en aquesta època! El públic t'adora.";
                }
            } else {
                h1.innerText = "☠️ CANCEL·LAT ☠️";
                h1.style.color = "red";
                h1.style.textShadow = "0 0 30px red";
                msg.innerText = "El públic t'ha menjat viu. Més sort a la pròxima reencarnació.";
            }

            // Update button to go back to selector
            const btn = es.querySelector('button');
            btn.innerText = "TORNAR AL CAMERINO";
            btn.onclick = () => showSelector();
        }
    </script>
</body>

</html>
