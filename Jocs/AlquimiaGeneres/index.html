<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alquímia de Gèneres ⚗️</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-lab: #1a1a2e;
            --bubble-base: #16213e;
            --highlight: #0f3460;
            --accent: #e94560;
            --text: #fff;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Comfortaa', cursive;
            background-color: var(--bg-lab);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        header {
            padding: 1rem;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
        }

        .stats {
            font-size: 1rem;
            color: #aaa;
        }

        .btn-enc {
            background: var(--accent);
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 15px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
        }

        /* Game Area */
        #lab-area {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at center, #2a2a4e 0%, #1a1a2e 100%);
        }

        /* Sidebar / Inventory */
        #inventory {
            height: 140px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            overflow-x: auto;
            padding: 0 1rem;
            gap: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 20;
        }

        /* Bubbles */
        .bubble {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: grab;
            position: absolute;
            /* For main area */
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
            font-size: 0.8rem;
            color: white;
            padding: 5px;
        }

        .bubble:hover {
            transform: scale(1.1);
            border-color: var(--accent);
            z-index: 100;
        }

        .bubble:active {
            cursor: grabbing;
        }

        .bubble-icon {
            font-size: 1.5rem;
            margin-bottom: 2px;
            pointer-events: none;
        }

        .bubble-name {
            pointer-events: none;
            line-height: 1;
        }

        /* Inventory Items (Static relative to inventory) */
        .inv-item {
            position: relative;
            flex-shrink: 0;
            width: 70px;
            height: 70px;
            font-size: 0.7rem;
        }

        /* New Discovery Modal */
        #discovery-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 200;
            animation: fadeIn 0.5s;
        }

        /* Encyclopedia Modal */
        #enc-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            flex-direction: column;
            z-index: 200;
            padding: 2rem;
        }

        #enc-content {
            flex: 1;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 1rem;
            padding: 1rem;
        }

        .enc-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1;
        }

        .enc-unknown {
            opacity: 0.5;
            border: 1px dashed #555;
        }

        .enc-icon {
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .enc-name {
            font-size: 0.8rem;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            color: white;
            border: none;
            font-size: 2rem;
            cursor: pointer;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .new-item-icon {
            font-size: 5rem;
            margin-bottom: 1rem;
            animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .new-item-name {
            font-size: 2rem;
            color: var(--accent);
            margin-bottom: 2rem;
        }

        @keyframes pop {
            from {
                transform: scale(0);
            }

            to {
                transform: scale(1);
            }
        }

        .btn-continue {
            background: white;
            color: var(--bg-lab);
            border: none;
            padding: 10px 30px;
            border-radius: 20px;
            font-size: 1.2rem;
            cursor: pointer;
            font-weight: bold;
        }
    </style>

    <!-- INICIO_AUTO_ZOOM_ANTIGRAVITY -->
    <script>
        function autoEscalar() {
            const anchoDiseno = 1920; 
            const escala = window.innerWidth / anchoDiseno;
            if (escala < 1) {
                document.body.style.zoom = escala;
            } else {
                document.body.style.zoom = 1;
            }
        }
        window.addEventListener('resize', autoEscalar);
        window.addEventListener('DOMContentLoaded', autoEscalar);
    </script>
    <!-- FIN_AUTO_ZOOM_ANTIGRAVITY -->

</head>

            'guitarra_electrica': { name: 'Guitarra Elèctrica', icon: '🎸', parents: ['llaud_ren', 'electronica'], era: 'Segle XX', desc: 'Icona del rock i la música moderna.' },
            'electronica': { name: 'Electrònica', icon: '🤖', parents: ['musica', 'musica'], era: 'Segle XX', desc: 'Música produïda amb mitjans electrònics.' },
            'pop': { name: 'Pop', icon: '🍭', parents: ['rock', 'poble'], era: 'Segle XX', desc: 'Música popular de masses.' },
            'hiphop': { name: 'Hip Hop', icon: '🎤', parents: ['poble', 'poble'], era: 'Segle XX', desc: 'Cultura urbana basada en el rap i el ritme.' },
            'banda_sonora': { name: 'Banda Sonora', icon: '🎥', parents: ['simfonia', 'teatre'], era: 'Segle XX', desc: 'Música per al cinema.' },
            'musical': { name: 'Musical', icon: '🎬', parents: ['opera', 'dansa'], era: 'Segle XX', desc: 'Teatre musical modern, hereu de l\'òpera.' },
            'videoclip': { name: 'Videoclip', icon: '📺', parents: ['pop', 'teatre'], era: 'Segle XX', desc: 'Fusió de música i imatge.' },
            'minimalisme': { name: 'Minimalisme', icon: '➖', parents: ['musica', 'musica'], era: 'Segle XX', desc: 'Música basada en la repetició i petits canvis.' },
            'aleatoria': { name: 'Aleatòria', icon: '🎲', parents: ['musica', 'teatre'], era: 'Segle XX', desc: 'Música on l\'atzar juga un paper important.' },
            'neoclassicisme': { name: 'Neoclassicisme', icon: '🏛️', parents: ['classicisme', 'musica'], era: 'Segle XX', desc: 'Retorn a les formes clàssiques amb llenguatge modern.' },
            'sintetitzador': { name: 'Sintetitzador', icon: '🎹', parents: ['piano', 'electronica'], era: 'Segle XX', desc: 'Instrument capaç de crear qualsevol so.' },
            'bateria': { name: 'Bateria', icon: '🥁', parents: ['musica', 'poble'], era: 'Segle XX', desc: 'Conjunt de percussió clau en el jazz i el rock.' },
            'dj': { name: 'DJ', icon: '🎧', parents: ['electronica', 'poble'], era: 'Segle XX', desc: 'Artista que crea música barrejant gravacions.' },
            'stravinsky': { name: 'Stravinsky', icon: '🐦', parents: ['ballet', 'dodecafonisme'], era: 'Segle XX', desc: 'El camaleó de la música del segle XX.' },
            'beatles': { name: 'The Beatles', icon: '🐞', parents: ['pop', 'rock'], era: 'Segle XX', desc: 'El grup que ho va canviar tot.' }
        };

        // --- STATE ---
        let discovered = ['teatre', 'musica', 'esglesia', 'poble'];
        let activeBubbles = [];
        let idCounter = 0;

        // --- AUDIO ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'pop') {
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.1);
            } else if (type === 'merge') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
            }
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        // --- LOGIC ---

        function init() {
            document.getElementById('total-count').textContent = Object.keys(ELEMENTS).length;
            renderInventory();
            updateStats();

            // Add Nova Idea Button
            const header = document.querySelector('header div');
            const btn = document.createElement('button');
            btn.className = 'btn-enc';
            btn.innerText = 'Nova Idea 💡';
            btn.style.marginLeft = '10px';
            btn.style.background = '#ff9800';
            btn.onclick = novaIdea;
            header.appendChild(btn);
        }

        function novaIdea() {
            // Find an undiscovered element that CAN be made
            const possibleDiscoveries = [];

            Object.keys(ELEMENTS).forEach(key => {
                if (discovered.includes(key)) return; // Already have it

                const data = ELEMENTS[key];
                if (!data.parents) return; // Base element

                const p1 = data.parents[0];
                const p2 = data.parents[1];

                if (discovered.includes(p1) && discovered.includes(p2)) {
                    possibleDiscoveries.push({ key: key, era: data.era, parents: [p1, p2] });
                }
            });

            if (possibleDiscoveries.length === 0) {
                alert("Has descobert tot el que pots amb el que tens! Intenta combinar coses noves.");
                return;
            }

            // Prioritize elements that are parents of OTHER undiscovered elements (unlockers)
            // This helps the user "create new things" as requested
            const unlockers = possibleDiscoveries.filter(pd => {
                // Check if pd.key is a parent of any undiscovered element
                return Object.values(ELEMENTS).some(el =>
                    !discovered.includes(el) && el.parents && el.parents.includes(pd.key)
                );
            });

            // If we have unlockers, pick one of them. Otherwise pick any possible discovery.
            const pool = unlockers.length > 0 ? unlockers : possibleDiscoveries;
            const target = pool[Math.floor(Math.random() * pool.length)];

            // Give the element directly to the user
            if (!discovered.includes(target.key)) {
                discovered.push(target.key);
                showDiscovery(target.key);
                renderInventory();
                updateStats();
                spawnBubble(target.key); // Also spawn it so they can use it
            }
        }

        function renderInventory() {
            const inv = document.getElementById('inventory');
            inv.innerHTML = '';
            discovered.forEach(key => {
                const data = ELEMENTS[key];
                const el = document.createElement('div');
                el.className = 'bubble inv-item';
                el.innerHTML = `<div class="bubble-icon">${data.icon}</div><div class="bubble-name">${data.name}</div>`;
                el.onclick = () => spawnBubble(key);
                inv.appendChild(el);
            });
        }

        function spawnBubble(key, x, y) {
            const lab = document.getElementById('lab-area');
            const data = ELEMENTS[key];

            const b = document.createElement('div');
            b.className = 'bubble';
            b.innerHTML = `<div class="bubble-icon">${data.icon}</div><div class="bubble-name">${data.name}</div>`;

            if (!x) x = Math.random() * (lab.clientWidth - 100) + 50;
            if (!y) y = Math.random() * (lab.clientHeight - 100) + 50;

            b.style.left = x + 'px';
            b.style.top = y + 'px';

            const bubbleObj = {
                id: idCounter++,
                elementId: key,
                el: b,
                x: x,
                y: y
            };

            activeBubbles.push(bubbleObj);
            lab.appendChild(b);
            playSound('pop');

            makeDraggable(bubbleObj);
        }

        function makeDraggable(bubbleObj) {
            const el = bubbleObj.el;
            let isDragging = false;
            let startX, startY;

            const onDown = (e) => {
                isDragging = true;
                const clientX = e.clientX || e.touches[0].clientX;
                const clientY = e.clientY || e.touches[0].clientY;
                startX = clientX - bubbleObj.x;
                startY = clientY - bubbleObj.y;
                el.style.zIndex = 1000;
            };

            const onMove = (e) => {
                if (!isDragging) return;
                e.preventDefault();
                const clientX = e.clientX || e.touches[0].clientX;
                const clientY = e.clientY || e.touches[0].clientY;

                bubbleObj.x = clientX - startX;
                bubbleObj.y = clientY - startY;

                el.style.left = bubbleObj.x + 'px';
                el.style.top = bubbleObj.y + 'px';

                checkCollisions(bubbleObj);
            };

            const onUp = () => {
                isDragging = false;
                el.style.zIndex = '';
            };

            el.addEventListener('mousedown', onDown);
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onUp);

            el.addEventListener('touchstart', onDown);
            window.addEventListener('touchmove', onMove, { passive: false });
            window.addEventListener('touchend', onUp);
        }

        function checkCollisions(source) {
            const threshold = 60;

            for (let i = 0; i < activeBubbles.length; i++) {
                const target = activeBubbles[i];
                if (source.id === target.id) continue;

                const dx = source.x - target.x;
                const dy = source.y - target.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < threshold) {
                    const result = getCombination(source.elementId, target.elementId);
                    if (result) {
                        mergeBubbles(source, target, result);
                        break;
                    }
                }
            }
        }

        function getCombination(a, b) {
            for (const [key, data] of Object.entries(ELEMENTS)) {
                if (data.parents) {
                    if ((data.parents[0] === a && data.parents[1] === b) ||
                        (data.parents[0] === b && data.parents[1] === a)) {
                        return key;
                    }
                }
            }
            return null;
        }

        function mergeBubbles(b1, b2, resultKey) {
            b1.el.remove();
            b2.el.remove();

            activeBubbles = activeBubbles.filter(b => b.id !== b1.id && b.id !== b2.id);

            const midX = (b1.x + b2.x) / 2;
            const midY = (b1.y + b2.y) / 2;

            spawnBubble(resultKey, midX, midY);
            playSound('merge');

            if (!discovered.includes(resultKey)) {
                discovered.push(resultKey);
                showDiscovery(resultKey);
                renderInventory();
                updateStats();

                if (discovered.length === Object.keys(ELEMENTS).length) {
                    if (typeof Rewards !== 'undefined') {
                        Rewards.unlockCard(
                            'alquimia_mix',
                            'Mestre Alquimista',
                            'Has descobert tots els elements musicals!',
                            '../../img/card_alquimia.png'
                        );
                    }
                }
            }
        }

        function showDiscovery(key) {
            const data = ELEMENTS[key];
            document.getElementById('modal-icon').textContent = data.icon;
            document.getElementById('modal-name').textContent = data.name;

            // Fix: Append description to the modal container directly
            const modal = document.getElementById('discovery-modal');
            let descEl = document.getElementById('modal-desc');

            if (!descEl) {
                descEl = document.createElement('p');
                descEl.id = 'modal-desc';
                descEl.style.color = '#ccc';
                descEl.style.marginTop = '10px';
                descEl.style.textAlign = 'center';
                descEl.style.padding = '0 20px';
                // Insert before the button (last child)
                modal.insertBefore(descEl, modal.lastElementChild);
            }
            descEl.textContent = data.desc || "Un nou descobriment fascinant!";

            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('discovery-modal').style.display = 'none';
        }

        function updateStats() {
            document.getElementById('count').textContent = discovered.length;
        }

        // --- ENCYCLOPEDIA ---
        function openEnc() {
            const modal = document.getElementById('enc-modal');
            const content = document.getElementById('enc-content');
            content.innerHTML = '';

            // Group by Era
            const eras = ['General', 'Edat Mitjana', 'Renaixement', 'Barroc', 'Classicisme', 'Romanticisme', 'Segle XX'];

            eras.forEach(era => {
                const section = document.createElement('div');
                section.style.width = '100%';
                section.style.marginBottom = '20px';

                const title = document.createElement('h3');
                title.innerText = era;
                title.style.color = 'var(--accent)';
                title.style.borderBottom = '1px solid rgba(255,255,255,0.2)';
                title.style.paddingBottom = '5px';
                section.appendChild(title);

                const grid = document.createElement('div');
                grid.style.display = 'grid';
                grid.style.gridTemplateColumns = 'repeat(auto-fill, minmax(100px, 1fr))';
                grid.style.gap = '1rem';

                // Find elements in this era
                const eraElements = Object.keys(ELEMENTS).filter(key => ELEMENTS[key].era === era);

                eraElements.forEach(key => {
                    const data = ELEMENTS[key];
                    const isDiscovered = discovered.includes(key);

                    const el = document.createElement('div');
                    el.className = `enc-item ${isDiscovered ? '' : 'enc-unknown'}`;

                    if (isDiscovered) {
                        el.innerHTML = `<div class="enc-icon">${data.icon}</div><div class="enc-name">${data.name}</div>`;
                        el.title = data.desc || "";
                    } else {
                        el.innerHTML = `<div class="enc-icon">❓</div><div class="enc-name">????</div>`;
                    }
                    grid.appendChild(el);
                });

                section.appendChild(grid);
                content.appendChild(section);
            });

            modal.style.display = 'flex';
        }

        function closeEnc() {
            document.getElementById('enc-modal').style.display = 'none';
        }

        init();
    </script>
