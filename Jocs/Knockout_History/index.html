                        <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[150%] h-[2px] bg-neon-red -rotate-45 z-0"></div>
                    </div>

                    <h2 className="text-6xl md:text-8xl text-white font-black mb-4 uppercase tracking-tighter italic drop-shadow-[0_5px_0_rgba(244,63,94,1)] z-20">
                        {boss.name.split('(')[0]}<span className="text-2xl block text-neon-red font-normal tracking-widest mt-2">{boss.name.split('(')[1]?.replace(')', '') || ''}</span>
                    </h2>

                    <div className="bg-neon-red/10 border border-neon-red p-6 max-w-3xl backdrop-blur-sm z-20 mb-10">
                        <p className="text-3xl text-white font-bold italic">"{boss.intro}"</p>
                    </div>

                    <button
                        onClick={onFight}
                        className="z-20 px-20 py-8 bg-white hover:bg-slate-200 text-black text-5xl font-black uppercase tracking-tighter shadow-[0_0_50px_rgba(255,255,255,0.4)] transition-transform hover:scale-105 active:scale-95 clip-path-polygon"
                        style={{ clipPath: 'polygon(10% 0, 100% 0, 90% 100%, 0% 100%)' }}
                    >
                        DING DING! 🔔
                    </button>
                </motion.div>
            </div>
        );

        const VictoryScreen = ({ onNext }) => (
            <div className="h-full flex flex-col items-center justify-center bg-green-900/90 text-center relative">
                <div className="absolute inset-0 bg-[url('img/fons.jpg')] bg-cover bg-center opacity-30 grayscale mix-blend-multiply"></div>
                <motion.div
                    initial={{ scale: 0.5, opacity: 0, rotate: -10 }}
                    animate={{ scale: 1, opacity: 1, rotate: 0 }}
                    className="z-10 p-16 border-y-8 border-neon-green bg-black/80 backdrop-blur-md transform -skew-x-6"
                >
                    <h1 className="text-8xl text-green-400 font-black mb-4 italic tracking-tighter">KNOCKOUT!</h1>
                    <p className="text-3xl text-white mb-10 font-bold uppercase tracking-widest">Victòria de l'aspirant!</p>
                    <button
                        onClick={onNext}
                        className="px-12 py-5 bg-green-600 hover:bg-green-500 text-white font-black text-2xl uppercase shadow-lg shadow-green-500/50"
                    >
                        SEGÜENT ROUND &gt;&gt;
                    </button>
                </motion.div>
            </div>
        );

        const GameOverScreen = ({ onRetry }) => (
            <div className="h-full flex flex-col items-center justify-center bg-black text-center relative overflow-hidden">
                <div className="absolute inset-0 bg-[url('img/fons.jpg')] bg-cover bg-center opacity-20 grayscale brightness-50"></div>

                <motion.div
                    initial={{ y: -50, opacity: 0 }}
                    animate={{ y: 0, opacity: 1 }}
                    transition={{ duration: 0.5, times: [0, 0.2, 0.4, 0.6, 0.8, 1], repeat: Infinity, repeatDelay: 5 }} // Glitch effect roughly
                    className="z-10"
                >
                    <h1 className="text-[12rem] text-neon-red font-black leading-none tracking-tighter opacity-80 mix-blend-screen glitch-text">T.K.O.</h1>
                </motion.div>

                <p className="text-2xl text-slate-500 mb-12 font-mono uppercase tracking-widest mt-4">Has estat derrotat.</p>

                <button
                    onClick={onRetry}
                    className="z-20 px-12 py-4 bg-transparent border-2 border-white text-white hover:bg-white hover:text-black font-bold text-2xl uppercase tracking-[0.5em] transition-all duration-300"
                >
                    TORNA-HI
                </button>
            </div>
        );


        const RankingScreen = ({ currentRound, onContinue }) => {
            // Rank progression: Start at 50.
            // R1 beat -> 40. R2 -> 25. R3 -> 15. R4 -> 7. R5 -> 3. R6 -> 1.
            const ranks = [50, 40, 25, 15, 7, 3, 1];
            const prevRank = ranks[currentRound - 1] || 50;
            const targetRank = ranks[currentRound];

            const [displayRank, setDisplayRank] = useState(prevRank);

            useEffect(() => {
                // Animate decreasing number
                let start = prevRank;
                const end = targetRank;
                if (start === end) return;

                const timer = setInterval(() => {
                    start--;
                    setDisplayRank(start);
                    if (start <= end) {
                        clearInterval(timer);
                    }
                }, 50); // Speed of count
                return () => clearInterval(timer);
            }, [prevRank, targetRank]);

            return (
                <div className="h-full flex flex-col items-center justify-center bg-black/95 text-center relative overflow-hidden">
                    <div className="absolute inset-0 bg-[url('img/fons.jpg')] bg-cover bg-center opacity-30 grayscale blur-sm"></div>

                    <h2 className="text-neon-gold text-4xl font-black uppercase tracking-widest mb-4 z-10 drop-shadow-lg">RÀNQUING MUNDIAL</h2>

                    <div className="z-10 flex flex-col items-center justify-center mb-12 transform scale-125">
                        <div className="text-stone-500 text-2xl uppercase tracking-widest mb-2">Posició Actual</div>
                        <div className="text-[10rem] font-black text-white leading-none drop-shadow-[0_0_50px_rgba(255,255,255,0.5)]">
                            <span className="text-neon-blue text-6xl align-top mr-2">#</span>
                            {displayRank}
                        </div>
                        {displayRank < prevRank && (
                            <motion.div
                                initial={{ opacity: 0, y: 20 }}
                                animate={{ opacity: 1, y: 0 }}
                                className="text-green-500 font-bold text-3xl mt-4 uppercase"
                            >
                                ▲ Escalant Posicions!
                            </motion.div>
                        )}
                    </div>

                    <div className="z-10 w-full max-w-xl border-t-2 border-stone-700 py-8 bg-black/50 backdrop-blur-md">
                        <p className="text-stone-300 text-xl uppercase tracking-widest mb-4">PRÒXIM RIVAL</p>
                        <h3 className="text-4xl text-neon-red font-black italic">
                            {ROUND_DATA[currentRound].boss.name.split('(')[0]}
                        </h3>
                        {currentRound === 5 && <p className="text-neon-gold font-bold text-lg mt-2">👑 EL CAMPIÓ 👑</p>}
                    </div>

                    <div className="z-10 mt-12">
                        <button
                            onClick={onContinue}
                            className="px-12 py-4 bg-neon-gold hover:bg-yellow-400 text-black font-black text-2xl uppercase tracking-widest shadow-lg transform transition-all hover:scale-105"
                        >
                            CONTINUAR &gt;&gt;
                        </button>
                    </div>
                </div>
            );
        };

        const FinalVictoryScreen = () => (
            <div className="h-full flex flex-col items-center justify-center bg-yellow-900/90 text-center relative overflow-hidden">
                <div className="absolute inset-0 bg-gradient-to-t from-neon-gold/20 to-black z-0"></div>
                {/* Falling confeti or sparks can be added with particles, keeping it simple for now */}

                <motion.div
                    initial={{ scale: 0.8, opacity: 0 }}
                    animate={{ scale: 1, opacity: 1 }}
                    transition={{ duration: 1, type: "spring" }}
                    className="z-10 p-20 border-8 border-neon-gold bg-black/90 max-w-5xl shadow-[0_0_100px_rgba(251,191,36,0.6)]"
                >
                    <h1 className="text-8xl text-neon-gold font-black mb-8 drop-shadow-lg italic">CAMPIÓ<br />INDISCUTIBLE</h1>
                    <div className="w-full h-2 bg-gradient-to-r from-transparent via-neon-gold to-transparent mb-8"></div>
                    <p className="text-4xl text-white mb-12 font-bold uppercase">Mestre de la Història</p>
                    <div className="text-9xl animate-pulse">👑</div>
                </motion.div>
            </div>
        );

        // --- GAME ENGINE ---

        function App() {
            const [gameState, setGameState] = useState('START');
            const [currentEpochIndex, setCurrentEpochIndex] = useState(0);

            // Audio Refs
            const audioRef = React.useRef(null);

            // Stats
            const [playerLives, setPlayerLives] = useState(3);
            const [enemyLives, setEnemyLives] = useState(5);

            // Logic
            const [currentQuestion, setCurrentQuestion] = useState(null);
            const [shuffledOptions, setShuffledOptions] = useState([]);
            const [feedback, setFeedback] = useState(null);

            const levelData = ROUND_DATA[currentEpochIndex];

            // Setup
            const pickQuestion = () => {
                const pool = levelData.pool;
                const q = pool[Math.floor(Math.random() * pool.length)];

                // Shuffle options
                const sentOptions = [...q.opts];
                for (let i = sentOptions.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [sentOptions[i], sentOptions[j]] = [sentOptions[j], sentOptions[i]];
                }

                setCurrentQuestion(q);
                setShuffledOptions(sentOptions);
                setFeedback(null);
            };

            // Layout Effect to ensure full height (fix from Arena del Temps)
            useEffect(() => {
                document.getElementById('root').classList.add('h-full');
            }, []);

            const startGame = () => {
                if (audioRef.current) {
                    audioRef.current.play().catch(e => console.log("Audio play error", e));
                }
                setGameState('COACH');
            };

            const goToBossIntro = () => {
                setGameState('BOSS_INTRO');
            };

            const startCombat = () => {
                setPlayerLives(3);
                setEnemyLives(5);
                pickQuestion();
                setGameState('COMBAT');
            };

            const handleAnswer = (selected) => {
                if (feedback) return;

                if (selected === currentQuestion.ok) {
                    // HIT
                    setFeedback('HIT');
                    // Play punch sound could go here
                    setTimeout(() => {
                        const newEnemyLives = enemyLives - 1;
                        setEnemyLives(newEnemyLives);
                        if (newEnemyLives <= 0) {
                            handleWin();
                        } else {
                            pickQuestion();
                        }
                    }, 1000); // Faster pace for boxing
                } else {
                    // MISS
                    setFeedback('MISS');
                    setTimeout(() => {
                        const newPlayerLives = playerLives - 1;
                        setPlayerLives(newPlayerLives);
                        if (newPlayerLives <= 0) {
                            setGameState('GAMEOVER');
                        } else {
                            pickQuestion();
                        }
                    }, 1000);
                }
            };


            const handleWin = () => {
                setGameState('VICTORY');
            };

            const nextLevel = () => {
                const nextIdx = currentEpochIndex + 1;
                if (nextIdx >= ROUND_DATA.length) {
                    setGameState('FINAL');
                } else {
                    setCurrentEpochIndex(nextIdx);
                    // Go to Ranking Screen instead of Coach directly
                    setGameState('RANKING');
                }
            };

            const continueFromRanking = () => {
                setGameState('COACH');
            };

            const retry = () => {
                setCurrentEpochIndex(0);
                setPlayerLives(3);
                setEnemyLives(5);
                setGameState('START');
            };

            // RENDER
            return (
                <div className="w-full h-full font-sports relative overflow-hidden bg-slate-950">

                    {/* Audio */}
                    <audio ref={audioRef} id="bg-music" loop>
                        <source src="audio/Champions in the Tunnel.mp3" type="audio/mpeg" />
                    </audio>
                    {/* Volume Control */}
                    <div className="absolute bottom-4 left-4 z-[100] flex items-center bg-black/70 p-2 rounded-none border border-neon-blue gap-2 clip-corner">
                        <span className="text-xl">🔊</span>
                        <input type="range" min="0" max="1" step="0.1" defaultValue="0.5"
                            onChange={(e) => {
                                if (audioRef.current) audioRef.current.volume = e.target.value;
                            }}
                            className="w-24 accent-neon-blue cursor-pointer h-1"
                        />
                    </div>

                    <AnimatePresence mode="wait">
                        {gameState === 'START' && (
                            <motion.div key="start" className="absolute inset-0" exit={{ opacity: 0 }}>
                                <StartScreen onStart={startGame} />
                            </motion.div>
                        )}

                        {gameState === 'COACH' && (
                            <motion.div key="coach" className="absolute inset-0" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}>
                                <CoachScreen coachText={levelData.coach} onReady={goToBossIntro} />
                            </motion.div>
                        )}

                        {gameState === 'BOSS_INTRO' && (
                            <motion.div key="intro" className="absolute inset-0 z-40" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}>
                                <BossIntroScreen boss={levelData.boss} onFight={startCombat} />
                            </motion.div>
                        )}

                        {gameState === 'COMBAT' && (
                            <motion.div key="combat" className="absolute inset-0 flex flex-col bg-black overflow-hidden" initial={{ opacity: 0 }} animate={{ opacity: 1 }}>
                                {/* Moving Arena Background */}
                                <div className="absolute inset-0 bg-[url('img/fons.jpg')] bg-cover bg-center opacity-70 z-0"></div>
                                {/* Spotlights */}
                                <div className="absolute top-0 left-1/4 w-1/2 h-full bg-blue-500/10 blur-[100px] animate-pulse"></div>

                                <BoxerHUD
                                    playerLives={playerLives}
                                    enemyLives={enemyLives}
                                    enemyMaxLives={5}
                                    enemyName={levelData.boss.name.split('(')[0]}
                                    roundName={levelData.round}
                                />

                                {/* Main Fight Area */}
                                <div className="flex-1 z-10 flex flex-col items-center justify-end pb-0 w-full relative">

                                    {/* Boss (Opponent) */}
                                    <div className="absolute bottom-[-5vh] left-1/2 transform -translate-x-1/2 w-auto h-[95vh] pointer-events-none flex items-end justify-center z-0">
                                        <motion.img
                                            src={levelData.boss.image}
                                            alt="Opponent"
                                            className="max-h-full w-auto object-contain drop-shadow-[0_0_50px_rgba(0,0,0,0.8)]"
                                            animate={{
                                                y: [0, 10, 0],
                                                rotate: [0, 1, 0, -1, 0]
                                            }}
                                            transition={{
                                                duration: 2,
                                                repeat: Infinity,
                                                ease: "easeInOut"
                                            }}
                                        />
                                    </div>

                                    {/* Feedback Overlay (PUNCH!) */}
                                    <AnimatePresence>
                                        {feedback && (
                                            <div className="absolute inset-0 flex items-center justify-center z-30 pointer-events-none">
                                                {feedback === 'HIT' ? (
                                                    <motion.div
                                                        initial={{ scale: 0.2, rotate: -45, opacity: 0 }}
                                                        animate={{ scale: 2.5, rotate: 0, opacity: 1 }}
                                                        exit={{ opacity: 0 }}
                                                        className="text-white font-black text-9xl uppercase italic tracking-tighter drop-shadow-[0_10px_0_rgba(200,0,0,1)] text-stroke-red"
                                                    >
                                                        POW! 💥
                                                    </motion.div>
                                                ) : (
                                                    <motion.div
                                                        initial={{ x: -100, opacity: 0 }}
                                                        animate={{ x: 0, opacity: 1 }}
                                                        exit={{ opacity: 0 }}
                                                        className="text-slate-400 font-bold text-7xl uppercase tracking-widest bg-black/80 px-8 py-2 border-4 border-slate-600"
                                                    >
                                                        ESQUIVAT! 💨
                                                    </motion.div>
                                                )}
                                            </div>
                                        )}
                                    </AnimatePresence>

                                    {/* Question Panel (Bottom) */}
                                    <div className="w-full max-w-6xl bg-black/90 border-t-4 border-neon-blue p-6 md:p-8 z-20 backdrop-blur-lg shadow-[0_-10px_50px_rgba(0,0,0,0.8)] pb-12">
                                        <div className="flex flex-col md:flex-row gap-8 items-center">
                                            <h3 className="flex-1 text-2xl md:text-3xl text-white font-bold leading-tight text-center md:text-left drop-shadow-md">
                                                {currentQuestion?.q}
                                            </h3>

                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 w-full md:w-2/3">
                                                {shuffledOptions.map((opt, idx) => (
                                                    <button
                                                        key={idx}
                                                        onClick={() => handleAnswer(opt)}
                                                        disabled={!!feedback}
                                                        className={`
                                                            py-4 px-6 text-xl font-bold uppercase tracking-wide border-2 transition-all transform hover:-translate-y-1 active:translate-y-1
                                                            ${feedback
                                                                ? (opt === currentQuestion.ok
                                                                    ? "bg-green-600 border-green-400 text-white"
                                                                    : (feedback === 'MISS' && opt !== currentQuestion.ok ? "bg-red-900/50 border-red-800 text-slate-500" : "bg-slate-800 border-slate-700 text-slate-500"))
                                                                : "bg-slate-800 border-slate-600 text-slate-100 hover:bg-neon-blue hover:border-white hover:text-black hover:shadow-[0_0_20px_rgba(34,211,238,0.6)]"
                                                            }
                                                        `}
                                                    >
                                                        {opt}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </motion.div>
                        )}

                        {gameState === 'VICTORY' && (
                            <motion.div key="victory" className="absolute inset-0 z-50">
                                <VictoryScreen onNext={nextLevel} />
                            </motion.div>
                        )}

                        {gameState === 'GAMEOVER' && (
                            <motion.div key="gameover" className="absolute inset-0 z-50">
                                <GameOverScreen onRetry={retry} />
                            </motion.div>
                        )}

                        {gameState === 'RANKING' && (
                            <motion.div key="ranking" className="absolute inset-0 z-50" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}>
                                <RankingScreen currentRound={currentEpochIndex} onContinue={continueFromRanking} />
                            </motion.div>
                        )}

                        {gameState === 'FINAL' && (
                            <motion.div key="final" className="absolute inset-0 z-50">
                                <FinalVictoryScreen />
                            </motion.div>
                        )}

                    </AnimatePresence>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
