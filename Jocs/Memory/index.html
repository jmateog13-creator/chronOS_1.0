<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Musical Vintage</title>
    <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&family=Courier+Prime:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --table-color: #5d4037;
            --wood-grain: #4e342e;
            --card-bg: #fdfbf7;
            --ink-color: #2c2c2c;
            --accent: #d35400;
            --shadow: rgba(0, 0, 0, 0.4);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--table-color);
            background-image: url('img/fondo.jpg');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            color: var(--ink-color);
            font-family: 'Courier Prime', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            overflow-x: hidden;
        }

        /* NOTEBOOK HEADER */
        header {
            width: 100%;
            max-width: 900px;
            margin-top: 20px;
            padding: 15px 30px;
            background: #fff;
            background-image: linear-gradient(#e1e1e1 1px, transparent 1px);
            background-size: 100% 1.5em;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transform: rotate(-1deg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 2px;
            position: relative;
            z-index: 10;
        }

        header::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            width: 150px;
            height: 20px;
            background: rgba(255, 255, 255, 0.5);
            transform: rotate(2deg);
            z-index: -1;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-family: 'Indie Flower', cursive;
            font-size: 2.5rem;
            margin: 0;
            color: var(--ink-color);
            text-decoration: underline wavy var(--accent);
        }

        .score-board {
            display: flex;
            gap: 20px;
            font-family: 'Indie Flower', cursive;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .score-item {
            padding: 5px 15px;
            border-bottom: 2px solid transparent;
        }

        .score-item.active {
            border-bottom: 3px solid var(--accent);
            color: var(--accent);
            transform: scale(1.1);
        }

        /* GAME BOARD */
        #game-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            max-width: 900px;
            margin: 30px auto;
            perspective: 1000px;
            padding: 20px;
        }

        /* POLAROID CARD */
        .card {
            width: 140px;
            height: 170px;
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }

        .card:hover {
            transform: scale(1.05) rotate(2deg);
            z-index: 5;
        }

        .card.flipped {
            transform: rotateY(180deg) scale(1.1);
            z-index: 10;
        }

        .card.matched {
            transform: rotateY(180deg) scale(1);
            pointer-events: none;
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 4px;
            box-shadow: 2px 2px 8px var(--shadow);
            background: var(--card-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* BACK OF CARD */
        .card-back {
            background-color: #2c3e50;
            background-image:
                radial-gradient(#f1c40f 15%, transparent 16%),
                radial-gradient(#f1c40f 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            border: 8px solid white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-back::after {
            content: '?';
            font-family: 'Indie Flower', cursive;
            font-size: 4rem;
            color: white;
            text-shadow: 2px 2px 0 #000;
        }

        /* FRONT OF CARD (POLAROID) */
        .card-front {
            transform: rotateY(180deg);
            padding: 10px 10px 30px 10px;
            /* Big bottom padding for text */
            box-sizing: border-box;
            background: white;
        }

        .polaroid-frame {
            width: 100%;
            height: 125px;
            /* Square-ish image area */
            background: #eee;
            border: 1px solid #ddd;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: sepia(30%) contrast(1.1);
            /* Vintage photo effect */
        }

        .card-text {
            font-family: 'Indie Flower', cursive;
            font-size: 1.2rem;
            color: #333;
            text-align: center;
            line-height: 1;
        }

        /* Mode Selector */
        #mode-selector {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .arcade-btn {
            background: var(--card-bg);
            color: var(--ink-color);
            font-family: 'Courier Prime';
            font-weight: bold;
            font-size: 1.5rem;
            padding: 15px 30px;
            border: none;
            box-shadow: 5px 5px 0 #000;
            cursor: pointer;
            margin: 10px;
            transform: rotate(-2deg);
            transition: transform 0.2s;
        }

        .arcade-btn:hover {
            transform: scale(1.1) rotate(0deg);
        }

        /* CPU Feedback */
        #cpu-feedback {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 100;
        }

        .polaroid-cpu {
            width: 120px;
            background: white;
            padding: 10px 10px 30px 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transform: rotate(-5deg);
        }

        .bubble {
            position: absolute;
            bottom: 140px;
            right: 20px;
            background: white;
            padding: 15px;
            border-radius: 20px;
            font-family: 'Indie Flower';
            font-size: 1.2rem;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            width: 150px;
            text-align: center;
        }

        .bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            right: 20px;
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: white transparent;
        }

        .bubble.show {
            opacity: 1;
        }

        #turn-indicator {
            margin: 10px 0;
            font-family: 'Indie Flower';
            font-size: 1.8rem;
            background: white;
            padding: 5px 15px;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
            transform: rotate(1deg);
        }
    </style>
</head>

<body>

    <div id="mode-selector">
        <h1 style="color: white; text-decoration: none; margin-bottom: 40px; font-size: 3rem;">MEMORY MUSICAL</h1>

        <div style="margin-bottom: 30px; text-align: center;">
            <p style="font-family: 'Courier Prime'; color: #fff; font-size: 1.2rem; max-width: 600px;">
                Troba les parelles de compositors i les seves obres mestres!
                <br>Una col·lecció de cromos històrics barrejats.
                <br>Guanya 3 rondes per derrotar el Rival!
            </p>
        </div>

        <div>
            <button class="arcade-btn" onclick="startGame()">JUGAR</button>
        </div>
    </div>

    <header>
        <div onclick="location.reload()" style="cursor: pointer; font-size: 1.5rem;">⬅</div>
        <h1>Col·lecció de Cromos</h1>
        <div class="score-board">
            <div id="score-player" class="score-item active">JO: 0</div>
            <div style="font-size: 1rem; align-self: center;">RONDES: <span id="round-display">0 - 0</span></div>
            <div id="score-cpu" class="score-item">RIVAL: 0</div>
        </div>
    </header>

    <div id="turn-indicator">Comença tu!</div>

    <div id="game-container">
        <!-- Cards injected here -->
    </div>

    <audio id="bg-music" loop>
        <source src="audio/Soft Corners of the Mind.m4a" type="audio/mpeg">
    </audio>

    <div id="cpu-feedback">
        <div id="cpu-bubble" class="bubble">...</div>
        <div class="polaroid-cpu">
            <div style="width:100%; height:100px; background:#ddd; overflow:hidden;">
                <img src="img/rival.jpg"
                    onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+PHRleHQgeT0iMjAiIGZvbnQtc2l6ZT0iMjAiPvCfpJ08L3RleHQ+PC9zdmc+'"
                    style="width:100%; height:100%; object-fit:cover;">
            </div>
            <div style="font-family:'Indie Flower'; text-align:center; margin-top:5px;">El Rival</div>
        </div>
    </div>

    <script src="../../../js/rewards.js"></script>
    <script>
        // --- DATA ---
        const MEMORY_DB = [
            { id: "hildegard", name: "Hildegard", era: "medieval", img: "img/hildegard.jpg", work: "Ordo Virtutum" },
            { id: "machaut", name: "Machaut", era: "medieval", img: "img/machaut.jpg", work: "Missa Notre Dame" },
            { id: "palestrina", name: "Palestrina", era: "renaixement", img: "img/palestrina.jpg", work: "Missa Papa Marcel" },
            { id: "josquin", name: "Josquin", era: "renaixement", img: "img/josquin.jpg", work: "Ave Maria" },
            { id: "bach", name: "Bach", era: "barroc", img: "img/bach.jpg", work: "Toccata i Fuga" },
            { id: "vivaldi", name: "Vivaldi", era: "barroc", img: "img/vivaldi.jpg", work: "La Primavera" },
            { id: "handel", name: "Händel", era: "barroc", img: "img/haendel.jpg", work: "Messies" },
            { id: "monteverdi", name: "Monteverdi", era: "barroc", img: "img/monteverdi.jpg", work: "L'Orfeo" },
            { id: "mozart", name: "Mozart", era: "classicisme", img: "img/mozart.jpg", work: "Flauta Màgica" },
            { id: "haydn", name: "Haydn", era: "classicisme", img: "img/haydn.jpg", work: "Simfonia Sorpresa" },
            { id: "beethoven", name: "Beethoven", era: "romanticisme", img: "img/beethoven.jpg", work: "9a Simfonia" },
            { id: "chopin", name: "Chopin", era: "romanticisme", img: "img/chopin.jpg", work: "Nocturns" },
            { id: "wagner", name: "Wagner", era: "romanticisme", img: "img/wagner.jpg", work: "Valquíria" },
            { id: "debussy", name: "Debussy", era: "sxx", img: "img/debussy.jpg", work: "Clair de Lune" }
        ];

        const CPU_PHRASES = [
            "Maledicció!",
            "Això és molt difícil!",
            "M'he equivocat de segle!",
            "On era aquesta?",
            "Els meus circuits fallen...",
            "Massa informació!",
            "Necessito més RAM!",
            "Uf, quina memòria tens!"
        ];

        // --- STATE ---
        let gameMode = 'A'; // A: Work, B: Era
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let totalPairs = 0;
        let isPlayerTurn = true;
        let isLocked = false;
        let scores = { player: 0, cpu: 0 };
        let roundWins = { player: 0, cpu: 0 };

        // --- INIT ---
        function startGame() {
            gameMode = 'A'; // Always Mode A logic (Mix)

            document.getElementById('mode-selector').style.display = 'none';

            // Play Music
            const music = document.getElementById('bg-music');
            if (music) {
                music.volume = 0.5;
                music.play().catch(e => console.log("Audio requires interaction"));
            }

            // Reset Tournament Stats
            roundWins = { player: 0, cpu: 0 };
            updateRoundDisplay();
            startRound();
        }

        function startRound() {
            // Reset Round Stats
            scores = { player: 0, cpu: 0 };
            updateScore();
            matchedPairs = 0;
            cards = [];
            flippedCards = [];
            isLocked = false;
            // Mode A logic (Mix)

            // Select up to 6 random pairs (12 cards)
            let filteredDB = MEMORY_DB;
            const selection = [...filteredDB].sort(() => 0.5 - Math.random()).slice(0, 6);
            totalPairs = selection.length;

            let deck = [];
            selection.forEach(item => {
                // Card 1: Composer Image
                deck.push({
                    id: item.id,
                    type: 'composer',
                    content: item.img,
                    name: item.name,
                    matchId: item.id
                });

                // Card 2: Work Title (Score Image)
                deck.push({
                    id: item.id + '_work',
                    type: 'work', // changed from text to work
                    content: item.work,
                    name: "Partitura", // Changed label
                    matchId: item.id
                });
            });

            // Shuffle Deck
            deck.sort(() => 0.5 - Math.random());
            cards = deck;

            renderBoard();
            isPlayerTurn = true; // Player always starts new round? Or alternating? Let's say Player.
            updateTurnUI();

            // Animate board entrance
            const container = document.getElementById('game-container');
            container.style.opacity = '0';
            setTimeout(() => {
                container.style.transition = 'opacity 0.5s';
                container.style.opacity = '1';
            }, 100);
        }

        function renderBoard() {
            const container = document.getElementById('game-container');
            container.innerHTML = '';

            cards.forEach((card, index) => {
                const el = document.createElement('div');
                el.className = 'card';
                el.dataset.index = index;
                // Add random rotation for "scattered" effect
                const rot = (Math.random() * 6 - 3).toFixed(1);
                el.style.transform = `rotate(${rot}deg)`;
                // Store initial rotation for unflip logic
                el.dataset.rotation = el.style.transform;

                el.onclick = () => handleCardClick(index);

                const front = document.createElement('div');
                front.className = 'card-face card-front';

                let contentHtml = '';
                if (card.type === 'composer') {
                    contentHtml = `
                        <div class="polaroid-frame">
                            <img src="${card.content}" class="card-img" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+PHRleHQgeT0iMjAiIGZvbnQtc2l6ZT0iMjAiPvCfpJ08L3RleHQ+PC9zdmc+'">
                        </div>
                        <div class="card-text">${card.name}</div>
                    `;
                } else {
                    // Work / Score Card
                    contentHtml = `
                        <div class="polaroid-frame">
                            <img src="img/partitura.png" class="card-img" style="object-fit: contain; padding: 5px;">
                        </div>
                        <div class="card-text" style="font-size:0.9rem;">${card.content}</div>
                    `;
                }

                front.innerHTML = contentHtml;

                const back = document.createElement('div');
                back.className = 'card-face card-back';
                // Back pattern handled by CSS

                el.appendChild(front);
                el.appendChild(back);
                container.appendChild(el);
            });
        }

        // --- GAMEPLAY ---
        function handleCardClick(index) {
            if (isLocked || !isPlayerTurn || cards[index].matched || flippedCards.includes(index)) return;

            flipCard(index);
            flippedCards.push(index);

            if (flippedCards.length === 2) {
                checkMatch();
            }
        }

        function flipCard(index) {
            const el = document.querySelectorAll('.card')[index];
            // Clear inline transform so CSS class can take effect
            el.style.transform = '';
            el.classList.add('flipped');
        }

        function unflipCards(indices) {
            indices.forEach(idx => {
                const el = document.querySelectorAll('.card')[idx];
                el.classList.remove('flipped');
                // Restore the random rotation
                if (el.dataset.rotation) {
                    el.style.transform = el.dataset.rotation;
                }
            });
        }

        function checkMatch() {
            isLocked = true;
            const [idx1, idx2] = flippedCards;
            const card1 = cards[idx1];
            const card2 = cards[idx2];

            if (card1.matchId === card2.matchId) {
                // Match!
                setTimeout(() => {
                    document.querySelectorAll('.card')[idx1].classList.add('matched');
                    document.querySelectorAll('.card')[idx2].classList.add('matched');
                    cards[idx1].matched = true;
                    cards[idx2].matched = true;

                    if (isPlayerTurn) {
                        scores.player++;
                        updateScore();
                        // Player keeps turn
                        isLocked = false;
                        flippedCards = [];
                        checkWin();
                    } else {
                        scores.cpu++;
                        updateScore();
                        flippedCards = [];
                        checkWin();
                        if (matchedPairs < totalPairs) setTimeout(cpuTurn, 1000);
                    }

                    matchedPairs++;
                }, 500);
            } else {
                // No Match
                setTimeout(() => {
                    unflipCards([idx1, idx2]);
                    flippedCards = [];
                    isLocked = false;
                    switchTurn();
                }, 1000);
            }
        }

        function switchTurn() {
            isPlayerTurn = !isPlayerTurn;
            updateTurnUI();
            if (!isPlayerTurn) {
                setTimeout(cpuTurn, 1000);
            }
        }

        function updateTurnUI() {
            const pScore = document.getElementById('score-player');
            const cScore = document.getElementById('score-cpu');
            const indicator = document.getElementById('turn-indicator');

            if (isPlayerTurn) {
                pScore.classList.add('active');
                cScore.classList.remove('active');
                indicator.textContent = "És el teu torn!";
                indicator.style.color = "#d35400"; // Accent color
            } else {
                pScore.classList.remove('active');
                cScore.classList.add('active');
                indicator.textContent = "Torn del Rival...";
                indicator.style.color = "#444";
            }
        }

        function updateScore() {
            document.getElementById('score-player').textContent = `JO: ${scores.player}`;
            document.getElementById('score-cpu').textContent = `RIVAL: ${scores.cpu}`;
        }

        function updateRoundDisplay() {
            document.getElementById('round-display').textContent = `${roundWins.player} - ${roundWins.cpu}`;
        }

        function checkWin() {
            if (matchedPairs === totalPairs) {
                setTimeout(() => {
                    // Round Over
                    let roundWinnerMsg = "";
                    if (scores.player > scores.cpu) {
                        roundWins.player++;
                        roundWinnerMsg = "Has guanyat aquesta ronda!";
                    } else if (scores.cpu > scores.player) {
                        roundWins.cpu++;
                        roundWinnerMsg = "El Rival ha guanyat aquesta ronda...";
                    } else {
                        roundWinnerMsg = "Empat en la ronda! (No compta)";
                        // Optional: Should draw count? Maybe replay round. 
                        // Let's assume draw implies replay or no point.
                    }

                    updateRoundDisplay();

                    if (roundWins.player >= 3) {
                        endTournament(true);
                    } else if (roundWins.cpu >= 3) {
                        endTournament(false);
                    } else {
                        // Next Round
                        alert(`${roundWinnerMsg}\nMarcador Global: TU ${roundWins.player} - ${roundWins.cpu} RIVAL\n\nPreparat per la següent ronda?`);
                        startRound();
                    }
                }, 500);
            }
        }

        function endTournament(playerWon) {
            const msg = playerWon ? "FELICITATS! HAS GUANYAT EL TORNEIG! 🏆" : "HAS PERDUT CONTRA LA MÀQUINA 🤖";

            if (playerWon) {
                // Unlock Reward
                if (typeof Rewards !== 'undefined') {
                    // Logic for reward
                    // Assuming generic 'memory_beat' reward or similar
                    Rewards.unlockCard(
                        'memory_champion',
                        'Mestre del Memory',
                        'Has derrotat al Rival 3 vegades!',
                        '../../img/card_memory.png'
                    );
                }
            }

            alert(msg);
            location.reload();
        }

        // --- CPU AI ---
        function cpuTurn() {
            if (matchedPairs === totalPairs) return;

            // CPU "Thinking"
            const bubble = document.getElementById('cpu-bubble');
            bubble.textContent = "Mmm...";
            bubble.classList.add('show');

            setTimeout(() => {
                bubble.classList.remove('show');

                // Pick first card
                let available = cards.map((c, i) => i).filter(i => !cards[i].matched);
                let idx1 = available[Math.floor(Math.random() * available.length)];

                flipCard(idx1);
                flippedCards.push(idx1);

                setTimeout(() => {
                    // Pick second card
                    // 90% chance to fail (pick random non-match) -> Actually let's make it smarter or dumber?
                    // Previous logic: 10% chance to find match if available.

                    available = available.filter(i => i !== idx1);
                    let idx2;

                    const matchIdx = available.find(i => cards[i].matchId === cards[idx1].matchId);
                    // Let's increase difficulty slightly or keep same? User didn't specify.
                    // "Ganarle 3 rondes" implies it should be possible but maybe a bit challenging.
                    // Let's keep 10% lucky match.
                    const isLucky = Math.random() > 0.9;

                    if (isLucky && matchIdx !== undefined) {
                        idx2 = matchIdx;
                    } else {
                        // Pick random
                        idx2 = available[Math.floor(Math.random() * available.length)];
                    }

                    if (idx2 === undefined) {
                        // Fallback should not happen unless board logic fail
                        return;
                    }

                    flipCard(idx2);
                    flippedCards.push(idx2);

                    // If fail, show funny message
                    if (cards[idx1].matchId !== cards[idx2].matchId) {
                        const phrase = CPU_PHRASES[Math.floor(Math.random() * CPU_PHRASES.length)];
                        bubble.textContent = phrase;
                        bubble.classList.add('show');
                        setTimeout(() => bubble.classList.remove('show'), 1500);
                    }

                    checkMatch();

                }, 1000);
            }, 1000); // Faster thinking 1.5s -> 1s
        }

    </script>
</body>

</html>
