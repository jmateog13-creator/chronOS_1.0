<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrono Fact Check</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto Mono', monospace;
            background-color: #0f172a;
            color: #fff;
        }

        .fact-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn {
            transition: all 0.2s;
        }

        .btn:active {
            transform: scale(0.95);
        }
    </style>

    <!-- INICIO_AUTO_ZOOM_ANTIGRAVITY -->
    <script>
        function autoEscalar() {
            const anchoDiseno = 1920; 
            const escala = window.innerWidth / anchoDiseno;
            if (escala < 1) {
                document.body.style.zoom = escala;
            } else {
                document.body.style.zoom = 1;
            }
        }
        window.addEventListener('resize', autoEscalar);
        window.addEventListener('DOMContentLoaded', autoEscalar);
    </script>
    <!-- FIN_AUTO_ZOOM_ANTIGRAVITY -->

</head>

<body class="h-screen w-screen overflow-hidden flex flex-col items-center justify-center p-4">

    <!-- START SCREEN -->
    <div id="start-screen" class="text-center max-w-lg z-10">
        <div class="text-6xl mb-4">☑️</div>
        <h1 class="text-4xl font-bold mb-2 text-blue-400">CHRONO FACT CHECK</h1>
        <p class="text-gray-400 mb-8">Verifica la veracitat històrica.</p>
        <button onclick="startGame()"
            class="btn bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-8 rounded-lg text-xl shadow-lg shadow-blue-500/50">
            INICIAR VERIFICACIÓ
        </button>
    </div>

    <!-- GAME UI (Hidden) -->
    <div id="game-ui" class="hidden w-full max-w-2xl flex flex-col items-center">
        <!-- Progress -->
        <div class="w-full flex justify-between mb-6 text-sm text-gray-500">
            <span>VERIFIANT DADES...</span>
            <span id="score">ENCERTS: 0</span>
        </div>

        <!-- Question Card -->
        <div class="fact-card w-full p-8 rounded-2xl mb-6 text-center shadow-2xl">
            <h2 id="question-text" class="text-2xl font-bold mb-6 text-white leading-relaxed">
                Carregant dades...
            </h2>
        </div>

        <!-- Options -->
        <div class="grid grid-cols-1 gap-4 w-full">
            <button onclick="checkAnswer(0)"
                class="btn fact-card p-6 rounded-xl hover:bg-white/10 border-l-4 border-transparent hover:border-blue-400 text-left transition-all group">
                <span class="text-gray-400 group-hover:text-blue-400 mr-2">A.</span>
                <span id="opt-0" class="text-lg">Opció A</span>
            </button>
            <button onclick="checkAnswer(1)"
                class="btn fact-card p-6 rounded-xl hover:bg-white/10 border-l-4 border-transparent hover:border-blue-400 text-left transition-all group">
                <span class="text-gray-400 group-hover:text-blue-400 mr-2">B.</span>
                <span id="opt-1" class="text-lg">Opció B</span>
            </button>
        </div>
    </div>

    <script>
        const QUESTIONS = [
            { q: "Quin d'aquests fets és HISTÒRICAMENT PRECIS sobre Mozart?", options: ["Va compondre la seva primera simfonia als 8 anys.", "Va morir ric i famós envoltat de luxes."], answer: 0 },
            { q: "Sobre la 5a Simfonia de Beethoven:", options: ["Es coneix com la 'Simfonia del Destí'.", "Va ser escrita per a un anunci de cotxes."], answer: 0 },
            { q: "Johann Sebastian Bach...", options: ["Va viatjar per tot Europa com a estrella del rock.", "Va passar la major part de la seva vida a Alemanya treballant per a l'església."], answer: 1 }
        ];

        let currentQ = 0;
        let score = 0;

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-ui').classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            if (currentQ >= QUESTIONS.length) {
                alert("Verificació completa! Puntuació: " + score);
                location.reload();
                return;
            }
            const q = QUESTIONS[currentQ];
            document.getElementById('question-text').innerText = q.q;
            document.getElementById('opt-0').innerText = q.options[0];
            document.getElementById('opt-1').innerText = q.options[1];
        }

        function checkAnswer(idx) {
            const correct = QUESTIONS[currentQ].answer;
            if (idx === correct) {
                score++;
                alert("CORRECTE: Dada verificada.");
            } else {
                alert("ERROR: Dada falsa detectada.");
            }
            currentQ++;
            document.getElementById('score').innerText = `ENCERTS: ${score}`;
            loadQuestion();
        }
    </script>
</body>

</html>
