<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qui vol ser Músic Milionari?</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark-blue: #0f0c29;
            --purple: #302b63;
            --black: #24243e;
            --gold: #ffd700;
            --orange: #ff8c00;
            --correct: #00ff00;
            --wrong: #ff0000;
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            background: url('img/fons.jpg') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
        }

        #volume-control {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--gold);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 1000;
        }

        #volume-slider {
            cursor: pointer;
            accent-color: var(--gold);
        }

        #game-container {
            width: 100%;
            max-width: 1200px;
            height: 100%;
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 20px;
            padding: 20px;
            box-sizing: border-box;
        }

        /* MAIN GAME AREA */
        #main-area {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            /* Push content to bottom */
            align-items: center;
            padding-bottom: 40px;
            position: relative;
        }

        /* LOGO / VISUALS */
        #logo-area {
            position: absolute;
            top: 20px;
            text-align: center;
        }

        #logo-area h1 {
            font-size: 3rem;
            color: var(--gold);
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            margin: 0;
            font-weight: 700;
        }

        #presentador {
            height: 300px;
            margin-bottom: -25px;
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.5));
            z-index: 2;
        }

        /* QUESTION BOX */
        .question-box {
            background: linear-gradient(to bottom, #000, #333);
            border: 2px solid var(--text-color);
            border-radius: 50px;
            padding: 30px 50px;
            width: 90%;
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 30px;
            position: relative;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        .question-box::before,
        .question-box::after {
            content: "";
            position: absolute;
            height: 2px;
            width: 100%;
            background: var(--gold);
            top: 50%;
            left: 0;
            z-index: -1;
            display: none;
            /* Hex lines effect optional */
        }

        /* ANSWERS GRID */
        .answers-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
        }

        .answer-btn {
            background: linear-gradient(to bottom, #000, #222);
            border: 2px solid var(--text-color);
            border-radius: 30px;
            padding: 20px;
            font-size: 1.2rem;
            color: var(--text-color);
            cursor: pointer;
            text-align: left;
            position: relative;
            transition: all 0.2s;
        }

        .answer-btn:hover {
            background: var(--orange);
            color: #000;
            border-color: var(--gold);
        }

        .answer-btn.selected {
            background: var(--orange);
            color: #000;
        }

        .answer-btn.correct {
            background: var(--correct);
            color: #000;
            animation: blink 0.5s 3;
        }

        .answer-btn.wrong {
            background: var(--wrong);
            color: #fff;
            animation: shake 0.5s;
        }

        .answer-btn.hidden {
            visibility: hidden;
        }

        /* SIDEBAR (LADDER & LIFELINES) */
        #sidebar {
            background: rgba(0, 0, 0, 0.5);
            border-left: 2px solid var(--gold);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
        }

        /* LIFELINES */
        #lifelines {
            display: flex;
            justify-content: space-around;
            padding-bottom: 20px;
            border-bottom: 1px solid #444;
        }

        .lifeline-btn {
            background: none;
            border: 2px solid var(--text-color);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 1.5rem;
            color: var(--text-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .lifeline-btn:hover:not(:disabled) {
            transform: scale(1.1);
            border-color: var(--gold);
            color: var(--gold);
        }

        .lifeline-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            position: relative;
        }

        .lifeline-btn:disabled::after {
            content: '❌';
            position: absolute;
            font-size: 2rem;
            color: red;
        }

        /* MONEY LADDER */
        #ladder {
            display: flex;
            flex-direction: column-reverse;
            /* Bottom is 1, Top is 15 */
            gap: 5px;
            flex-grow: 1;
            justify-content: center;
        }

        .ladder-step {
            padding: 5px 10px;
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            color: var(--orange);
            border-radius: 5px;
        }

        .ladder-step.current {
            background: var(--orange);
            color: #000;
            border: 1px solid #fff;
            font-weight: bold;
        }

        .ladder-step.safe {
            color: #fff;
        }

        .ladder-step span:first-child {
            width: 30px;
        }



        /* MODALS */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .hidden {
            display: none !important;
        }

        .modal-content {
            background: var(--dark-blue);
            border: 4px solid var(--gold);
            padding: 40px;
            text-align: center;
            border-radius: 20px;
            max-width: 500px;
            color: #fff;
        }

        .modal h2 {
            color: var(--gold);
        }

        .btn-action {
            padding: 10px 30px;
            font-size: 1.2rem;
            background: var(--gold);
            border: none;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 20px;
            font-weight: bold;
            color: #000;
        }

        /* CHART FOR AUDIENCE */
        .bar-chart {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            height: 200px;
            margin-top: 20px;
        }

        .bar-col {
            width: 40px;
            background: var(--orange);
            text-align: center;
            color: #000;
            font-weight: bold;
        }

        @keyframes blink {
            50% {
                background: #fff;
            }
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-10px);
            }

            75% {
                transform: translateX(10px);
            }
        }
    </style>

    <!-- INICIO_AUTO_ZOOM_ANTIGRAVITY -->
    <script>
        function autoEscalar() {
            const anchoDiseno = 1920; 
            const escala = window.innerWidth / anchoDiseno;
            if (escala < 1) {
                document.body.style.zoom = escala;
            } else {
                document.body.style.zoom = 1;
            }
        }
        window.addEventListener('resize', autoEscalar);
        window.addEventListener('DOMContentLoaded', autoEscalar);
    </script>
    <!-- FIN_AUTO_ZOOM_ANTIGRAVITY -->

</head>

<body>

    <div id="game-container">
        <!-- MAIN AREA -->
        <div id="main-area">
            <div id="logo-area">
                <h1>MÚSIC MILIONARI</h1>
            </div>

            <div id="volume-control">
                <span>🔊</span>
                <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.5"
                    oninput="GAME.setVolume(this.value)">
            </div>

            <audio id="bg-music" loop>
                <source src="audio/Final Question Countdown.m4a" type="audio/mpeg">
            </audio>

            <img src="img/presentador.png" alt="Presentador" id="presentador">

            <div class="question-box" id="question-text">
                Carregant pregunta...
            </div>

            <div class="answers-grid" id="answers-container">
                <button class="answer-btn" onclick="GAME.checkAnswer(0)">A: Opció 1</button>
                <button class="answer-btn" onclick="GAME.checkAnswer(1)">B: Opció 2</button>
                <button class="answer-btn" onclick="GAME.checkAnswer(2)">C: Opció 3</button>
                <button class="answer-btn" onclick="GAME.checkAnswer(3)">D: Opció 4</button>
            </div>
        </div>

        <!-- SIDEBAR -->
        <div id="sidebar">
            <div id="lifelines">
                <button class="lifeline-btn" id="lifeline-50" title="50:50" onclick="GAME.use5050()">50:50</button>
                <button class="lifeline-btn" id="lifeline-phone" title="Trucada" onclick="GAME.usePhone()">📞</button>
                <button class="lifeline-btn" id="lifeline-audience" title="Públic"
                    onclick="GAME.useAudience()">👥</button>
            </div>
            <div id="ladder">
                <!-- Generated by JS -->
            </div>
            <div style="text-align: center; padding-top: 20px;">
                <button class="btn-action" style="background:#555; color:#fff; width:100%; border:1px solid #777;"
                    onclick="GAME.retire()">PLANTAR-SE</button>
            </div>
        </div>
    </div>

    <!-- MODALS -->

    <!-- START MODAL -->
    <div id="start-modal" class="modal">
        <div class="modal-content">
            <h2>BENVINGUT!</h2>
            <p>Tens 15 preguntes per davant per aconseguir la glòria musical (i 1 milió virtual).</p>
            <p>Tens 3 comodins. Fes-los servir amb saviesa.</p>
            <button class="btn-action" onclick="GAME.start()">COMENÇAR</button>
        </div>
    </div>

    <!-- PHONE MODAL -->
    <div id="phone-modal" class="modal hidden">
        <div class="modal-content">
            <h2>TRUCADA A UN AMIC</h2>
            <p id="phone-text">...</p>
            <button class="btn-action"
                onclick="document.getElementById('phone-modal').classList.add('hidden')">GRÀCIES</button>
        </div>
    </div>

    <!-- AUDIENCE MODAL -->
    <div id="audience-modal" class="modal hidden">
        <div class="modal-content">
            <h2>L'OPINIÓ DEL PÚBLIC</h2>
            <div class="bar-chart" id="audience-chart"></div>
            <button class="btn-action"
                onclick="document.getElementById('audience-modal').classList.add('hidden')">ENTESOS</button>
        </div>
    </div>

    <!-- GAME OVER MODAL -->
    <div id="game-over-modal" class="modal hidden">
        <div class="modal-content">
            <h2 id="end-title">FI DEL JOC</h2>
            <p id="end-message">Has de marxar...</p>
            <h3 id="end-money" style="color:var(--gold); font-size:2rem;">0€</h3>
            <button class="btn-action" onclick="location.reload()">NOVA PARTIDA</button>
        </div>
    </div>

    <script>
        const QUESTION_BANK = [
            // --- EASY (Nivell 1-5) ---
            { q: "On vivien els monjos a l'Edat Mitjana?", options: ["Al Monestir", "Al Castell", "A un Hotel", "A la Fàbrica"], answer: 0, difficulty: "easy" },
            { q: "Com es deia el gran geni del Classicisme que va ser un nen prodigi?", options: ["Beethoven", "Mozart", "Bach", "Elvis"], answer: 1, difficulty: "easy" },
            { q: "Quin instrument té tecles blanques i negres i és el rei del Romanticisme?", options: ["La Flauta", "El Violí", "El Piano", "La Trompeta"], answer: 2, difficulty: "easy" },
            { q: "Quina discapacitat tenia Beethoven al final de la seva vida?", options: ["Era cec", "Era sord", "Era mut", "Li faltava un braç"], answer: 1, difficulty: "easy" },
            { q: "En quin idioma cantaven els monjos el Cant Gregorià?", options: ["Anglès", "Francès", "Llatí", "Alemany"], answer: 2, difficulty: "easy" },
            { q: "Quants músics toquen en una obra 'A Cappella'?", options: ["Només instruments", "Només veus", "Veus i guitarres", "Una orquestra"], answer: 1, difficulty: "easy" },
            { q: "Qui manava durant l'època del Barroc?", options: ["El Poble", "Els Reis Absoluts", "Els Presidents", "Els Robots"], answer: 1, difficulty: "easy" },

            // --- MEDIUM (Nivell 6-10) ---
            { q: "Quin és el compositor més important del Renaixement (Mestre de l'equilibri)?", options: ["Palestrina", "Vivaldi", "Debussy", "Wagner"], answer: 0, difficulty: "medium" },
            { q: "Què significa la paraula 'Polifonia'?", options: ["Una sola veu", "Moltes veus a la vegada", "Cant sense veu", "Música trista"], answer: 1, difficulty: "medium" },
            { q: "Quin instrument fa el 'Baix Continu' al Barroc?", options: ["El Piano", "El Clavicèmbal", "El Saxòfon", "El Clarinet"], answer: 1, difficulty: "medium" },
            { q: "Com s'anomena la llibertat de velocitat (robar temps) al Romanticisme?", options: ["Staccato", "Rubato", "Pizzicato", "Allegro"], answer: 1, difficulty: "medium" },
            { q: "Quin estil del Segle XX busca crear atmòsferes i somnis?", options: ["Expressionisme", "Impressionisme", "Rock", "Heavy Metal"], answer: 1, difficulty: "medium" },
            { q: "Qui va compondre 'Les Quatre Estacions'?", options: ["Bach", "Händel", "Vivaldi", "Haydn"], answer: 2, difficulty: "medium" },
            { q: "A quina secció de l'orquestra clàssica pertany el Violí?", options: ["Vent", "Percussió", "Corda", "Elèctrica"], answer: 2, difficulty: "medium" },

            // --- HARD (Nivell 11-15) ---
            { q: "Quin compositor va inventar el Dodecafonisme (12 notes)?", options: ["Schönberg", "Debussy", "Stravinsky", "Mahler"], answer: 0, difficulty: "hard" },
            { q: "Quina era la funció principal de la música dels Trobadors?", options: ["Pregar a Déu", "Divertir i parlar d'amor", "Fer dormir als nens", "Ensenyar matemàtiques"], answer: 1, difficulty: "hard" },
            { q: "Hildegard von Bingen va ser important perquè...", options: ["Va inventar el piano", "Va ser la primera compositora coneguda", "Va cantar òpera", "Va dirigir orquestres"], answer: 1, difficulty: "hard" },
            { q: "Quina diferència tècnica té el Piano respecte al Clavicèmbal?", options: ["El Piano té cordes pinçades", "El Piano pot fer fort i fluix (dinàmica)", "El Clavicèmbal és elèctric", "No hi ha diferència"], answer: 1, difficulty: "hard" },
            { q: "Què caracteritza l'Expressionisme alemany?", options: ["La recerca de la bellesa", "L'ús del crit, la por i la dissonància", "La calma i la pau", "L'ús exclusiu del piano"], answer: 1, difficulty: "hard" },
            { q: "Qui és considerat el 'Pare de la Simfonia'?", options: ["Mozart", "Haydn", "Beethoven", "Schubert"], answer: 1, difficulty: "hard" }
        ];

        const LADDER_VALUES = [
            100, 200, 300, 500, 1000,
            2000, 4000, 8000, 16000, 32000,
            64000, 125000, 250000, 500000, 1000000
        ];

        const SAFE_HAVENS = [1000, 32000]; // Defined by value, occurring at index 4 (lvl 5) and 9 (lvl 10)

        const GAME = {
            currentLevel: 0, // 0 to 14
            currentQuestion: null,
            shuffledOptions: [], // Array of indices [0,1,2,3] shuffled
            canAnswer: false,
            usedLifelines: {
                fifty: false,
                phone: false,
                audience: false
            },

            init: function () {
                this.renderLadder();
            },

            start: function () {
                document.getElementById('start-modal').classList.add('hidden');
                this.currentLevel = 0;
                this.playMusic();
                this.loadLevel();
            },

            playMusic: function () {
                const audio = document.getElementById('bg-music');
                audio.volume = 0.5;
                audio.play().catch(e => console.log("Audio play blocked: " + e));
            },

            setVolume: function (val) {
                const audio = document.getElementById('bg-music');
                audio.volume = val;
            },

            renderLadder: function () {
                const ladderEl = document.getElementById('ladder');
                ladderEl.innerHTML = '';
                for (let i = 0; i < LADDER_VALUES.length; i++) {
                    const div = document.createElement('div');
                    div.className = 'ladder-step';
                    if (i === 4 || i === 9 || i === 14) div.classList.add('safe');
                    div.id = `step-${i}`;
                    div.innerHTML = `<span>${i + 1}</span> <span>${LADDER_VALUES[i]}€</span>`;
                    ladderEl.appendChild(div);
                }
            },

            updateLadderHighlight: function () {
                // Clear previous
                document.querySelectorAll('.ladder-step').forEach(el => el.classList.remove('current'));
                // Add current
                const currentEl = document.getElementById(`step-${this.currentLevel}`);
                if (currentEl) currentEl.classList.add('current');
            },

            loadLevel: function () {
                this.updateLadderHighlight();
                this.canAnswer = true;

                // Determine difficulty
                let diff = "easy";
                if (this.currentLevel >= 5) diff = "medium";
                if (this.currentLevel >= 10) diff = "hard";

                // Filter Question Bank
                const pool = QUESTION_BANK.filter(q => q.difficulty === diff);
                // In a real robust game we would ensure no duplicates content-wise, but here random pick is okay
                const randIndex = Math.floor(Math.random() * pool.length);
                this.currentQuestion = pool[randIndex];

                // Shuffle Options Display
                this.shuffledOptions = [0, 1, 2, 3].sort(() => Math.random() - 0.5);

                // Render
                document.getElementById('question-text').textContent = this.currentQuestion.q;

                const btns = document.querySelectorAll('.answer-btn');
                btns.forEach((btn, i) => {
                    const originalIndex = this.shuffledOptions[i];
                    btn.textContent = ["A: ", "B: ", "C: ", "D: "][i] + this.currentQuestion.options[originalIndex];
                    btn.classList.remove('selected', 'correct', 'wrong', 'hidden');
                    btn.disabled = false;
                });
            },

            checkAnswer: function (displayIndex) {
                if (!this.canAnswer) return;
                this.canAnswer = false;

                const btns = document.querySelectorAll('.answer-btn');
                const selectedBtn = btns[displayIndex];
                selectedBtn.classList.add('selected');

                const originalIndex = this.shuffledOptions[displayIndex];
                const isCorrect = (originalIndex === this.currentQuestion.answer);

                setTimeout(() => {
                    if (isCorrect) {
                        selectedBtn.classList.remove('selected');
                        selectedBtn.classList.add('correct');
                        setTimeout(() => this.nextLevel(), 1500);
                    } else {
                        selectedBtn.classList.remove('selected');
                        selectedBtn.classList.add('wrong');
                        // Show correct one
                        const correctDisplayIndex = this.shuffledOptions.indexOf(this.currentQuestion.answer);
                        btns[correctDisplayIndex].classList.add('correct');

                        setTimeout(() => this.gameOver(false), 2000);
                    }
                }, 1500); // Suspense delay
            },

            nextLevel: function () {
                if (this.currentLevel === 14) {
                    this.gameOver(true); // Win
                } else {
                    this.currentLevel++;
                    this.loadLevel();
                }
            },

            gameOver: function (win) {
                const modal = document.getElementById('game-over-modal');
                const title = document.getElementById('end-title');
                const msg = document.getElementById('end-message');
                const money = document.getElementById('end-money');

                modal.classList.remove('hidden');

                if (win) {
                    title.textContent = "ENHORABONA!";
                    msg.textContent = "Has contestat correctament les 15 preguntes. Ets un Músic Milionari!";
                    money.textContent = "1.000.000€";
                } else {
                    title.textContent = "JOC ACABAT";
                    msg.textContent = "Has fallat una pregunta...";
                    // Calculate safe haven amount
                    let earned = 0;
                    if (this.currentLevel >= 10) earned = 32000;
                    else if (this.currentLevel >= 5) earned = 1000;
                    money.textContent = earned + "€";
                }
            },

            retire: function () {
                const modal = document.getElementById('game-over-modal');
                document.getElementById('end-title').textContent = "T'HAS PLANTAT";
                document.getElementById('end-message').textContent = "Una decisió intel·ligent. T'emportes el que tens assegurat.";

                let val = 0;
                if (this.currentLevel > 0) val = LADDER_VALUES[this.currentLevel - 1];
                document.getElementById('end-money').textContent = val + "€";
                modal.classList.remove('hidden');
            },

            // --- LIFELINES ---

            use5050: function () {
                if (this.usedLifelines.fifty || !this.canAnswer) return;
                this.usedLifelines.fifty = true;
                document.getElementById('lifeline-50').disabled = true;

                // Identify Correct vs Wrong indices in displayed order
                const correctDisplayIndex = this.shuffledOptions.indexOf(this.currentQuestion.answer);
                const wrongDisplayIndices = [0, 1, 2, 3].filter(i => i !== correctDisplayIndex);

                // Shuffle logic to pick 2 to hide
                wrongDisplayIndices.sort(() => Math.random() - 0.5);

                const btns = document.querySelectorAll('.answer-btn');
                btns[wrongDisplayIndices[0]].classList.add('hidden');
                btns[wrongDisplayIndices[1]].classList.add('hidden');
            },

            usePhone: function () {
                if (this.usedLifelines.phone || !this.canAnswer) return;
                this.usedLifelines.phone = true;
                document.getElementById('lifeline-phone').disabled = true;

                const correctIndex = this.currentQuestion.answer;
                // Mostly correct hint: 80% chance
                let suggestedIndex = correctIndex;
                if (Math.random() > 0.8) {
                    // Pick a random wrong one
                    const wrongIndices = [0, 1, 2, 3].filter(i => i !== correctIndex);
                    suggestedIndex = wrongIndices[Math.floor(Math.random() * wrongIndices.length)];
                }

                const optionLetter = ["A", "B", "C", "D"][this.shuffledOptions.indexOf(suggestedIndex)];

                document.getElementById('phone-text').textContent =
                    `"Hola! Mmm... no n'estic 100% segur, però crec que l'opció correcta és la ${optionLetter}. Sort!"`;

                document.getElementById('phone-modal').classList.remove('hidden');
            },

            useAudience: function () {
                if (this.usedLifelines.audience || !this.canAnswer) return;
                this.usedLifelines.audience = true;
                document.getElementById('lifeline-audience').disabled = true;

                const correctIndex = this.currentQuestion.answer;
                // Logic: Correct answer gets around 50-70%, others split the rest
                let stats = [0, 0, 0, 0]; // Corresponds to Original Indices 0,1,2,3

                const correctPerc = Math.floor(Math.random() * 30) + 40; // 40-70%
                stats[correctIndex] = correctPerc;

                let remaining = 100 - correctPerc;
                for (let i = 0; i < 4; i++) {
                    if (i === correctIndex) continue;
                    // Distribute random chunk of remaining
                    if (remaining <= 0) break;
                    let chunk = Math.floor(Math.random() * remaining);
                    stats[i] = chunk;
                    remaining -= chunk;
                }
                // Add leftover to last one
                const lastWrong = stats.findIndex((v, i) => i !== correctIndex && v === 0);
                if (lastWrong !== -1) stats[lastWrong] += remaining;

                // Map to display order A, B, C, D
                const displayStats = [
                    stats[this.shuffledOptions[0]],
                    stats[this.shuffledOptions[1]],
                    stats[this.shuffledOptions[2]],
                    stats[this.shuffledOptions[3]]
                ];

                // Render Chart
                const chart = document.getElementById('audience-chart');
                chart.innerHTML = '';
                ["A", "B", "C", "D"].forEach((let, i) => {
                    const bar = document.createElement('div');
                    bar.className = 'bar-col';
                    bar.style.height = (displayStats[i] * 2) + 'px'; // Scale for visual
                    bar.innerHTML = `<div>${displayStats[i]}%</div><div>${let}</div>`;
                    chart.appendChild(bar);
                });

                document.getElementById('audience-modal').classList.remove('hidden');
            }
        };

        GAME.init();
    </script>
</body>

</html>
