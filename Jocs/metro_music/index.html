<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metro Music</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap');

        :root {
            --bg-color: #f0f0f0;
            --line-color: #333;
            --station-radius: 15px;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        #game-container {
            width: 100%;
            height: 100%;
            max-width: 1000px;
            position: relative;
            background: white;
            border: 5px solid #333;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
        }

        /* Start Screen */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            color: #333;
            margin-bottom: 20px;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        #instructions {
            max-width: 600px;
            font-size: 1.1rem;
            margin-bottom: 30px;
            line-height: 1.5;
            color: #555;
        }

        .era-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .btn-era {
            background: white;
            border: 3px solid #333;
            color: #333;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-family: 'Montserrat', sans-serif;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .btn-era:hover {
            background: #333;
            color: white;
        }

        .btn-era.completed {
            background: #4caf50;
            color: white;
            border-color: #388e3c;
        }

        .btn-era.completed::after {
            content: '✓';
            position: absolute;
            top: 5px;
            right: 10px;
            font-size: 1rem;
        }

        /* Game Interface */
        #canvas-container {
            flex: 1;
            position: relative;
            cursor: crosshair;
            overflow: hidden;
        }

        canvas {
            display: block;
        }

        #hud {
            height: 60px;
            background: #333;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        #audio-control {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.8rem;
        }

        input[type=range] {
            width: 100px;
        }

        /* Feedback Overlay */
        #feedback-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
            display: none;
            color: white;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }
    </style>

    <!-- INICIO_AUTO_ZOOM_ANTIGRAVITY -->
    <script>
        function autoEscalar() {
            const anchoDiseno = 1920; 
            const escala = window.innerWidth / anchoDiseno;
            if (escala < 1) {
                document.body.style.zoom = escala;
            } else {
                document.body.style.zoom = 1;
            }
        }
        window.addEventListener('resize', autoEscalar);
        window.addEventListener('DOMContentLoaded', autoEscalar);
    </script>
    <!-- FIN_AUTO_ZOOM_ANTIGRAVITY -->

</head>

<body>

    <audio id="bg-music" loop>
        <source src="audio/Pixel Tycoon Basement.m4a" type="audio/mpeg">
    </audio>

    <div id="game-container">
        <!-- Start Screen -->
        <div id="start-screen">
            <h1>METRO MUSIC</h1>
            <div id="instructions">
                Connecta les estacions de cada època musical sense creuar línies incorrectes.<br>
                Completa els <b>6 nivells</b> de dificultat creixent per dominar cada època.<br>
                Totes les etapes s'han de completar per guanyar!
            </div>

            <div id="audio-control-start" style="margin-bottom: 20px;">
                <span>🎵 Volum: </span>
                <input type="range" class="volume-slider" min="0" max="1" step="0.1" value="0.3">
            </div>

            <div class="era-grid">
                <button class="btn-era" id="btn-mitjana" data-era="edat_mitjana">Edat Mitjana</button>
                <button class="btn-era" id="btn-renaixement" data-era="renaixement">Renaixement</button>
                <button class="btn-era" id="btn-barroc" data-era="barroc">Barroc</button>
                <button class="btn-era" id="btn-classicisme" data-era="classicisme">Classicisme</button>
                <button class="btn-era" id="btn-romanticisme" data-era="romanticisme">Romanticisme</button>
                <button class="btn-era" id="btn-xx" data-era="segle_xx">Segle XX</button>
            </div>
        </div>

        <!-- Game Interface -->
        <div id="hud" class="hidden">
            <span>NIVELL: <span id="level">1</span>/6</span>
            <span>VIDES: <span id="lives">3</span></span>
            <span>ESTACIONS: <span id="connected">0</span>/<span id="total">3</span></span>
            <div id="audio-control">
                <span>🎵</span>
                <input type="range" class="volume-slider" min="0" max="1" step="0.1" value="0.3">
            </div>
        </div>

        <div id="canvas-container" class="hidden">
            <canvas id="gameCanvas"></canvas>
        </div>

        <!-- Feedback Overlay -->
        <div id="feedback-overlay">
            <h2 id="end-title"></h2>
            <p id="end-msg"></p>
            <button class="btn-era" id="restart-btn" onclick="restartOrMenu()">CONTINUAR</button>
        </div>
    </div>

    <script>
        // --- DATA ---
        const DB = {
            edat_mitjana: ["Cant Gregorià", "Monodia", "Neumes", "Trobador", "Guido d'Arezzo", "Viola de Roda", "Ars Nova", "Leonin", "Perotin", "Missa"],
            renaixement: ["Polifonia", "Humanisme", "Impremta", "Madrigal", "Palestrina", "Josquin", "Viola da Gamba", "Llaüt", "Coral", "Ensalada"],
            barroc: ["Baix Continu", "Clavicèmbal", "Bach", "Vivaldi", "Händel", "Òpera", "Fuga", "Contrast", "Ornament", "Castrato"],
            classicisme: ["Mozart", "Haydn", "Beethoven", "Sonata", "Equilibri", "Clarinet", "Piano", "Simfonia", "Quartet", "Senzillesa"],
            romanticisme: ["Wagner", "Chopin", "Verdi", "Lied", "Rubato", "Passió", "Poema Simfònic", "Virtuosisme", "Tuba", "Nacionalisme"],
            segle_xx: ["Atonalitat", "Dodecafonisme", "Stravinsky", "Cage", "Sintetitzador", "Jazz", "Minimalisme", "Soroll", "Aleatòria", "Electrònica"]
        };

        const COLORS = {
            edat_mitjana: "#6a1b9a",
            renaixement: "#ff6d00",
            barroc: "#0039a6",
            classicisme: "#fccc0a",
            romanticisme: "#d32f2f",
            segle_xx: "#00853e"
        };

        // --- GAME STATE ---
        let currentEra = null;
        let level = 1;
        const MAX_LEVELS = 6;
        let lives = 3;
        let stations = [];
        let connections = [];
        let isDragging = false;
        let startStation = null;
        let mouseX = 0;
        let mouseY = 0;
        let canvas, ctx;
        let stationsNeeded = 3;

        // Progression
        let completedEras = []; // eras user has finished

        // --- AUDIO ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();
        let bgMusic = document.getElementById('bg-music');

        // Volume sliders sync
        document.querySelectorAll('.volume-slider').forEach(slider => {
            slider.addEventListener('input', (e) => {
                const val = e.target.value;
                bgMusic.volume = val;
                // Sync other sliders
                document.querySelectorAll('.volume-slider').forEach(s => s.value = val);
            });
        });

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'connect') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'error') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, now);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        // --- LOGIC ---
        document.querySelectorAll('.btn-era').forEach(btn => {
            // Skip buttons in overlay or that are purely controls
            if (btn.parentElement.id === 'feedback-overlay') return;

            btn.addEventListener('click', () => {
                if (btn.classList.contains('completed')) {
                    // Optional: Allow replay?
                    if (!confirm("Aquesta etapa ja està completada. Vols repetir-la?")) return;
                }
                currentEra = btn.dataset.era;
                startGame();
            });
        });

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('canvas-container').classList.remove('hidden');

            // Play music if not playing
            if (bgMusic.paused) bgMusic.play().catch(e => console.log("Audio need iteratin"));

            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            canvas.addEventListener('mousedown', handleMouseDown);
            canvas.addEventListener('mousemove', handleMouseMove);
            canvas.addEventListener('mouseup', handleMouseUp);

            level = 1;
            lives = 3;
            startLevel();
            requestAnimationFrame(gameLoop);
        }

        function resizeCanvas() {
            const container = document.getElementById('canvas-container');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }

        function startLevel() {
            stationsNeeded = 2 + level;
            document.getElementById('level').textContent = level;
            document.getElementById('lives').textContent = lives;
            document.getElementById('total').textContent = stationsNeeded;
            document.getElementById('connected').textContent = 0;

            // Clear previous connections
            connections = [];

            spawnStations();
        }

        function spawnStations() {
            stations = [];
            connections = [];

            // Generate correct stations
            const correctPool = DB[currentEra];
            for (let i = 0; i < stationsNeeded; i++) {
                const name = correctPool[i % correctPool.length]; // Reuse if needed
                addStation(name, currentEra, true);
            }

            // Generate distractors
            const distractorCount = 3 + level;
            for (let i = 0; i < distractorCount; i++) {
                const otherEras = Object.keys(DB).filter(e => e !== currentEra);
                const randomEra = otherEras[Math.floor(Math.random() * otherEras.length)];
                const name = DB[randomEra][Math.floor(Math.random() * DB[randomEra].length)];
                addStation(name, randomEra, false);
            }
        }

        function addStation(name, era, isCorrect) {
            let x, y, tooClose;
            let attempts = 0;
            do {
                tooClose = false;
                x = Math.random() * (canvas.width - 100) + 50;
                y = Math.random() * (canvas.height - 100) + 50;

                for (let s of stations) {
                    const dx = s.x - x;
                    const dy = s.y - y;
                    if (Math.sqrt(dx * dx + dy * dy) < 80) { // Reduced distance buffer slightly
                        tooClose = true;
                        break;
                    }
                }
                attempts++;
            } while (tooClose && attempts < 100);

            stations.push({
                name: name,
                era: era,
                x: x,
                y: y,
                isCorrect: isCorrect,
                connected: false,
                color: isCorrect ? COLORS[currentEra] : '#ddd' // Distractors greyish? Or distinct?
                // Request didn't specify, but greying them out makes it strictly a vocabulary test, 
                // Color coding them makes it a matching test. Original code used specific colors.
                // Let's use specific colors for all to make it vibrant.
            });
            // Fix color assignment logic for distractors
            stations[stations.length - 1].color = COLORS[era];
        }

        function gameLoop() {
            if (document.getElementById('start-screen').style.display !== 'none') return; // Stop drawing if in menu

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw connections
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';

            connections.forEach(conn => {
                ctx.strokeStyle = COLORS[currentEra];
                ctx.beginPath();
                ctx.moveTo(conn.from.x, conn.from.y);
                ctx.lineTo(conn.to.x, conn.to.y);
                ctx.stroke();
            });

            // Draw current drag line
            if (isDragging && startStation) {
                ctx.strokeStyle = COLORS[currentEra];
                ctx.beginPath();
                ctx.moveTo(startStation.x, startStation.y);
                ctx.lineTo(mouseX, mouseY);
                ctx.stroke();
            }

            // Draw stations
            stations.forEach(s => {
                ctx.fillStyle = s.color;
                ctx.beginPath();
                ctx.arc(s.x, s.y, 20, 0, Math.PI * 2);
                ctx.fill();

                // Border
                ctx.strokeStyle = "#fff";
                ctx.lineWidth = 2;
                ctx.stroke();

                // Ring if connected
                if (s.connected) {
                    ctx.strokeStyle = '#333';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }

                // Label
                ctx.fillStyle = '#333';
                ctx.font = 'bold 12px Montserrat';
                ctx.textAlign = 'center';
                // Add white background for text legibility
                // ctx.fillStyle = 'rgba(255,255,255,0.7)';
                // ctx.fillRect(s.x - 40, s.y + 25, 80, 16);

                ctx.fillStyle = '#333';
                ctx.fillText(s.name, s.x, s.y + 35);
            });

            requestAnimationFrame(gameLoop);
        }

        function handleMouseDown(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const clickedStation = getStationAt(x, y);

            if (clickedStation) {
                if (clickedStation.era !== currentEra) {
                    // Wrong start
                    playSound('error');
                    damageLife();
                    return;
                }

                isDragging = true;
                startStation = clickedStation;
                mouseX = x;
                mouseY = y;
            }
        }

        function damageLife() {
            lives--;
            document.getElementById('lives').textContent = lives;
            if (lives <= 0) endGame(false);
        }

        function handleMouseMove(e) {
            if (!isDragging) return;
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        }

        function handleMouseUp(e) {
            if (!isDragging) return;
            isDragging = false;

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const endStation = getStationAt(x, y);

            if (endStation && endStation !== startStation) {
                if (endStation.era === currentEra) {
                    // Valid connection logic
                    // Check if already connected
                    const exists = connections.some(c =>
                        (c.from === startStation && c.to === endStation) ||
                        (c.from === endStation && c.to === startStation)
                    );

                    if (!exists) {
                        connections.push({ from: startStation, to: endStation });
                        startStation.connected = true;
                        endStation.connected = true;
                        playSound('connect');
                        checkProgress();
                    }
                } else {
                    // Wrong connection
                    playSound('error');
                    damageLife();
                }
            }

            startStation = null;
        }

        function getStationAt(x, y) {
            return stations.find(s => {
                const dx = s.x - x;
                const dy = s.y - y;
                return Math.sqrt(dx * dx + dy * dy) < 25;
            });
        }

        function checkProgress() {
            // Count unique connected correct stations
            // Wait, logic: we need to connect ALL correct stations in a chain? Or just "touched"?
            // "Connecta les estacions" usually means forming a network.
            // Current metric: "Connected" flag is set when you make a link.
            // If checking simple count:
            const connectedCount = stations.filter(s => s.isCorrect && s.connected).length;
            document.getElementById('connected').textContent = connectedCount;

            if (connectedCount >= stationsNeeded) {
                if (level >= MAX_LEVELS) {
                    endGame(true);
                } else {
                    level++;
                    // Delay slightly for effect
                    setTimeout(() => {
                        // Keep lives?
                        startLevel();
                    }, 500);
                }
            }
        }

        function endGame(win) {
            const overlay = document.getElementById('feedback-overlay');
            const title = document.getElementById('end-title');
            const msg = document.getElementById('end-msg');
            const btn = document.getElementById('restart-btn');

            overlay.style.display = 'flex';

            if (win) {
                title.textContent = "ETAPA COMPLETADA!";
                title.style.color = COLORS[currentEra];
                msg.textContent = "Has dominat el " + currentEra.replace('_', ' ').toUpperCase();
                btn.textContent = "TORNAR AL MAPA";
                btn.onclick = () => returnToMenu(true);
            } else {
                title.textContent = "FI DEL TRAJECTE";
                title.style.color = "red";
                msg.textContent = "T'has quedat sense vides.";
                btn.textContent = "REINTENTAR";
                btn.onclick = () => {
                    overlay.style.display = 'none';
                    level = 1; lives = 3;
                    startLevel();
                };
            }
        }

        function returnToMenu(completed) {
            if (completed && currentEra) {
                if (!completedEras.includes(currentEra)) {
                    completedEras.push(currentEra);
                    // Update button style
                    const btn = document.querySelector(`.btn-era[data-era='${currentEra}']`);
                    if (btn) btn.classList.add('completed');
                }
            }

            document.getElementById('feedback-overlay').style.display = 'none';
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('canvas-container').classList.add('hidden');
            document.getElementById('start-screen').style.display = 'flex';
            currentEra = null;
        }

        function restartOrMenu() {
            // This function is dynamically overridden in endGame, but default behavior:
            location.reload();
        }

    </script>
</body>

</html>
