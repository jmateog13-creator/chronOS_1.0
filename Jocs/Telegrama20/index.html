                        <div key={era} class="flex flex-col gap-2 p-4 border border-[#004400] hover:border-[#00ff00] transition-colors bg-black/50">
                            <h3 class="text-xl font-bold uppercase mb-2">{era}</h3>
                            <div class="flex gap-2">
                                {[1, 2, 3].map(lvl => (
                                    <button
                                        key={lvl}
                                        onClick={() => onStart(era, `Nivell ${lvl}`)}
                                        class="flex-1 bg-[#002200] hover:bg-[#005500] text-sm py-2 border border-[#004400]"
                                    >
                                        NIVELL {lvl}
                                    </button>
                                ))}
                            </div>
                        </div>
                    ))}
                </div>
            </div>
        );

        const GameScreen = ({ era, level, onGameOver, onWin, onBack }) => {
            const [wordsLeft, setWordsLeft] = useState(MAX_WORDS);
            const [currentRound, setCurrentRound] = useState(0); // 0 to 4
            const [clueIndex, setClueIndex] = useState(0);
            const [inputValue, setInputValue] = useState("");
            const [showOptions, setShowOptions] = useState(false);
            const [msg, setMsg] = useState(null);

            const levelData = useMemo(() => GAME_DATA[era][level], [era, level]);
            const currentQuestion = levelData[currentRound];

            useEffect(() => {
                // Cost for starting round (first clue)
                if (wordsLeft > 0) {
                    setWordsLeft(prev => Math.max(0, prev - 1));
                }
            }, [currentRound]);

            useEffect(() => {
                if (wordsLeft <= 0) {
                    onGameOver();
                }
            }, [wordsLeft]);

            const normalize = (str) => {
                return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!inputValue.trim()) return;

                const userAns = normalize(inputValue.trim());
                const correctAns = normalize(currentQuestion.answer);

                if (userAns === correctAns) {
                    handleCorrect();
                } else {
                    handleWrong();
                }
            };

            const handleOptionClick = (opt) => {
                const userAns = normalize(opt);
                const correctAns = normalize(currentQuestion.answer);
                if (userAns === correctAns) {
                    handleCorrect();
                } else {
                    handleWrong();
                }
            };

            const handleCorrect = () => {
                setMsg({ text: "ACCÉS CONCEDIT", color: "text-[#00ff00]" });
                setTimeout(() => {
                    setMsg(null);
                    setInputValue("");
                    setShowOptions(false);
                    setClueIndex(0);
                    if (currentRound < 4) {
                        setCurrentRound(prev => prev + 1);
                    } else {
                        onWin();
                    }
                }, 1000);
            };

            const handleWrong = () => {
                setMsg({ text: "ERROR DE CODI", color: "text-red-500" });
                setInputValue("");

                // Show next clue automatically and deduct word
                if (clueIndex < currentQuestion.clues.length - 1) {
                    setClueIndex(prev => prev + 1);
                    setWordsLeft(prev => Math.max(0, prev - 1));
                } else {
                    // No more clues, just deduct word
                    setWordsLeft(prev => Math.max(0, prev - 1));
                }

                setTimeout(() => setMsg(null), 1000);
            };

            const handleDecript = () => {
                if (wordsLeft <= 3) return; // Can't afford
                setWordsLeft(prev => prev - 3);
                setShowOptions(true);
            };

            return (
                <div class="h-full max-w-4xl mx-auto p-4 flex flex-col pt-12">
                    <div class="flex justify-between items-end border-b-2 border-[#00ff00] pb-2 mb-8">
                        <div>
                            <h2 class="text-2xl">{era} :: {level}</h2>
                            <div class="text-sm opacity-70">RONDA {currentRound + 1}/5</div>
                        </div>
                        <div class="text-right">
                            <div class="text-4xl font-bold">{wordsLeft}</div>
                            <div class="text-xs">PARAULES RESTANTS</div>
                        </div>
                    </div>

                    {/* MAIN CONSOLE */}
                    <div class="flex-grow flex flex-col justify-center items-center relative">
                        <div class="w-full max-w-2xl border border-[#004400] bg-black p-8 min-h-[300px] flex flex-col shadow-[0_0_20px_rgba(0,255,0,0.1)]">

                            {/* MESSAGE FEEDBACK */}
                            {msg && (
                                <div class={`absolute top-0 left-0 w-full text-center text-4xl font-bold bg-black border-y border-[#00ff00] py-4 z-50 ${msg.color}`}>
                                    {msg.text}
                                </div>
                            )}

                            {/* CLUES */}
                            <div class="mb-8 space-y-2 font-mono text-lg">
                                {currentQuestion.clues.slice(0, clueIndex + 1).map((clue, i) => (
                                    <div key={i} class="flex items-center">
                                        <span class="mr-4 text-[#005500]">&gt;</span>
                                        <span class="typing-effect">{clue}</span>
                                    </div>
                                ))}
                            </div>

                            {/* INPUT AREA */}
                            <div class="mt-auto">
                                {!showOptions ? (
                                    <form onSubmit={handleSubmit} class="flex gap-4">
                                        <span class="text-2xl animate-pulse">&gt;</span>
                                        <input
                                            autoFocus
                                            type="text"
                                            value={inputValue}
                                            onChange={(e) => setInputValue(e.target.value)}
                                            class="bg-transparent border-b-2 border-[#00ff00] text-[#00ff00] text-2xl outline-none flex-grow uppercase font-mono"
                                            placeholder="..."
                                        />
                                    </form>
                                ) : (
                                    <div class="grid grid-cols-2 gap-4">
                                        {currentQuestion.options.map(opt => (
                                            <button
                                                key={opt}
                                                onClick={() => handleOptionClick(opt)}
                                                class="border border-[#00ff00] hover:bg-[#00ff00] hover:text-black p-4 text-xl transition-all"
                                            >
                                                {opt}
                                            </button>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* PANIC BUTTON */}
                    <div class="mt-8 flex justify-center">
                        {!showOptions && (
                            <button
                                onClick={handleDecript}
                                disabled={wordsLeft < 3}
                                class="border border-red-500 text-red-500 px-8 py-4 disabled:opacity-30 disabled:cursor-not-allowed hover:bg-red-900/40 transition-colors uppercase tracking-widest"
                            >
                                [ DESENCRIPTAR OPCIONS (-3) ]
                            </button>
                        )}
                    </div>

                    <button onClick={onBack} class="absolute top-4 right-4 text-xs underline opacity-50 hover:opacity-100">ABORTAR</button>
                </div>
            );
        };

        const EndScreen = ({ type, onRestart }) => (
            <div class="h-full flex flex-col items-center justify-center p-8 text-center">
                <h1 class={`text-6xl md:text-8xl mb-4 ${type === 'win' ? 'text-green-500' : 'text-red-500'}`}>
                    {type === 'win' ? 'MISSIÓ COMPLERTA' : 'ERROR FATAL'}
                </h1>
                <p class="text-xl opacity-70 mb-8 font-mono">
                    {type === 'win' ? 'Arxius recuperats amb èxit.' : 'Connexió perduda. Tancant sistema.'}
                </p>
                <button
                    onClick={onRestart}
                    class="border border-[#00ff00] text-[#00ff00] px-8 py-3 hover:bg-[#00ff00] hover:text-black transition-colors"
                >
                    REINICIAR SISTEMA
                </button>
            </div>
        );

        const App = () => {
            const [gameState, setGameState] = useState('intro');
            const [selection, setSelection] = useState({ era: null, level: null });

            const startGame = (era, level) => {
                setSelection({ era, level });
                setGameState('playing');
            };

            const reset = () => {
                setGameState('intro');
                setSelection({ era: null, level: null });
            };

            return (
                <div class="h-full w-full bg-[url('https://www.transparenttextures.com/patterns/dark-matter.png')]">
                    {gameState === 'intro' && <IntroScreen onStart={startGame} />}
                    {gameState === 'playing' && (
                        <GameScreen
                            era={selection.era}
                            level={selection.level}
                            onGameOver={() => setGameState('gameover')}
                            onWin={() => setGameState('win')}
                            onBack={reset}
                        />
                    )}
                    {(gameState === 'gameover' || gameState === 'win') && (
                        <EndScreen type={gameState} onRestart={reset} />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
