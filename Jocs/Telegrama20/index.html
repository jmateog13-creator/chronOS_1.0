                    { "id": "s20_l3_5", "answer": "Impressionisme", "clues": ["Pintura", "França", "Debussy", "Color", "Atmòsfera"], "options": ["Impressionisme", "Expressionisme", "Cubisme", "Realisme"] }
                ]
            }
        };

        const ERAS = Object.keys(GAME_DATA);
        const MAX_BATTERY = 20;

        const IntroScreen = ({ onStart, completedLevels }) => {
            const [view, setView] = useState('welcome'); // 'welcome' or 'grid'

            // VIEW: WELCOME / INSTRUCTIONS
            if (view === 'welcome') {
                return (
                    <div className="w-full max-w-5xl flex flex-col items-center justify-center p-8 phone-frame bg-white/20 glass min-h-[80vh] text-center">
                        <div className="mb-8 p-6 bg-white/50 rounded-[3rem] shadow-xl">
                            <div className="text-8xl mb-4">📱</div>
                            <h1 className="text-5xl md:text-7xl font-black mb-2 text-[#2c3e50] tracking-tighter">
                                TRENDING TOPIC
                            </h1>
                            <p className="text-xl md:text-2xl text-[#34495e] font-light uppercase tracking-widest mb-4">
                                Viral History Challenge
                            </p>
                        </div>

                        <div className="bg-white/40 p-8 rounded-3xl max-w-2xl mb-12 backdrop-blur-sm">
                            <h3 className="text-2xl font-bold text-[#2c3e50] mb-4">COM HI JUGUEM?</h3>
                            <ul className="text-left space-y-4 text-lg text-[#2c3e50]">
                                <li className="flex items-start gap-3">
                                    <span className="text-2xl">🔋</span>
                                    <span>Tens <strong>20 Punts de Paraules</strong>. Utilitza'ls amb saviesa.</span>
                                </li>
                                <li className="flex items-start gap-3">
                                    <span className="text-2xl">👁️</span>
                                    <span>Veure una nova pista costa <strong>1 Punt</strong>.</span>
                                </li>
                                <li className="flex items-start gap-3">
                                    <span className="text-2xl">✏️</span>
                                    <span>Escriu la resposta correcta. Si falles i queden pistes, en veuràs una de nova (i pagaràs el cost).</span>
                                </li>
                                <li className="flex items-start gap-3">
                                    <span className="text-2xl">⚡</span>
                                    <span>Si s'acaben les pistes, tindràs <strong>3 intents finals</strong>. Si falles, Game Over.</span>
                                </li>
                            </ul>
                        </div>

                        <button
                            onClick={() => setView('grid')}
                            className="bg-[#2c3e50] text-white text-2xl font-black py-4 px-12 rounded-full hover:scale-105 transition-transform shadow-2xl"
                        >
                            JUGAR 📸
                        </button>
                    </div>
                );
            }

            // VIEW: ERA SELECTION GRID
            return (
                <div className="w-full max-w-6xl flex flex-col items-center justify-center p-8 phone-frame bg-white/20 glass min-h-[80vh]">
                    <div className="flex justify-between w-full items-center mb-8 px-8">
                        <button onClick={() => setView('welcome')} className="text-md font-bold text-[#2c3e50] opacity-60 hover:opacity-100">⬅️ INSTRUCCIONS</button>
                        <h2 className="text-3xl font-black text-[#2c3e50]">TRIA LA TEVA ÈPOCA</h2>
                        <div className="w-10"></div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 w-full px-4">
                        {ERAS.map(era => (
                            <div key={era} className="flex flex-col gap-3 p-6 rounded-3xl glass hover:bg-white/40 transition-all duration-300 shadow-md">
                                <div className="flex items-center justify-between mb-2">
                                    <h3 className="text-xl font-bold text-[#2c3e50]">{era}</h3>
                                    <span className="text-xl">✨</span>
                                </div>
                                <div className="flex flex-wrap gap-2">
                                    {["Trend 1 (Nivell 1)", "Trend 2 (Nivell 2)", "Trend 3 (Nivell 3)"].map((lvl, idx) => {
                                        const levelKey = `${era}-${lvl}`;
                                        const isDone = completedLevels.includes(levelKey);

                                        return (
                                            <button
                                                key={lvl}
                                                onClick={() => onStart(era, lvl)}
                                                className={`flex-1 py-3 px-2 rounded-xl font-bold transition-all uppercase text-[10px] tracking-wide shadow-sm
                                                    ${isDone
                                                        ? 'bg-green-400 text-white hover:bg-green-500'
                                                        : 'bg-white/50 text-[#2c3e50] hover:bg-white/80'
                                                    }`}
                                            >
                                                Trend {idx + 1}
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const GameScreen = ({ era, level, onGameOver, onWin, onBack }) => {
            const [battery, setBattery] = useState(MAX_BATTERY);
            const [currentRound, setCurrentRound] = useState(0);
            const [clueIndex, setClueIndex] = useState(0);
            const [inputValue, setInputValue] = useState("");
            const [showOptions, setShowOptions] = useState(false);
            const [msg, setMsg] = useState(null);
            const [finalAttempts, setFinalAttempts] = useState(3); // 3 Strikes for when you run out of clues

            // Get Level Data safely
            const levelData = useMemo(() => {
                if (GAME_DATA[era] && GAME_DATA[era][level]) {
                    return GAME_DATA[era][level];
                }
                const map = {
                    "Nivell 1": "Trend 1 (Nivell 1)",
                    "Nivell 2": "Trend 2 (Nivell 2)",
                    "Nivell 3": "Trend 3 (Nivell 3)"
                };
                return GAME_DATA[era][map[level]] || GAME_DATA[era][Object.keys(GAME_DATA[era])[0]];
            }, [era, level]);

            const currentQuestion = levelData ? levelData[currentRound] : null;

            useEffect(() => {
                // Initial clue cost
                if (battery > 0 && currentQuestion && clueIndex === 0) {
                    setBattery(prev => Math.max(0, prev - 1));
                }
            }, [currentRound, currentQuestion]);

            useEffect(() => {
                if (battery <= 0) {
                    onGameOver();
                }
            }, [battery]);

            useEffect(() => {
                // If final attempts run out
                if (finalAttempts <= 0) {
                    onGameOver();
                }
            }, [finalAttempts]);

            if (!currentQuestion) return <div className="text-[#2c3e50]">Loading Trends...</div>;

            const normalize = (str) => {
                return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!inputValue.trim()) return;

                const userAns = normalize(inputValue.trim());
                const correctAns = normalize(currentQuestion.answer);

                if (userAns === correctAns) {
                    handleCorrect();
                } else {
                    handleWrong();
                }
            };

            const handleOptionClick = (opt) => {
                const userAns = normalize(opt);
                const correctAns = normalize(currentQuestion.answer);
                if (userAns === correctAns) {
                    handleCorrect();
                } else {
                    handleWrong();
                }
            };

            const handleCorrect = () => {
                setMsg({ text: "✨ VIRAL! ✨", color: "text-white bg-gradient-to-r from-green-400 to-blue-500" });

                setTimeout(() => {
                    setMsg(null);
                    setInputValue("");
                    setShowOptions(false);
                    setClueIndex(0); // Reset clues
                    setFinalAttempts(3); // Reset attempts
                    if (currentRound < 4) {
                        setCurrentRound(prev => prev + 1);
                    } else {
                        onWin();
                    }
                }, 1500);
            };

            const handleWrong = () => {
                setMsg({ text: "🚫 FLOP... 🚫", color: "text-white bg-red-400" });
                setInputValue("");

                // Logic: 
                // If more clues available -> Reveal Next Clue AND Pay Cost
                // If NO clues available -> Reduce Final Attempts (but don't reduce battery, user requested this separation)

                if (clueIndex < currentQuestion.clues.length - 1) {
                    setClueIndex(prev => prev + 1);
                    setBattery(prev => Math.max(0, prev - 1));
                } else {
                    // All clues shown. Penalty on LIVES not BATTERY.
                    setFinalAttempts(prev => prev - 1);
                }

                setTimeout(() => setMsg(null), 1000);
            };

            const handleDecript = () => {
                if (battery < 3) return;
                setBattery(prev => prev - 3);
                setShowOptions(true);
            };

            const showSuccessAnswer = msg && msg.text.includes("VIRAL");
            const allCluesShown = clueIndex >= currentQuestion.clues.length - 1;

            return (
                <div className="w-full max-w-md mx-auto h-[90vh] glass rounded-[3rem] p-6 flex flex-col relative overflow-hidden ring-8 ring-white/40 shadow-2xl">

                    {/* Top Status Bar: Back + Era */}
                    <div className="flex justify-between items-center mb-2 px-2 z-10">
                        <button onClick={onBack} className="text-2xl text-[#2c3e50] opacity-70 hover:opacity-100 transition-opacity">⬅️</button>
                        <div className="font-bold text-lg text-[#2c3e50] opacity-80 uppercase tracking-wider">{era}</div>
                        <div className="w-8"></div>
                    </div>

                    {/* CENTRAL Words Counter */}
                    <div className="absolute top-16 left-0 right-0 flex flex-col items-center justify-center z-10 gap-2">
                        <div className={`font-mono font-bold px-6 py-2 rounded-full text-xl shadow-lg transition-all border border-white/50
                            ${battery < 5 ? 'bg-red-500 text-white animate-pulse' : 'bg-white/90 text-[#2c3e50]'}`}>
                            Paraules Restants: {battery}
                        </div>
                        {allCluesShown && (
                            <div className="bg-red-500 text-white text-xs font-black px-3 py-1 rounded-full animate-bounce">
                                PISTES ESGOTADES! {finalAttempts} INTENTS
                            </div>
                        )}
                    </div>

                    {/* Main Content Area */}
                    <div className="flex-grow flex flex-col relative mt-16 rounded-3xl overflow-hidden">

                        {/* Clues Area - CENTERED */}
                        <div className="flex-grow p-6 flex flex-col items-center justify-center text-center gap-6 relative">

                            {/* Correct Answer Overlay */}
                            {showSuccessAnswer && (
                                <div className="absolute inset-0 z-50 flex flex-col items-center justify-center bg-white/90 backdrop-blur-md rounded-3xl p-6 animate-pulse">
                                    <h2 className="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-blue-500 mb-2 drop-shadow-sm">
                                        {currentQuestion.answer}
                                    </h2>
                                    <p className="text-[#2c3e50]/80 italic text-lg">Correct!</p>
                                </div>
                            )}

                            {/* Success/Fail Msg */}
                            {msg && !showSuccessAnswer && (
                                <div className={`absolute inset-0 flex items-center justify-center z-50 text-4xl font-black rounded-3xl ${msg.color} animate-bounce p-4 m-4 shadow-2xl`}>
                                    {msg.text}
                                </div>
                            )}

                            {/* CLUES DISPLAY - Plain Words */}
                            <div className="flex flex-col gap-4 w-full justify-center items-center h-full">
                                {currentQuestion.clues.slice(0, clueIndex + 1).map((clue, i) => (
                                    <div
                                        key={i}
                                        className="text-3xl md:text-5xl font-black text-[#2c3e50] fade-in"
                                        style={{ textShadow: '0 2px 10px rgba(0,0,0,0.05)' }}
                                    >
                                        {clue}
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Bottom Area */}
                        <div className="p-4 bg-white/40 backdrop-blur-md rounded-t-3xl">

                            {/* Correct Words List */}
                            <div className="mb-4">
                                <div className="text-xs font-bold text-[#2c3e50] uppercase tracking-widest mb-1 opacity-70">Paraules Encertades:</div>
                                <div className="flex flex-wrap gap-2 min-h-[1.5rem]">
                                    {levelData.slice(0, currentRound).map((q, idx) => (
                                        <span key={idx} className="bg-green-100 text-green-800 text-xs font-bold px-2 py-1 rounded-lg shadow-sm">
                                            {q.answer}
                                        </span>
                                    ))}
                                    {levelData.slice(0, currentRound).length === 0 && <span className="text-xs text-[#2c3e50]/40 italic">...</span>}
                                </div>
                            </div>

                            {!showOptions ? (
                                <form onSubmit={handleSubmit} className="flex gap-2 mb-2">
                                    <input
                                        autoFocus
                                        type="text"
                                        value={inputValue}
                                        onChange={(e) => setInputValue(e.target.value)}
                                        className="flex-grow bg-white border-none rounded-full px-4 py-3 text-[#2c3e50] placeholder-[#2c3e50]/30 focus:ring-2 focus:ring-pink-300 outline-none shadow-inner"
                                        placeholder="Escriu la resposta..."
                                    />
                                    <button type="submit" className="bg-pink-500 text-white w-12 h-12 rounded-full flex items-center justify-center text-xl hover:bg-pink-400 transition-colors shadow-lg">
                                        ➤
                                    </button>
                                </form>
                            ) : (
                                <div className="grid grid-cols-2 gap-2 mb-2">
                                    {currentQuestion.options.map(opt => (
                                        <button
                                            key={opt}
                                            onClick={() => handleOptionClick(opt)}
                                            className="bg-white hover:bg-white/80 p-3 rounded-xl font-bold text-sm transition-all text-left text-[#2c3e50] shadow-sm"
                                        >
                                            {opt}
                                        </button>
                                    ))}
                                </div>
                            )}

                            {!showOptions && (
                                <button
                                    onClick={handleDecript}
                                    disabled={battery < 3}
                                    className="w-full text-[10px] text-[#2c3e50]/60 font-bold uppercase tracking-widest hover:text-[#2c3e50] disabled:opacity-30 transition-colors py-1"
                                >
                                    📢 Ask Followers (Cost: 3 Words)
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const EndScreen = ({ type, onRestart }) => (
            <div className="w-full max-w-md mx-auto h-[90vh] glass rounded-[3rem] p-8 flex flex-col items-center justify-center text-center relative overflow-hidden ring-8 ring-white/40 shadow-2xl">
                <div className="absolute inset-0 bg-white/10 z-0"></div>

                <div className="relative z-10">
                    <div className="text-8xl mb-4 animate-bounce">
                        {type === 'win' ? '👑' : '💀'}
                    </div>
                    <h1 className={`text-6xl font-black mb-4 ${type === 'win' ? 'text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-pink-600' : 'text-red-500'}`}>
                        {type === 'win' ? 'VIRAL KING!' : 'CANCEL·LAT'}
                    </h1>
                    <div className="glass p-6 rounded-2xl mb-8 transform rotate-2 bg-white/50">
                        <p className="text-xl font-light italic text-[#2c3e50]">
                            {type === 'win' ? '"Els teus coneixements han trencat internet! 1M Likes!"' : '"No has estat capaç d\'endevinar la tendència..."'}
                        </p>
                    </div>
                    <button
                        onClick={onRestart}
                        className="bg-[#2c3e50] text-white font-black text-xl px-10 py-5 rounded-full hover:scale-110 transition-transform shadow-xl"
                    >
                        MAIN MENU 📱
                    </button>
                </div>
            </div>
        );

        const App = () => {
            const [gameState, setGameState] = useState('intro');
            const [selection, setSelection] = useState({ era: null, level: null });

            // TRACK COMPLETED LEVELS: e.g. ["Edat Mitjana-Trend 1 (Nivell 1)", ...]
            const [completedLevels, setCompletedLevels] = useState([]);

            // AUDIO STATE
            const [volume, setVolume] = useState(0.5);
            const audioRef = useRef(null);

            useEffect(() => {
                if (audioRef.current) {
                    audioRef.current.volume = volume;
                    // Attempt autoplay
                    const playPromise = audioRef.current.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(error => {
                            console.log("Autoplay prevented:", error);
                        });
                    }
                }
            }, [volume]);

            const startGame = (era, level) => {
                setSelection({ era, level });
                setGameState('playing');
            };

            const reset = () => {
                setGameState('intro');
                setSelection({ era: null, level: null });
            };

            const handleWin = () => {
                const levelKey = `${selection.era}-${selection.level}`;
                if (!completedLevels.includes(levelKey)) {
                    setCompletedLevels(prev => [...prev, levelKey]);
                }
                setGameState('win');
            };

            return (
                <div className="w-full h-full flex items-center justify-center relative">
                    {/* PERSISTENT AUDIO PLAYER */}
                    <audio ref={audioRef} src="./audio/ViralTrend.mp3" loop />

                    {/* VOLUME SLIDER (Fixed Top Right) */}
                    <div className="fixed top-4 right-4 z-[100] flex items-center gap-2 bg-white/20 backdrop-blur-md p-2 rounded-full shadow-lg border border-white/30 group hover:bg-white/40 transition-all">
                        <span className="text-xl">🎵</span>
                        <input
                            type="range"
                            min="0"
                            max="1"
                            step="0.05"
                            value={volume}
                            onChange={(e) => setVolume(parseFloat(e.target.value))}
                            className="w-24 accent-pink-500 cursor-pointer"
                        />
                    </div>

                    {gameState === 'intro' && (
                        <IntroScreen
                            onStart={startGame}
                            completedLevels={completedLevels}
                        />
                    )}
                    {gameState === 'playing' && (
                        <GameScreen
                            era={selection.era}
                            level={selection.level}
                            onGameOver={() => setGameState('gameover')}
                            onWin={handleWin}
                            onBack={reset}
                        />
                    )}
                    {(gameState === 'gameover' || gameState === 'win') && (
                        <EndScreen type={gameState} onRestart={reset} />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
