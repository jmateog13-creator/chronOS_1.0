<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truth Machine: El Polígraf del Temps</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --phosphor-primary: #00ff00;
            --phosphor-secondary: #008f11;
            --phosphor-alert: #ff3333;
            --bg-color: #0c0c0c;
        }

        body {
            background-color: var(--bg-color);
            color: var(--phosphor-primary);
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-shadow: 0 0 5px var(--phosphor-secondary);
        }

        /* CRT EFFECT OVERLAY */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 999;
        }

        .crt-flicker {
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% {
                opacity: 0.97;
            }

            100% {
                opacity: 1;
            }
        }

        /* CONTAINER */
        #game-interface {
            width: 90%;
            max-width: 900px;
            border: 4px solid var(--phosphor-secondary);
            padding: 30px;
            background: rgba(0, 20, 0, 0.95);
            box-shadow: 0 0 30px var(--phosphor-secondary);
            position: relative;
            border-radius: 10px;
        }

        /* HEADER */
        header {
            display: flex;
            justify-content: space-between;
            border-bottom: 2px solid var(--phosphor-secondary);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            letter-spacing: 2px;
        }

        #score-display {
            font-size: 1.5rem;
            font-weight: bold;
        }

        /* MAIN CONTENT GRID */
        .main-grid {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 30px;
        }

        /* SUBJECT PROFILE */
        #subject-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            border-right: 2px solid var(--phosphor-secondary);
            padding-right: 20px;
        }

        #subject-img {
            width: 200px;
            height: 200px;
            border: 4px solid var(--phosphor-primary);
            margin-bottom: 15px;
            object-fit: cover;
            filter: grayscale(100%) contrast(1.2) sepia(50%) hue-rotate(50deg);
            box-shadow: 0 0 15px var(--phosphor-secondary);
        }

        #subject-info h2 {
            margin: 0;
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 5px;
        }

        .subject-meta {
            font-size: 0.9rem;
            opacity: 0.8;
            text-align: center;
            line-height: 1.4;
        }

        /* ANALYSIS AREA */
        #analysis-area {
            display: flex;
            flex-direction: column;
        }

        /* POLYGRAPH CANVAS */
        #polygraph-container {
            width: 100%;
            height: 180px;
            background: #001100;
            border: 2px solid var(--phosphor-secondary);
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        #polygraph-container::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent 95%, rgba(0, 255, 0, 0.5) 100%);
            background-size: 40px 100%;
            /* Grid lines */
            pointer-events: none;
            opacity: 0.3;
        }

        /* QUESTION BOX */
        #question-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border: 2px dashed var(--phosphor-secondary);
            padding: 20px;
            margin-bottom: 20px;
            background: rgba(0, 10, 0, 0.5);
            min-height: 100px;
        }

        #question-text {
            font-size: 1.4rem;
            text-align: center;
            line-height: 1.4;
        }

        /* CONTROLS */
        #controls {
            display: flex;
            justify-content: center;
            gap: 40px;
        }

        button {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.5rem;
            padding: 15px 50px;
            border: 3px solid;
            background: black;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            font-weight: bold;
            box-shadow: 0 5px 0 rgba(0, 0, 0, 0.5);
        }

        button:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.5);
        }

        .btn-true {
            color: var(--phosphor-primary);
            border-color: var(--phosphor-primary);
        }

        .btn-true:hover {
            background: var(--phosphor-primary);
            color: black;
            box-shadow: 0 0 20px var(--phosphor-primary);
        }

        .btn-false {
            color: var(--phosphor-alert);
            border-color: var(--phosphor-alert);
        }

        .btn-false:hover {
            background: var(--phosphor-alert);
            color: black;
            box-shadow: 0 0 20px var(--phosphor-alert);
        }

        /* SELECTION SCREEN */
        #selection-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            box-sizing: border-box;
        }

        #selection-screen h1 {
            font-size: 4rem;
            margin-bottom: 10px;
            text-shadow: 0 0 15px var(--phosphor-primary);
        }

        .char-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            margin-top: 40px;
            width: 100%;
            max-width: 1000px;
        }

        .char-card {
            border: 2px solid var(--phosphor-secondary);
            padding: 15px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
            background: rgba(0, 20, 0, 0.5);
        }

        .char-card:hover {
            background: var(--phosphor-secondary);
            color: black;
            transform: scale(1.05);
            box-shadow: 0 0 20px var(--phosphor-primary);
        }

        .char-card img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            filter: grayscale(100%) contrast(1.2);
            border: 2px solid currentColor;
            margin-bottom: 10px;
        }

        .char-name {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .char-era {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        /* RESULT OVERLAY */
        #result-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 50;
        }

        #result-status {
            font-size: 3rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            border: 4px solid currentColor;
            padding: 10px 40px;
            transform: rotate(-5deg);
        }

        #result-msg {
            font-size: 1.5rem;
            max-width: 800px;
            margin-bottom: 40px;
            line-height: 1.6;
            color: #fff;
        }

        /* PULSE ANIMATION FOR TENSION */
        .tension-pulse {
            animation: tension 0.5s infinite alternate;
        }

        @keyframes tension {
            from {
                box-shadow: 0 0 10px var(--phosphor-alert) inset;
            }

            to {
                box-shadow: 0 0 50px var(--phosphor-alert) inset;
            }
        }

        /* MUSIC CONTROL */
        #music-control {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 2000;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        #music-control:hover {
            opacity: 1;
        }
    </style>

    <!-- INICIO_AUTO_ZOOM_ANTIGRAVITY -->
    <script>
        function autoEscalar() {
            const anchoDiseno = 1920; 
            const escala = window.innerWidth / anchoDiseno;
            if (escala < 1) {
                document.body.style.zoom = escala;
            } else {
                document.body.style.zoom = 1;
            }
        }
        window.addEventListener('resize', autoEscalar);
        window.addEventListener('DOMContentLoaded', autoEscalar);
    </script>
    <!-- FIN_AUTO_ZOOM_ANTIGRAVITY -->

</head>

        window.onload = function () {
            renderSelectionScreen();
            animateGraph(); // initCanvas will be called in startGame

            // Resize handler
            window.addEventListener('resize', initCanvas);
        };

        function initCanvas() {
            const container = document.getElementById('polygraph-container');
            if (container.offsetWidth > 0) {
                canvas.width = container.offsetWidth;
                canvas.height = container.offsetHeight;
                points = new Array(Math.ceil(canvas.width / speed) + 1).fill(canvas.height / 2);
            }
        }

        function renderSelectionScreen() {
            const grid = document.getElementById('char-grid');
            grid.innerHTML = '';

            SUSPECTS_DB.forEach((suspect, index) => {
                const isDone = completedEras.includes(suspect.id);
                const card = document.createElement('div');
                card.className = "char-card";
                if (isDone) card.style.borderColor = "var(--phosphor-primary)";

                card.innerHTML = `
                    <div style="position:absolute; top:5px; right:5px; color:var(--phosphor-primary); font-weight:bold; display:${isDone ? 'block' : 'none'}">[FET]</div>
                    <img src="${suspect.img}" onerror="this.src='https://ui-avatars.com/api/?name=${suspect.name}&background=003300&color=00ff00&size=128'" style="${isDone ? 'filter: grayscale(0%) sepia(0%) hue-rotate(0deg) !important;' : ''}">
                    <div class="char-name" style="${isDone ? 'color:var(--phosphor-primary)' : ''}">${suspect.name}</div>
                    <div class="char-era">${suspect.era}</div>
                `;
                card.onclick = () => startGame(index);
                grid.appendChild(card);
            });
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // --- GAME LOGIC ---
        function startGame(index) {
            currentSuspect = SUSPECTS_DB[index];
            // Clone and shuffle questions
            currentQuestions = shuffleArray([...currentSuspect.questions]);

            currentQIndex = 0;
            correctAnswers = 0;
            tensionLevel = 0;

            document.getElementById('selection-screen').style.display = 'none';
            document.getElementById('game-interface').style.display = 'block';

            // Resize canvas now that it is visible
            initCanvas();

            // Setup Profile
            document.getElementById('subject-name').textContent = currentSuspect.name;
            document.getElementById('subject-meta').innerHTML = `ERA: ${currentSuspect.era}<br>ANY: ${currentSuspect.years}`;

            const img = document.getElementById('subject-img');
            img.src = currentSuspect.img;
            img.onerror = function () {
                this.src = `https://ui-avatars.com/api/?name=${currentSuspect.name}&background=003300&color=00ff00&size=128`;
            };

            updateScore();
            loadQuestion();
        }

        function loadQuestion() {
            if (currentQIndex >= currentQuestions.length) {
                endGame();
                return;
            }

            const q = currentQuestions[currentQIndex];
            document.getElementById('q-num').textContent = currentQIndex + 1;
            document.getElementById('question-text').textContent = `"${q.text}"`;
            document.getElementById('result-overlay').style.display = 'none';

            // Reset state
            isAnalyzing = false;
            tensionLevel = 0;
            document.querySelector('.main-grid').classList.remove('tension-pulse');
        }

        function submitAnswer(userSaysTrue) {
            if (isAnalyzing) return; // Prevent double click
            isAnalyzing = true;

            // Increase tension visuals
            tensionLevel = 1;
            document.querySelector('.main-grid').classList.add('tension-pulse');
            document.getElementById('question-text').textContent = "ANALITZANT CONSTANTS VITALS...";

            // Random delay between 1.5 and 2.5 seconds
            const delay = 1500 + Math.random() * 1000;

            setTimeout(() => {
                const q = currentQuestions[currentQIndex];
                const isCorrect = (userSaysTrue === q.isTrue);

                showResult(isCorrect, q, userSaysTrue);
            }, delay);
        }

        function showResult(isCorrect, q, userSaysTrue) {
            const overlay = document.getElementById('result-overlay');
            const status = document.getElementById('result-status');
            const msg = document.getElementById('result-msg');

            overlay.style.display = 'flex';

            if (isCorrect) {
                status.textContent = "CORRECTE";
                status.style.color = "var(--phosphor-primary)";
                status.style.borderColor = "var(--phosphor-primary)";
                msg.textContent = q.explanation;
                correctAnswers++;
            } else {
                status.textContent = "ERROR";
                status.style.color = "var(--phosphor-alert)";
                status.style.borderColor = "var(--phosphor-alert)";

                // Construct error message logic
                if (q.isTrue) {
                    msg.innerHTML = `El subjecte deia la VERITAT.<br><br>${q.explanation}`;
                } else {
                    msg.innerHTML = `El subjecte MENTIA.<br><br>${q.explanation}`;
                }
            }

            updateScore();

            // Stop tension
            tensionLevel = 0.2; // Keep slight movement
            document.querySelector('.main-grid').classList.remove('tension-pulse');
        }

        function nextQuestion() {
            currentQIndex++;
            loadQuestion();
        }

        function updateScore() {
            const total = currentQuestions.length;
            // Avoid division by zero/weird start
            const percentage = currentQIndex === 0 ? 0 : Math.round((correctAnswers / currentQIndex) * 100);

            let displayScore = "";
            let count = 0;
            if (currentQIndex > 0) {
                displayScore = `${correctAnswers}/${currentQIndex}`;
            } else {
                displayScore = "0/0";
            }

            document.getElementById('score-display').textContent = `VERACITAT DETECTADA: ${correctAnswers} encerts`;
        }

        function endGame() {
            document.getElementById('selection-screen').style.display = 'flex';
            document.getElementById('game-interface').style.display = 'none';

            let finalMsg = "";
            let success = false;

            if (correctAnswers >= 7) {
                finalMsg = "OBJECTIU ASSOLIT. Has demostrat un coneixement superior.";
                success = true;

                // Save progress
                if (!completedEras.includes(currentSuspect.id)) {
                    completedEras.push(currentSuspect.id);
                    localStorage.setItem('truthMachine_completed', JSON.stringify(completedEras));
                }
            }
            else if (correctAnswers >= 5) finalMsg = "BON TREBALL, PERÒ INSUFICIENT. Necessites 7 encerts per superar l'època.";
            else finalMsg = "TORNAR A CALIBRAR. Necessites repassar la història de la música (Objectiu: 7 encerts).";

            alert(`SESSIÓ FINALITZADA.\nEncerts: ${correctAnswers}/${currentQuestions.length}\n\n${finalMsg}`);
            renderSelectionScreen();
        }

        // --- GRAPH ANIMATION ---
        function animateGraph() {
            requestAnimationFrame(animateGraph);

            // 1. Shift array
            points.shift();

            // 2. Generate new point
            const center = canvas.height / 2;
            let noise = 0;

            if (tensionLevel > 0.8) {
                // High tension (Analysing) - Big spikes
                noise = (Math.random() - 0.5) * (canvas.height * 0.8);
            } else if (tensionLevel > 0) {
                // Low tension (After result)
                noise = (Math.random() - 0.5) * (canvas.height * 0.2);
            } else {
                // Resting heartbeat (Regular pulses)
                const time = Date.now() / 1000;
                // Periodic spike
                if (Math.random() < 0.02) {
                    noise = (Math.random() - 0.5) * 50;
                } else {
                    noise = (Math.random() - 0.5) * 5;
                }
            }

            // Smooth transition slightly? No, raw noise is more "polygraphy"
            points.push(center + noise);

            // 3. Draw
            ctx.fillStyle = "#001100";
            ctx.fillRect(0, 0, canvas.width, canvas.height); // Clear

            // Grid
            ctx.strokeStyle = "rgba(0, 255, 0, 0.1)";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, center);
            ctx.lineTo(canvas.width, center);
            ctx.stroke();

            // Line
            ctx.strokeStyle = (tensionLevel > 0.8) ? "#ff3333" : "#00ff00";
            ctx.lineWidth = 2;
            ctx.shadowBlur = 5;
            ctx.shadowColor = ctx.strokeStyle;

            ctx.beginPath();
            // simple line join
            for (let i = 0; i < points.length; i++) {
                let x = i * speed;
                let y = points[i];
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();

            // Reset shadows
            ctx.shadowBlur = 0;
        }

        // --- AUDIO ---
        function toggleMusic() {
            const music = document.getElementById('bg-music');
            const btn = document.getElementById('music-control');
            if (music.paused) {
                music.play().then(() => {
                    btn.textContent = "🔊";
                }).catch(e => console.error(e));
            } else {
                music.pause();
                btn.textContent = "🔇";
            }
        }

        // Auto-play attempt on interaction
        document.body.addEventListener('click', () => {
            const music = document.getElementById('bg-music');
            if (music.paused) toggleMusic();
        }, { once: true });

    </script>
