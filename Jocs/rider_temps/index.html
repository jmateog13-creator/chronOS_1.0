<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rider del Temps - Temporal Delivery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ff;
            --road-dark: #121212;
            --gold: #ffd700;
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --danger: #ff3e3e;
            --success: #00ff88;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Outfit', sans-serif;
            color: white;
            user-select: none;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        /* OVERLAYS */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        #start-screen h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 5rem;
            margin: 0;
            background: linear-gradient(to bottom, var(--neon-blue), var(--neon-pink));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 5px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .btn-pro {
            padding: 20px 60px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            background: transparent;
            color: white;
            border: 2px solid var(--neon-blue);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-top: 40px;
            letter-spacing: 4px;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
        }

        .btn-pro:hover {
            background: var(--neon-blue);
            color: #000;
            transform: scale(1.1);
            box-shadow: 0 0 30px var(--neon-blue);
        }

        /* GAME WORLD (Pseudo-3D) */
        #world {
            position: relative;
            width: 100%;
            height: 100%;
            perspective: 600px;
            overflow: hidden;
        }

        #sky-visuals {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .stars {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            opacity: 0.5;
        }

        #road-system {
            position: absolute;
            bottom: -200px;
            left: 50%;
            transform: translateX(-50%) rotateX(75deg);
            width: 1200px;
            height: 1800px;
            background: #0a0a0a;
            transform-origin: bottom center;
            z-index: 2;
            border-left: 10px solid var(--glass-border);
            border-right: 10px solid var(--glass-border);
        }

        .grid-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: rgba(0, 243, 255, 0.1);
            bottom: 0;
            box-shadow: 0 0 5px var(--neon-blue);
        }

        .lane-divider {
            position: absolute;
            top: 0;
            width: 4px;
            height: 100%;
            background: repeating-linear-gradient(to bottom, var(--neon-blue) 0, var(--neon-blue) 40px, transparent 40px, transparent 100px);
            opacity: 0.3;
        }

        #lane-L {
            left: 33%;
        }

        #lane-R {
            right: 33%;
        }

        /* PLAYER */
        #player-container {
            position: absolute;
            bottom: 12%;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 100px;
            z-index: 100;
            transition: left 0.2s cubic-bezier(0.19, 1, 0.22, 1);
        }

        #bike {
            width: 100%;
            height: 100%;
            background: url('img/moto.png') no-repeat center center;
            background-size: contain;
            filter: drop-shadow(0 0 15px var(--neon-blue));
            transition: transform 0.2s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .engine-glow {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 10px;
            background: var(--neon-pink);
            filter: blur(8px);
            opacity: 0.8;
            animation: pulse 0.1s infinite alternate;
        }

        @keyframes pulse {
            from {
                opacity: 0.6;
                transform: translateX(-50%) scale(0.9);
            }

            to {
                opacity: 1;
                transform: translateX(-50%) scale(1.1);
            }
        }

        /* HUD - PRO SPEEDOMETER */
        #hud {
            position: absolute;
            top: 40px;
            width: 90%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 500;
            padding: 0 50px;
        }

        .hud-widget {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            padding: 10px 20px;
            border-radius: 4px;
        }

        /* VOLUME SLIDER */
        #volume-container {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
            display: flex;
            align-items: center;
            background: var(--glass);
            padding: 10px 15px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            border: 1px solid var(--glass-border);
        }

        #volume-slider {
            width: 80px;
            margin-left: 10px;
            cursor: pointer;
            accent-color: var(--neon-blue);
        }

        .hud-label {
            font-size: 0.7rem;
            color: var(--neon-blue);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .hud-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
        }

        /* FUEL BAR */
        #fuel-meter {
            width: 200px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            margin-top: 10px;
            position: relative;
        }

        #fuel-fill {
            height: 100%;
            width: 100%;
            background: var(--neon-pink);
            box-shadow: 0 0 10px var(--neon-pink);
            transition: width 0.3s;
        }

        /* ITEMS */
        .artifact {
            position: absolute;
            width: 80px;
            height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            color: white;
            text-align: center;
            font-weight: 600;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        .artifact-box {
            width: 70px;
            height: 70px;
            background-position: center;
            background-repeat: no-repeat;
            background-size: contain;
            mix-blend-mode: screen;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 5px;
            animation: spin 3s infinite linear;
        }

        .artifact.correct .artifact-box {
            border-color: var(--neon-blue);
            box-shadow: 0 0 20px var(--neon-blue);
        }

        .artifact.danger .artifact-box {
            border-color: var(--danger);
            box-shadow: 0 0 20px var(--danger);
        }

        @keyframes spin {
            from {
                transform: rotateY(0deg);
            }

            to {
                transform: rotateY(360deg);
            }
        }

        /* TIME WARP */
        #warp-effect {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            z-index: 3000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        /* ERA SELECTOR */
        #era-selector {
            display: none;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 600px;
            padding: 20px;
        }

        .era-card {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            padding: 20px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .era-card:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-5px);
            border-color: var(--neon-blue);
        }

        .era-card.completed {
            border-color: var(--success);
            box-shadow: 0 0 15px var(--success);
            background: rgba(0, 255, 136, 0.1);
        }

        .era-card.completed h3 {
            color: var(--success);
        }

        /* FEEDBACK FLASHES */
        .flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2500;
            opacity: 0;
            transition: opacity 0.1s;
        }

        .flash-success {
            background: radial-gradient(circle, var(--success) 0%, transparent 70%);
        }

        .flash-error {
            background: radial-gradient(circle, var(--danger) 0%, transparent 70%);
        }
    </style>

    <!-- INICIO_AUTO_ZOOM_ANTIGRAVITY -->
    <script>
        function autoEscalar() {
            const anchoDiseno = 1920; 
            const escala = window.innerWidth / anchoDiseno;
            if (escala < 1) {
                document.body.style.zoom = escala;
            } else {
                document.body.style.zoom = 1;
            }
        }
        window.addEventListener('resize', autoEscalar);
        window.addEventListener('DOMContentLoaded', autoEscalar);
    </script>
    <!-- FIN_AUTO_ZOOM_ANTIGRAVITY -->

</head>

<body>

    <div id="game-container">
        <!-- START SCREEN -->
        <div id="start-screen" class="overlay">
            <h1 id="title" style="font-size: 4rem;">RIDER<br>TEMPORAL</h1>

            <div id="era-selector-container">
                <div id="era-selector"></div>
            </div>

            <div id="main-menu-content">
                <p style="letter-spacing: 5px; opacity: 0.7; margin-top: 10px;">MISSIONS D'ENTREGA HISTÒRICA</p>

                <div
                    style="max-width: 600px; background: rgba(255,255,255,0.05); padding: 20px; border-radius: 15px; margin: 20px 0; border: 1px solid var(--glass-border);">
                    <ul style="text-align: left; list-style: none; padding: 0; line-height: 1.6; font-size: 0.9rem;">
                        <li>🎯 <b>FITES:</b> Aconsegueix <b>15 Punts</b> per completar l'era.</li>
                        <li>↔️ <b>CONTROLS:</b> Fletxes o clic als costats.</li>
                        <li>⚠️ <b>ALERTA:</b> Evita els anacronismes i obstacles.</li>
                    </ul>
                </div>

                <button class="btn-pro" onclick="showEraSelector()">SELECCIONAR ERA</button>
            </div>
        </div>

        <!-- WORLD -->
        <div id="world">
            <div id="sky-visuals"></div>

            <div id="road-system">
                <div class="lane-divider" id="lane-L"></div>
                <div class="lane-divider" id="lane-R"></div>
                <!-- Lines will be spawned by JS for speed effect -->
            </div>

            <div id="player-container">
                <div id="bike"></div>
                <div class="engine-glow"></div>
            </div>

            <div id="hud">
                <div class="hud-widget">
                    <div class="hud-label">Sincronia Era</div>
                    <div id="era-name" class="hud-value">...</div>
                </div>

                <div class="hud-widget" style="text-align: right;">
                    <div class="hud-label">Combustible</div>
                    <div id="deliveries" class="hud-value" style="color: var(--neon-blue); font-size: 2.5rem;">0 / 15
                    </div>
                    <div id="fuel-meter">
                        <div id="fuel-fill"></div>
                    </div>
                </div>
            </div>

            <div id="flash-success" class="flash flash-success"></div>
            <div id="flash-error" class="flash flash-error"></div>

            <div id="volume-container">
                <span style="font-size: 0.8rem; letter-spacing: 1px;">🔊</span>
                <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.5"
                    oninput="updateVolume(this.value)">
            </div>

            <div id="warp-effect"></div>
        </div>

        <!-- FEEDBACK -->
        <div id="feedback-screen" class="overlay" style="display:none;">
            <h1 id="feedback-title">MISSIÓ COMPLETA</h1>
            <p id="feedback-stats">Repartidor Legendari</p>
            <button class="btn-pro" onclick="location.reload()">RE-ACTIVAR</button>
        </div>
    </div>

    <!-- AUDIO -->
    <audio id="bg-music" loop></audio>

    <script>
        const SHAPES = ['img/cofre.png', 'img/bola.png', 'img/pergami.png'];
        const TARGET_SCORE = 15;

        const ERAS = [
            { id: 'medieval', name: "Edat Mitjana", color: "#6d4c41", bg: "img/fons.jpg", music: "audio/Neon Apex.m4a", target: TARGET_SCORE, db: ["Gregorià", "Trobador", "Neumes", "Guido", "Leonin", "Perotin"] },
            { id: 'renaixement', name: "Renaixement", color: "#2e7d32", bg: "img/fons.jpg", music: "audio/Neon Apex.m4a", target: TARGET_SCORE, db: ["Polifonia", "Madrigal", "Palestrina", "Josquin", "Llaüt"] },
            { id: 'barroc', name: "El Barroc", color: "#1565c0", bg: "img/fons.jpg", music: "audio/Neon Apex.m4a", target: TARGET_SCORE, db: ["Bach", "Vivaldi", "Òpera", "Fuga", "Suite", "Castrato"] },
            { id: 'classicisme', name: "Classicisme", color: "#c62828", bg: "img/fons.jpg", music: "audio/Neon Apex.m4a", target: TARGET_SCORE, db: ["Mozart", "Haydn", "Sonata", "Simfonia", "Viena"] },
            { id: 'romanticisme', name: "Romanticisme", color: "#6a1b9a", bg: "img/fons.jpg", music: "audio/Neon Apex.m4a", target: TARGET_SCORE, db: ["Beethoven", "Wagner", "Chopin", "Lied", "Virtuosisme"] },
            { id: 'segle20', name: "Segle XX", color: "#ff8f00", bg: "img/fons.jpg", music: "audio/Neon Apex.m4a", target: TARGET_SCORE, db: ["Jazz", "Stravinsky", "Electrònica", "Sinte", "Cage"] }
        ];

        let completedEras = [];
        let currentEraIndex = 0;
        let deliveries = 0;
        let fuel = 100;
        let speed = 10;
        let gameActive = false;
        let lane = 1; // 0: Left, 1: Center, 2: Right
        let activeArtifacts = [];
        let roadLines = [];
        let spawnTimer = 0;
        let lastArtifactSpawn = 0; // Cooldown for artifacts

        function showEraSelector() {
            document.getElementById('main-menu-content').style.display = 'none';
            const selector = document.getElementById('era-selector');
            selector.style.display = 'grid';
            selector.innerHTML = '';

            ERAS.forEach((era, index) => {
                const isCompleted = completedEras.includes(index);
                const card = document.createElement('div');
                card.className = `era-card ${isCompleted ? 'completed' : ''}`;
                card.innerHTML = `
                    <div style="font-size:0.7rem; opacity:0.6; margin-bottom:5px">NIVELL ${index + 1}</div>
                    <h3 style="margin:0; font-family:'Orbitron'; font-size:1rem; color:var(--neon-blue)">${era.name}</h3>
                    <div style="font-size:0.8rem; margin-top:8px; height:15px">${isCompleted ? '⭐ COMPLETAT' : ''}</div>
                `;
                card.onclick = () => startEra(index);
                selector.appendChild(card);
            });
        }

        function startEra(index) {
            currentEraIndex = index;
            fuel = 100;
            deliveries = 0;
            activeArtifacts.forEach(a => a.el.remove());
            activeArtifacts = [];
            initGame();
        }

        function initGame() {
            document.getElementById('start-screen').style.display = 'none';
            gameActive = true;
            setupEra();
            updateHUD();
            createStars();

            const music = document.getElementById('bg-music');
            music.volume = document.getElementById('volume-slider').value;
            music.play().catch(e => console.warn("Autoplay blocked", e));

            requestAnimationFrame(gameLoop);
        }

        function setupEra() {
            if (currentEraIndex >= ERAS.length) return;
            const era = ERAS[currentEraIndex];
            document.getElementById('era-name').innerText = era.name;
            deliveries = 0;
            speed = 5 + (currentEraIndex * 1); // Reduced base speed and increment

            const music = document.getElementById('bg-music');
            if (music.src !== era.music) {
                music.src = era.music;
                music.play().catch(e => console.warn("Music swap blocked", e));
            }

            // Visual warp
            const warp = document.getElementById('warp-effect');
            warp.style.opacity = 1;
            setTimeout(() => {
                warp.style.opacity = 0;
                const world = document.getElementById('world');
                const sky = document.getElementById('sky-visuals');
                if (era.bg) {
                    sky.style.background = `url('${era.bg}') center center / cover no-repeat`;
                    sky.style.filter = 'brightness(0.6)';
                    sky.querySelectorAll('.stars').forEach(s => s.style.display = 'none');
                    world.style.background = 'black';
                } else {
                    sky.style.background = 'none';
                    sky.querySelectorAll('.stars').forEach(s => s.style.display = 'block');
                    world.style.background = `radial-gradient(circle at 50% 30%, ${era.color}44 0%, #000 100%)`;
                }
            }, 300);
        }

        function createStars() {
            const container = document.getElementById('sky-visuals');
            for (let i = 0; i < 50; i++) {
                const s = document.createElement('div');
                s.className = 'stars';
                s.style.left = Math.random() * 100 + '%';
                s.style.top = Math.random() * 100 + '%';
                container.appendChild(s);
            }
        }

        // CONTROLS
        window.addEventListener('keydown', e => {
            if (!gameActive) return;
            if (e.key === 'ArrowLeft' && lane > 0) { lane--; moveBike(); }
            if (e.key === 'ArrowRight' && lane < 2) { lane++; moveBike(); }
        });

        window.addEventListener('touchstart', e => {
            if (!gameActive) return;
            const x = e.touches[0].clientX;
            if (x < window.innerWidth / 2 && lane > 0) { lane--; moveBike(); }
            else if (x >= window.innerWidth / 2 && lane < 2) { lane++; moveBike(); }
        }, { passive: true });

        function moveBike() {
            const container = document.getElementById('player-container');
            const bike = document.getElementById('bike');
            const pos = ['25%', '50%', '75%'];
            container.style.left = pos[lane];

            // Subtle leaning for side view (rotation on X/Z)
            const rotate = lane === 0 ? -10 : (lane === 2 ? 10 : 0);
            const scale = 1.1; // Slight pump
            bike.style.transform = `scale(${scale}) rotate(${rotate}deg)`;
            setTimeout(() => bike.style.transform = 'scale(1) rotate(0deg)', 200);
        }

        // GAME LOOP
        function gameLoop() {
            if (!gameActive) return;

            spawnRoadLines();
            updateRoadLines();

            spawnArtifacts();
            updateArtifacts();

            updateHUD();

            requestAnimationFrame(gameLoop);
        }

        function spawnRoadLines() {
            spawnTimer++;
            if (spawnTimer % 10 === 0) {
                const line = document.createElement('div');
                line.className = 'grid-line';
                document.getElementById('road-system').appendChild(line);
                roadLines.push({ el: line, y: 0 });
            }
        }

        function updateRoadLines() {
            roadLines.forEach((l, i) => {
                l.y += speed;
                l.el.style.bottom = l.y + 'px';
                l.el.style.opacity = 1 - (l.y / 1500);
                if (l.y > 1800) {
                    l.el.remove();
                    roadLines.splice(i, 1);
                }
            });
        }

        function spawnArtifacts() {
            const now = Date.now();
            if (now - lastArtifactSpawn < 1000) return; // REASONABLE COOLDOWN

            if (Math.random() < 0.02) { // BALANCED SPAWN PROBABILITY
                lastArtifactSpawn = now;
                const era = ERAS[currentEraIndex];
                const isCorrect = Math.random() > 0.5; // MORE INCORRECT ITEMS (50/50 balance)
                const isHazard = Math.random() < 0.15; // SLIGHTLY MORE HAZARDS

                let type = 'correct';
                let label = era.db[Math.floor(Math.random() * era.db.length)];

                if (!isCorrect) {
                    const otherEras = ERAS.filter((e, idx) => idx !== currentEraIndex);
                    const randomEra = otherEras[Math.floor(Math.random() * otherEras.length)];
                    label = randomEra.db[Math.floor(Math.random() * randomEra.db.length)];
                    type = 'danger';
                }

                // Unified hazards: use regular images and concepts, but they act as "danger" types
                if (isHazard) {
                    type = 'danger';
                    // Randomly assign a correct or incorrect label to the hazard to blend it in
                    const fakeIsCorrect = Math.random() > 0.5;
                    if (fakeIsCorrect) {
                        label = era.db[Math.floor(Math.random() * era.db.length)];
                    } else {
                        const otherEras = ERAS.filter((e, idx) => idx !== currentEraIndex);
                        const randomEra = otherEras[Math.floor(Math.random() * otherEras.length)];
                        label = randomEra.db[Math.floor(Math.random() * randomEra.db.length)];
                    }
                }

                const img = SHAPES[Math.floor(Math.random() * SHAPES.length)];

                const l = Math.floor(Math.random() * 3);
                const el = document.createElement('div');
                el.className = `artifact ${type}`;
                el.innerHTML = `<div class="artifact-box" style="background-image: url('${img}'); border:none; box-shadow:none;"></div><div style="display:block">${label}</div>`;

                const world = document.getElementById('world');
                world.appendChild(el);

                activeArtifacts.push({
                    el: el,
                    lane: l,
                    y: 0,
                    type: type,
                    collected: false
                });
            }
        }

        function updateArtifacts() {
            const h = window.innerHeight;
            activeArtifacts.forEach((a, i) => {
                a.y += speed;

                // 3D Perspective Mapping
                const progress = a.y / h;
                const scale = 0.1 + progress * 2.5;
                const top = 30 + progress * 70;

                const lanePos = [38.5, 50, 61.5]; // CORRECTED CALIBRATION
                const xOffset = (lanePos[a.lane] - 50) * scale;

                a.el.style.top = top + '%';
                a.el.style.left = (50 + xOffset) + '%';
                a.el.style.transform = `translate(-50%, -50%) scale(${scale})`;
                a.el.style.opacity = progress < 0.1 ? 0 : 1;

                // Collision
                if (progress > 0.8 && progress < 0.95 && a.lane === lane && !a.collected) {
                    a.collected = true;
                    handleCollection(a);
                    a.el.remove();
                    activeArtifacts.splice(i, 1);
                }

                if (a.y > h + 100) {
                    a.el.remove();
                    activeArtifacts.splice(i, 1);
                }
            });
        }

        function handleCollection(a) {
            if (a.type === 'correct') {
                deliveries++;
                playSFX('success');
                showFlash('success');
                if (deliveries >= ERAS[currentEraIndex].target) {
                    finishEra();
                }
            } else {
                fuel -= 15;
                playSFX('error');
                showFlash('error');
                if (fuel <= 0) gameOver();
            }
        }

        function showFlash(type) {
            const el = document.getElementById(`flash-${type}`);
            el.style.opacity = 0.4;
            setTimeout(() => el.style.opacity = 0, 100);
        }

        function finishEra() {
            if (!completedEras.includes(currentEraIndex)) {
                completedEras.push(currentEraIndex);
            }
            gameActive = false;

            // Visual warp back to menu
            const warp = document.getElementById('warp-effect');
            warp.style.opacity = 1;
            setTimeout(() => {
                warp.style.opacity = 0;
                document.getElementById('start-screen').style.display = 'flex';
                showEraSelector();
            }, 800);
        }

        function selectEra(index) {
            currentEraIndex = index;
            setupEra();
        }

        function updateHUD() {
            if (!gameActive || currentEraIndex >= ERAS.length) return;
            document.getElementById('deliveries').innerText = `${deliveries} / ${ERAS[currentEraIndex].target}`;
            document.getElementById('fuel-fill').style.width = fuel + '%';
        }

        function gameOver() {
            gameActive = false;
            document.getElementById('feedback-screen').style.display = 'flex';
            document.getElementById('feedback-title').innerText = "AVARIA TEMPORAL";
            document.getElementById('feedback-stats').innerText = "Has perdut la sincronització.";
        }

        function victory() {
            gameActive = false;
            document.getElementById('feedback-screen').style.display = 'flex';
            document.getElementById('feedback-title').innerText = "MISSIÓ COMPLETADA";
            document.getElementById('feedback-stats').innerText = "Ets el mestre del temps i la música.";
        }

        function updateVolume(val) {
            document.getElementById('bg-music').volume = val;
        }

        // Web Audio Procedural SFX
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSFX(type) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;
            if (type === 'success') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start();
                osc.stop(now + 0.1);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.2);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start();
                osc.stop(now + 0.2);
            }
        }
    </script>
</body>

</html>
