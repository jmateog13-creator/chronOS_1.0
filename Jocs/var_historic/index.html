<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El VAR Històric</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Teko:wght@400;700&family=Roboto:wght@400;700&display=swap');

        :root {
            --primary-color: #e74c3c;
            --success-color: #2ecc71;
            --text-color: #ecf0f1;
            --bg-dark: #2c3e50;
            --panel-bg: rgba(0, 0, 0, 0.85);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            background-color: #2c3e50;
            background-image: url('img/stadium_bg.png');
            /* Stadium bg */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            /* Keep bg fixed */
            color: var(--text-color);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        #game-container {
            width: 100%;
            height: 100%;
            max-width: 1200px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2;
            /* Ensure above scanlines if needed */
        }

        /* Scanlines Effect */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom,
                    rgba(255, 255, 255, 0),
                    rgba(255, 255, 255, 0) 50%,
                    rgba(0, 0, 0, 0.1) 50%,
                    rgba(0, 0, 0, 0.1));
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 5;
        }

        /* Start Screen */
        #start-screen {
            background: linear-gradient(135deg, rgba(20, 30, 48, 0.95), rgba(36, 59, 85, 0.95));
            padding: 3rem;
            border-radius: 20px;
            text-align: center;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 255, 255, 0.1);
            max-width: 800px;
            width: 90%;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-family: 'Teko', sans-serif;
            font-size: 5rem;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(to bottom, #ffffff, #b3cdd1);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            line-height: 0.9;
        }

        #start-screen p {
            font-size: 1.2rem;
            color: #bdc3c7;
            margin-bottom: 2rem;
            font-weight: 300;
        }

        .era-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 2rem;
        }

        .btn-era {
            background: rgba(255, 255, 255, 0.1);
            color: #ecf0f1;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 1.2rem;
            font-size: 1.3rem;
            font-family: 'Teko', sans-serif;
            font-weight: 500;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            border-radius: 8px;
        }

        .btn-era::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }

        .btn-era:hover {
            background: rgba(46, 204, 113, 0.8);
            /* Green gradient feel */
            border-color: #27ae60;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        }

        .btn-era:hover::before {
            left: 100%;
        }

        /* VAR Interface */
        #var-interface {
            width: 90%;
            max-width: 1000px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
        }

        /* Header Stats - Stadium Billboard Style */
        #scoreboard {
            display: flex;
            justify-content: space-around;
            /* Center items more */
            align-items: center;
            background: linear-gradient(to bottom, #111, #222);
            padding: 10px 40px;
            font-family: 'Teko', sans-serif;
            font-size: 3rem;
            /* Bigger */
            border: 4px solid #444;
            border-radius: 15px;
            color: #fff;
            /* White base */
            text-transform: uppercase;
            box-shadow:
                0 0 0 2px #000,
                /* Outer stroke */
                0 10px 20px rgba(0, 0, 0, 0.8),
                /* Shadow */
                inset 0 0 20px rgba(0, 0, 0, 1);
            /* Inner depth */
            margin-bottom: 10px;
        }

        #scoreboard span span {
            color: #f1c40f;
            /* Yellow numbers */
            text-shadow: 0 0 15px #f1c40f;
            font-size: 3.5rem;
        }

        /* Screen Area */
        #monitor-screen {
            background: #000 url('img/monitor_bg.png') no-repeat center center;
            background-size: cover;
            height: 300px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 5px solid #333;
            /* Thicker frame */
            border-radius: 4px;
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.8);
        }

        /* ... proper Replay label ... */
        #replay-label {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #e74c3c;
            font-family: 'Teko', sans-serif;
            font-size: 2.5rem;
            animation: blink 1s infinite;
            text-shadow: 0 0 10px red;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 4px;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        #play-text {
            font-size: 2.2rem;
            /* Slightly larger */
            text-align: center;
            padding: 40px;
            /* More padding */
            font-weight: bold;
            line-height: 1.4;
            z-index: 2;
            color: #ecf0f1;
            text-shadow: 2px 2px 0px #000, 0 0 10px rgba(0, 255, 255, 0.5);
            /* Readable on tech bg */
        }

        /* Timer Bar */
        #timer-container {
            width: 100%;
            height: 20px;
            /* Thicker */
            background: #111;
            margin-top: 0;
            /* Attach to screen bottom */
            border: 2px solid #333;
            border-top: none;
            border-radius: 0 0 10px 10px;
            overflow: hidden;
            position: relative;
        }

        #timer-bar {
            width: 100%;
            height: 100%;
            background: #2ecc71;
            /* Start Green */
            /* Transition width AND background-color */
            transition: width 5s linear, background-color 5s linear;
        }

        /* Controls */
        #controls {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .btn-decision {
            flex: 1;
            padding: 20px;
            font-family: 'Teko', sans-serif;
            font-size: 2rem;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            transition: transform 0.1s;
            color: white;
            border-radius: 5px;
        }

        #btn-valid {
            background: var(--success-color);
            box-shadow: 0 5px 0 #27ae60;
        }

        #btn-foul {
            background: var(--primary-color);
            box-shadow: 0 5px 0 #c0392b;
        }

        .btn-decision:active {
            transform: translateY(5px);
            box-shadow: none !important;
        }

        /* Feedback Overlay */
        #feedback-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        #feedback-title {
            font-family: 'Teko', sans-serif;
            font-size: 6rem;
            margin: 0;
            text-transform: uppercase;
            text-shadow: 0 0 20px currentColor;
        }

        .show-feedback {
            opacity: 1 !important;
            pointer-events: auto !important;
            /* Enable clicks */
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

        // --- GAME STATE ---
        let currentEra = null;
        let score = 0;
        let errors = 0;
        let gameActive = false;
        let currentPlay = null;
        let availablePlays = [];
        let timerInterval = null;
        let timeLeft = 5;

        // --- AUDIO ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'whistle') {
                // High trill
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(2000, now);
                osc.frequency.linearRampToValueAtTime(2500, now + 0.1);
                osc.frequency.linearRampToValueAtTime(2000, now + 0.2);
                gainNode.gain.setValueAtTime(0.5, now);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'goal') {
                // Cheering effect (noise)
                const bufferSize = audioCtx.sampleRate * 2; // 2 seconds
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const noiseFilter = audioCtx.createBiquadFilter();
                noiseFilter.type = 'lowpass';
                noiseFilter.frequency.value = 1000;
                noise.connect(noiseFilter);
                noiseFilter.connect(gainNode);
                gainNode.gain.setValueAtTime(0.5, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 2);
                noise.start(now);
            } else if (type === 'boo') {
                // Low noise
                const bufferSize = audioCtx.sampleRate * 2;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const noiseFilter = audioCtx.createBiquadFilter();
                noiseFilter.type = 'lowpass';
                noiseFilter.frequency.value = 300;
                noise.connect(noiseFilter);
                noiseFilter.connect(gainNode);
                gainNode.gain.setValueAtTime(0.5, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 2);
                noise.start(now);
            } else if (type === 'tick') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, now);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.start(now);
                osc.stop(now + 0.05);
            }
        }

        // --- LOGIC ---
        document.querySelectorAll('.btn-era').forEach(btn => {
            btn.addEventListener('click', () => {
                currentEra = btn.dataset.era;
                startGame();
            });
        });

        document.getElementById('btn-valid').addEventListener('click', () => handleDecision(true));
        document.getElementById('btn-foul').addEventListener('click', () => handleDecision(false));

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('var-interface').classList.remove('hidden');

            score = 0;
            errors = 0;
            gameActive = true;

            // Clone and shuffle
            availablePlays = [...DB[currentEra]];
            availablePlays.sort(() => Math.random() - 0.5);

            updateStats();
            nextPlay();
        }

        function updateStats() {
            document.getElementById('score').textContent = score;
            document.getElementById('errors').textContent = errors;
        }

        function nextPlay() {
            if (score + errors >= 20 || errors >= 3) {
                endGame();
                return;
            }

            if (availablePlays.length === 0) {
                endGame();
                return;
            }

            currentPlay = availablePlays.pop();
            document.getElementById('play-text').textContent = currentPlay.t;

            // Reset Timer state
            timeLeft = 5;
            const timerBar = document.getElementById('timer-bar');
            timerBar.style.transition = 'none';
            timerBar.style.width = '100%';
            timerBar.style.backgroundColor = '#2ecc71'; // Green start

            // Wait a tick to restart transition
            setTimeout(() => {
                timerBar.style.transition = 'width 5s linear, background-color 5s linear';
                timerBar.style.width = '0%';
                timerBar.style.backgroundColor = '#e74c3c'; // Turns Red
            }, 50);

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft <= 3) playSound('tick'); // Only tick last 3 seconds
                if (timeLeft <= 0) {
                    handleDecision(null); // Timeout
                }
            }, 1000);
        }

        function handleDecision(userDecision) {
            clearInterval(timerInterval);

            let isCorrect = false;
            if (userDecision === null) {
                // Timeout counts as error
                isCorrect = false;
            } else {
                isCorrect = (userDecision === currentPlay.v);
            }

            let title, color;
            if (isCorrect) {
                score++;
                title = "DECISIÓ CORRECTA!";
                color = "#2ecc71";
                playSound('whistle');
                setTimeout(() => playSound('goal'), 500);
            } else {
                errors++;
                title = "ERROR ARBITRAL!";
                color = "#e74c3c";
                playSound('boo');
            }

            showFeedback(title, color);
            updateStats();

            if (errors >= 3) {
                setTimeout(endGame, 1500);
            } else {
                setTimeout(() => {
                    hideFeedback();
                    nextPlay();
                }, 1500);
            }
        }

        function showFeedback(text, color) {
            const el = document.getElementById('feedback-overlay');
            const title = document.getElementById('feedback-title');
            title.textContent = text;
            title.style.color = color;
            el.classList.add('show-feedback');
        }

        function hideFeedback() {
            document.getElementById('feedback-overlay').classList.remove('show-feedback');
        }

        function endGame() {
            gameActive = false;
            clearInterval(timerInterval);

            let title, color;
            if (errors >= 3) {
                title = "A LA NEVERA! (EXPULSAT)";
                color = "#e74c3c";
                playSound('boo');
            } else if (score >= 18) {
                title = "MILLOR ÀRBITRE DE LA LLIGA!";
                color = "#f1c40f";
                playSound('goal');
            } else {
                title = "PARTIT FINALITZAT";
                color = "#fff";
            }

            showFeedback(title, color);

            // Add restart button
            const overlay = document.getElementById('feedback-overlay');
            if (!document.getElementById('restart-btn')) {
                const btn = document.createElement('button');
                btn.id = 'restart-btn';
                btn.textContent = "TORNAR AL MENÚ";
                btn.className = 'btn-era';
                btn.style.marginTop = '20px';
                btn.onclick = () => location.reload();
                overlay.appendChild(btn);
            }
        }

    </script>
</body>

</html>
