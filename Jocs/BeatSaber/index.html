<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beat Shooter Històric - Synthwave Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@400;700&display=swap');

        :root {
            --neon-blue: #00f2ff;
            --neon-pink: #ff007f;
            --neon-purple: #bc13fe;
            --bg-dark: #050505;
        }

        body {
            margin: 0;
            background: var(--bg-dark);
            overflow: hidden;
            font-family: 'Roboto', sans-serif;
            color: #fff;
            user-select: none;
            cursor: none;
            /* Custom crosshair */
        }

        #game-view {
            width: 100vw;
            height: 100vh;
            perspective: 800px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            position: relative;
            background: radial-gradient(circle at center, #1b1b2f 0%, #050505 100%);
        }

        /* 3D Track Visual */
        #track {
            width: 600px;
            height: 200vh;
            background:
                linear-gradient(90deg, transparent 0%, rgba(0, 242, 255, 0.1) 50%, transparent 100%),
                repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(0, 242, 255, 0.05) 40px, rgba(0, 242, 255, 0.05) 42px);
            transform: rotateX(60deg) translateY(-20%);
            position: absolute;
            bottom: -50%;
            z-index: 1;
            box-shadow: 0 0 50px rgba(0, 242, 255, 0.2);
        }

        /* HUD */
        #hud {
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: 100;
            font-family: 'Orbitron', sans-serif;
        }

        .hud-item {
            margin-bottom: 10px;
            font-size: 1.5rem;
            text-shadow: 0 0 10px var(--neon-blue);
        }

        .hud-value {
            color: var(--neon-blue);
            font-weight: bold;
        }

        #progress-container {
            width: 300px;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--neon-blue);
            margin-top: 10px;
            position: relative;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: var(--neon-blue);
            transition: width 0.3s;
            box-shadow: 0 0 15px var(--neon-blue);
        }

        /* Audio Panel */
        #audio-panel {
            position: absolute;
            top: 30px;
            right: 30px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid var(--neon-blue);
            display: flex;
            align-items: center;
            gap: 15px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            cursor: auto;
        }

        #volume-slider {
            accent-color: var(--neon-blue);
            width: 100px;
            cursor: pointer;
        }

        /* Cubes */
        .block {
            position: absolute;
            width: 160px;
            height: 160px;
            background: rgba(0, 242, 255, 0.3);
            border: 4px solid var(--neon-blue);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            text-align: center;
            font-weight: bold;
            font-family: 'Orbitron', sans-serif;
            transform-style: preserve-3d;
            box-shadow: 0 0 30px var(--neon-blue), inset 0 0 20px var(--neon-blue);
            text-transform: uppercase;
            padding: 10px;
            box-sizing: border-box;
            z-index: 10;
            cursor: none;
            transition: background 0.1s, border-color 0.1s;
        }

        /* Crosshair */
        #crosshair {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 2px solid var(--neon-pink);
            border-radius: 50%;
            pointer-events: none;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px var(--neon-pink);
            transform: translate(-50%, -50%);
        }

        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: var(--neon-pink);
        }

        #crosshair::before {
            width: 20px;
            height: 2px;
        }

        #crosshair::after {
            width: 2px;
            height: 20px;
        }

        #crosshair-dot {
            width: 4px;
            height: 4px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 5px #fff;
        }

        /* Interaction Effects */
        .spark {
            position: absolute;
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            z-index: 250;
            box-shadow: 0 0 20px #fff, 0 0 30px var(--neon-blue);
            animation: sparkFade 0.6s forwards ease-out;
        }

        @keyframes sparkFade {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            100% {
                transform: scale(0);
                opacity: 0;
            }
        }

        /* Screens */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            text-align: center;
            cursor: auto;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 4.5rem;
            color: var(--neon-blue);
            text-shadow: 0 0 25px var(--neon-blue);
            margin: 0;
            letter-spacing: 5px;
        }

        .btn-start {
            margin-top: 40px;
            padding: 20px 60px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            background: transparent;
            border: 2px solid var(--neon-blue);
            color: var(--neon-blue);
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 15px var(--neon-blue);
            font-weight: bold;
        }

        .btn-start:hover {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 40px var(--neon-blue);
        }

        .hidden {
            display: none !important;
        }
    </style>

    <!-- INICIO_AUTO_ZOOM_ANTIGRAVITY -->
    <script>
        function autoEscalar() {
            const anchoDiseno = 1920; 
            const escala = window.innerWidth / anchoDiseno;
            if (escala < 1) {
                document.body.style.zoom = escala;
            } else {
                document.body.style.zoom = 1;
            }
        }
        window.addEventListener('resize', autoEscalar);
        window.addEventListener('DOMContentLoaded', autoEscalar);
    </script>
    <!-- FIN_AUTO_ZOOM_ANTIGRAVITY -->

</head>

<body>

    <div id="game-view">
        <div id="track"></div>

        <div id="hud">
            <div class="hud-item">ÈPOCA: <span id="level-name" class="hud-value">-</span></div>
            <div class="hud-item">PUNTUACIÓ: <span id="score" class="hud-value">0</span> / 1000</div>
            <div id="progress-container">
                <div id="progress-bar"></div>
            </div>
        </div>

        <div id="audio-panel">
            <span>VOLUM</span>
            <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.4">
        </div>

        <!-- Crosshair -->
        <div id="crosshair">
            <div id="crosshair-dot"></div>
        </div>

        <!-- Overlays -->
        <div id="start-screen" class="overlay">
            <h1>BEAT SHOOTER<br>HISTÒRIC</h1>
            <p style="max-width: 650px; color: #aaa; margin-top: 25px; line-height: 1.6; font-size: 1.1rem;">
                Dispara als conceptes correctes de cada època fent <b>CLIC</b>. <br>
                Els encerts sumen 100, els errors en resten 100. Arriba a 1000 per avançar!
            </p>
            <button class="btn-start" onclick="startGame()">COMENÇAR MISSIÓ</button>
        </div>

        <div id="win-screen" class="overlay hidden">
            <h1 id="win-title">ÈPOCA COMPLETADA!</h1>
            <button class="btn-start" id="next-level-btn">SEGÜENT ÈPOCA</button>
        </div>
    </div>

    <script>
        const DB = [
            {
                id: "medieval",
                name: "EDAT MITJANA",
                targets: ["MONODIA", "GREGORIÀ"],
                distractors: ["SIMFONIA", "PIANO", "POLIFONIA", "OPERA"]
            },
            {
                id: "renaixement",
                name: "RENAIXEMENT",
                targets: ["POLIFONIA", "MADRIGAL"],
                distractors: ["ROMANTICISME", "JAZZ", "ELECTRONICA", "SOLO"]
            },
            {
                id: "barroc",
                name: "BARROC",
                targets: ["BAIX CONTINU", "FUGA"],
                distractors: ["RUBATO", "ROCK", "BLUES", "SINTETITZADOR"]
            },
            {
                id: "classicisme",
                name: "CLASSICISME",
                targets: ["SONATA", "ORDRE"],
                distractors: ["CAPUTXA", "DISSONANCIA", "CANT GREGORIA", "DRUM MACHINE"]
            },
            {
                id: "romanticisme",
                name: "ROMANTICISME",
                targets: ["PASSIO", "RUBATO"],
                distractors: ["ESTRUCTURA", "RACIONALITAT", "CLAVICEMBAL", "NEUMES"]
            },
            {
                id: "segle_xx",
                name: "SEGLE XX",
                targets: ["DODECAFONISME", "ELECTRÒNICA"],
                distractors: ["MADRIGAL", "MONJO", "MONODIA", "CONTRAPUNT"]
            }
        ];

        let currentEraIndex = 0;
        let score = 0;
        let gameActive = false;
        let blocks = [];
        let spawnInterval = null;

        // Background Music
        const bgMusic = new Audio('Pixel Rush.m4a');
        bgMusic.loop = true;
        bgMusic.volume = 0.4;
        const volSlider = document.getElementById('volume-slider');
        volSlider.oninput = () => bgMusic.volume = volSlider.value;

        // Audio Context for SFX
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSFX(freq, type, duration, isGunshot = false) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            if (isGunshot) {
                osc.type = 'square';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + duration);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            } else {
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + duration);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            }

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        // Crosshair Logic
        const crosshair = document.getElementById('crosshair');
        let mouseX = 0, mouseY = 0;

        document.addEventListener('mousemove', e => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            crosshair.style.left = mouseX + 'px';
            crosshair.style.top = mouseY + 'px';
        });

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('win-screen').classList.add('hidden');
            bgMusic.play().catch(e => console.log("Music blocked", e));
            score = 0;
            gameActive = true;
            updateHUD();
            startSpawning();
        }

        function updateHUD() {
            const era = DB[currentEraIndex];
            document.getElementById('level-name').textContent = era.name;
            document.getElementById('score').textContent = score;
            document.getElementById('progress-bar').style.width = (score / 10) + '%';
        }

        function startSpawning() {
            if (spawnInterval) clearInterval(spawnInterval);
            spawnInterval = setInterval(() => {
                if (gameActive) spawnBlock();
            }, 1500); // Slower spawn rate
        }

        function spawnBlock() {
            const era = DB[currentEraIndex];
            const isCorrect = Math.random() > 0.45;
            const text = isCorrect ?
                era.targets[Math.floor(Math.random() * era.targets.length)] :
                era.distractors[Math.floor(Math.random() * era.distractors.length)];

            const el = document.createElement('div');
            el.className = 'block';
            el.textContent = text;

            // Random Lanes
            const lanes = [-280, -140, 0, 140, 280];
            const lane = lanes[Math.floor(Math.random() * lanes.length)];

            const blockObj = { el, z: -2000, lane: lane, isCorrect, active: true };

            // Interaction on Click
            el.onmousedown = (e) => {
                if (blockObj.active && blockObj.z > -400) {
                    processHit(blockObj);
                }
            };

            blocks.push(blockObj);
            document.getElementById('game-view').appendChild(el);
            animateBlock(blockObj);
        }

        function animateBlock(b) {
            if (!b.active || !gameActive) return;
            b.z += 10; // Slower movement speed (from 18 down to 10)

            const scale = 1200 / (1200 - b.z);
            if (b.z < 1100) {
                b.el.style.transform = `translate3d(${b.lane * scale}px, ${250 * (1 - scale)}px, ${b.z}px) scale(${scale})`;
                b.el.style.opacity = Math.max(0, (b.z + 2000) / 1000);
            }

            if (b.z > 400) {
                b.active = false;
                b.el.remove();
                blocks = blocks.filter(item => item !== b);
            } else {
                requestAnimationFrame(() => animateBlock(b));
            }
        }

        function processHit(b) {
            b.active = false;
            createSparks(mouseX, mouseY, b.isCorrect ? '#00f2ff' : '#ff0000');

            if (b.isCorrect) {
                score += 100;
                playSFX(1200, 'sine', 0.15, true); // Gunshot-like pop
                b.el.style.transition = 'all 0.1s';
                b.el.style.transform += ' scale(2)';
                b.el.style.background = '#fff';
                b.el.style.opacity = '0';
            } else {
                score = Math.max(0, score - 100);
                playSFX(80, 'sawtooth', 0.4);
                b.el.style.background = '#ff0000';
                b.el.style.borderColor = '#fff';
                b.el.style.boxShadow = '0 0 80px #ff0000';
            }

            updateHUD();
            setTimeout(() => b.el.remove(), 100);

            if (score >= 1000) {
                levelWin();
            }
        }

        function createSparks(x, y, color) {
            for (let i = 0; i < 20; i++) {
                const s = document.createElement('div');
                s.className = 'spark';
                s.style.left = x + 'px';
                s.style.top = y + 'px';
                s.style.backgroundColor = color === '#00f2ff' ? '#fff' : '#ff0000';
                s.style.boxShadow = `0 0 15px ${color}`;

                const vx = (Math.random() - 0.5) * 20;
                const vy = (Math.random() - 0.5) * 20;
                document.body.appendChild(s);

                let sx = x, sy = y;
                const anim = setInterval(() => {
                    sx += vx; sy += vy;
                    s.style.left = sx + 'px';
                    s.style.top = sy + 'px';
                    s.style.opacity = parseFloat(s.style.opacity || 1) - 0.05;
                    if (parseFloat(s.style.opacity) <= 0) {
                        clearInterval(anim);
                        s.remove();
                    }
                }, 16);
            }
        }

        function levelWin() {
            gameActive = false;
            clearInterval(spawnInterval);
            blocks.forEach(b => b.el.remove());
            blocks = [];

            const winOverlay = document.getElementById('win-screen');
            const winTitle = document.getElementById('win-title');
            const nextBtn = document.getElementById('next-level-btn');

            winOverlay.classList.remove('hidden');

            if (currentEraIndex < DB.length - 1) {
                winTitle.textContent = `${DB[currentEraIndex].name} COMPLETADA!`;
                nextBtn.textContent = "SEGÜENT ÈPOCA";
                nextBtn.onclick = () => {
                    currentEraIndex++;
                    startGame();
                };
            } else {
                winTitle.textContent = "HAS COMPLETAT TOTA LA HISTÒRIA!";
                nextBtn.textContent = "TORNAR A JUGAR";
                nextBtn.onclick = () => {
                    currentEraIndex = 0;
                    startGame();
                };
            }
        }

    </script>
</body>

</html>
