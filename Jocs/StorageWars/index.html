<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storage Wars: Subhasta de Trasters</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Roboto:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --safety-orange: #ff8c00;
            --caution-yellow: #ffd400;
            --gunmetal: #2d2d2d;
            --gritty-black: #1a1a1a;
            --metal-border: #888;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--gritty-black);
            color: #fff;
            font-family: 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            width: 1000px;
            height: 750px;
            background: #000;
            display: flex;
            flex-direction: column;
            position: relative;
            border: 12px solid #333;
            box-shadow: 0 0 100px rgba(0, 0, 0, 0.9), inset 0 0 50px rgba(0, 0, 0, 0.5);
            /* Rivet effect */
            outline: 4px dashed #555;
            outline-offset: -8px;
        }

        #hud {
            padding: 20px 30px;
            background: linear-gradient(180deg, #444 0%, #222 100%);
            border-bottom: 5px solid var(--safety-orange);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Anton', sans-serif;
            font-size: 1.8rem;
            color: var(--caution-yellow);
            text-shadow: 3px 3px 0 #000;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        #volume-control {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1.2rem;
            color: #fff;
            background: rgba(0, 0, 0, 0.3);
            padding: 5px 15px;
            border-radius: 20px;
        }

        input[type=range] {
            accent-color: var(--safety-orange);
            cursor: pointer;
        }

        #hud span {
            color: #fff;
        }

        #locker-container {
            flex-grow: 1;
            position: relative;
            background: #222 no-repeat center center;
            background-size: cover;
            overflow: hidden;
        }

        #shutter {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('img/shutter_texture.png') no-repeat center center;
            background-size: cover;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-bottom: 10px solid #333;
        }

        #shutter-label {
            background: var(--safety-orange);
            color: #000;
            padding: 10px 60px;
            font-size: 3rem;
            font-family: 'Anton', sans-serif;
            border: 6px solid #000;
            transform: rotate(-3deg);
            box-shadow: 5px 5px 0 rgba(0, 0, 0, 0.5);
        }

        #controls {
            padding: 25px;
            background: #222;
            border-top: 4px solid var(--gunmetal);
            display: flex;
            justify-content: space-around;
            gap: 20px;
        }

        button {
            border: none;
            padding: 20px;
            font-size: 1.8rem;
            font-family: 'Anton', sans-serif;
            cursor: pointer;
            border-radius: 4px;
            flex-grow: 1;
            transition: transform 0.1s, filter 0.2s;
            text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.5);
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            filter: grayscale(1);
        }

        #btn-bet {
            background: var(--safety-orange);
            color: #000;
            border-bottom: 6px solid #d35400;
        }

        #btn-bet:hover {
            background: #ff9d26;
        }

        #btn-pass {
            background: #c0392b;
            color: #fff;
            border-bottom: 6px solid #8e1b10;
        }

        #btn-pass:hover {
            background: #d64535;
        }

        #msg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(15px);
            /* Premium Glassmorphism */
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: all 0.5s ease;
        }

        .big-txt {
            font-family: 'Anton';
            font-size: 6rem;
            color: var(--safety-orange);
            text-shadow: 6px 6px 0 #000;
            margin-bottom: 0px;
            letter-spacing: 2px;
        }

        .sub-txt {
            font-size: 1.8rem;
            color: var(--caution-yellow);
            margin-top: 0px;
            margin-bottom: 40px;
            text-transform: uppercase;
            font-family: 'Anton';
        }

        #start-btn {
            background: linear-gradient(to bottom, var(--caution-yellow), #b89a00);
            color: #000;
            padding: 15px 50px;
            font-size: 2.2rem;
            border-radius: 0;
            border: 5px solid #000;
            cursor: pointer;
            box-shadow: 0 10px 0 #6d5b00;
            transition: all 0.1s ease;
            max-height: 80px;
            /* Fix for stretching */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #start-btn:hover {
            transform: translateY(2px);
            box-shadow: 0 8px 0 #6d5b00;
        }

        #start-btn:active {
            transform: translateY(8px);
            box-shadow: 0 2px 0 #6d5b00;
        }

        #era-display {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.95) 0%, rgba(30, 30, 30, 0.95) 100%);
            padding: 15px 40px;
            border: 4px solid var(--safety-orange);
            font-family: 'Anton', sans-serif;
            font-size: 3rem;
            color: #fff;
            z-index: 4;
            display: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            border-radius: 0;
        }

        .timer-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 10px;
            background: var(--safety-orange);
            width: 100%;
            z-index: 6;
            display: none;
        }
    </style>

    <!-- INICIO_AUTO_ZOOM_ANTIGRAVITY -->
    <script>
        function autoEscalar() {
            const anchoDiseno = 1920; 
            const escala = window.innerWidth / anchoDiseno;
            if (escala < 1) {
                document.body.style.zoom = escala;
            } else {
                document.body.style.zoom = 1;
            }
        }
        window.addEventListener('resize', autoEscalar);
        window.addEventListener('DOMContentLoaded', autoEscalar);
    </script>
    <!-- FIN_AUTO_ZOOM_ANTIGRAVITY -->

</head>

<body>
    <div id="game-container">
        <div id="hud">
            <div>✅ ENCERTS: <span id="money-val">0</span>/12</div>
            <div id="volume-control">
                🔊 <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.5"
                    oninput="changeVolume(this.value)">
            </div>
            <div>LOT <span id="round-val">1</span>/12</div>
        </div>
        <div id="locker-container">
            <div id="era-display"></div>
            <div id="shutter">
                <div id="shutter-label">LOT #1</div>
            </div>
            <div class="timer-bar" id="timer"></div>
        </div>
        <div id="controls">
            <button id="btn-pass" onclick="makeDecision(false)" disabled>🔴 PASSAR</button>
            <button id="btn-bet" onclick="makeDecision(true)" disabled>🟢 APOSTAR (300€)</button>
        </div>
        <div id="msg-overlay">
            <div class="big-txt">STORAGE WARS</div>
            <div class="sub-txt">EDICIÓ HISTÒRICA</div>
            <p style="font-size: 1.2rem; max-width: 80%; line-height: 1.6;">
                Inspecciona el lot ràpidament.<br>
                Busca objectes que pertanyin a l'època demanada.<br>
                Tens <b>3 SEGONS</b> abans que la persiana es tanqui!
            </p>
            <button id="start-btn" onclick="startGame()">ENTRAR A LA SUBHASTA</button>
        </div>
    </div>

    <audio id="bg-music" loop>
        <source src="audio/Concrete Dust Countdown.m4a" type="audio/mpeg">
    </audio>

    <script>
        const SCENARIOS = [
            { era: "EDAT MITJANA", img: "mitjana1.jpg" },
            { era: "EDAT MITJANA", img: "mitjana2.jpg" },
            { era: "RENAIXEMENT", img: "renaixement1.jpg" },
            { era: "RENAIXEMENT", img: "renaixement2.jpg" },
            { era: "BARROC", img: "barroc1.jpg" },
            { era: "BARROC", img: "barroc2.jpg" },
            { era: "CLASSICISME", img: "classicisme1.jpg" },
            { era: "CLASSICISME", img: "classicisme2.jpg" },
            { era: "ROMANTICISME", img: "romanticisme1.jpg" },
            { era: "ROMANTICISME", img: "romanticisme2.jpg" },
            { era: "SEGLE XX", img: "segleXX1.jpg" },
            { era: "SEGLE XX", img: "sehleXX2.jpg" }
        ];

        let successes = 0, currentRound = 1, currentTargetEra = "", currentScenario = null;
        let gameActive = false;

        function updateHUD() {
            document.getElementById('money-val').textContent = successes;
            document.getElementById('round-val').textContent = currentRound;
        }

        function startGame() {
            successes = 0;
            currentRound = 1;
            SCENARIOS.sort(() => Math.random() - 0.5); // Shuffle scenarios
            gameActive = true;
            updateHUD();

            // Play music
            const music = document.getElementById('bg-music');
            music.volume = document.getElementById('volume-slider').value;
            music.play().catch(e => console.log("Audio play blocked by browser. Click to play."));

            startRound();
        }

        function changeVolume(v) {
            document.getElementById('bg-music').volume = v;
        }

        function startRound() {
            if (currentRound > 12) return endGame();

            // Randomly decide if this round will be a MATCH or NOT
            const willMatch = Math.random() > 0.5;
            currentScenario = SCENARIOS[currentRound - 1];

            if (willMatch) {
                currentTargetEra = currentScenario.era;
            } else {
                const eras = ["EDAT MITJANA", "RENAIXEMENT", "BARROC", "CLASSICISME", "ROMANTICISME", "SEGLE XX"];
                const otherEras = eras.filter(e => e !== currentScenario.era);
                currentTargetEra = otherEras[Math.floor(Math.random() * otherEras.length)];
            }

            // Setup UI
            document.getElementById('era-display').textContent = currentTargetEra;
            document.getElementById('era-display').style.display = 'block';
            document.getElementById('shutter-label').textContent = `LOT #${currentRound}`;
            document.getElementById('locker-container').style.backgroundImage = `url('img/${currentScenario.img}')`;

            showMsg(`LOT #${currentRound}`, `Busquem: <b>${currentTargetEra}</b>`, "OBRIR PERSIANA", () => openShutter());

            document.getElementById('btn-pass').disabled = true;
            document.getElementById('btn-bet').disabled = true;
        }

        function openShutter() {
            document.getElementById('msg-overlay').style.display = 'none';
            document.getElementById('shutter').style.transform = "translateY(-100%)";

            const timer = document.getElementById('timer');
            timer.style.display = 'block';
            timer.style.width = '100%';

            let start = null;
            function animate(timestamp) {
                if (!start) start = timestamp;
                let progress = timestamp - start;
                let width = Math.max(0, 100 - (progress / 3000) * 100);
                timer.style.width = width + "%";
                if (progress < 3000) {
                    requestAnimationFrame(animate);
                } else {
                    closeShutter();
                }
            }
            requestAnimationFrame(animate);
        }

        function closeShutter() {
            document.getElementById('shutter').style.transform = "translateY(0%)";
            document.getElementById('timer').style.display = 'none';
            document.getElementById('era-display').style.display = 'none';

            setTimeout(() => {
                document.getElementById('btn-pass').disabled = false;
                document.getElementById('btn-bet').disabled = false;
            }, 500);
        }

        function makeDecision(bet) {
            const isMatch = (currentScenario.era === currentTargetEra);
            const correct = (bet && isMatch) || (!bet && !isMatch);

            if (correct) successes++;

            updateHUD();

            showMsg(correct ? "BON COP D'ULL!" : "MALA INVERSIÓ",
                correct ? (bet ? "Has trobat els instruments correctes!" : "Ben fet, aquest traster no era d'aquesta era.") :
                    (bet ? "Aquest traster no contenia el que buscàvem." : "T'has passat de llarg un lot valuós!"),
                "SEGÜENT", () => { currentRound++; startRound(); });
        }

        function showMsg(t, s, b, cb) {
            const o = document.getElementById('msg-overlay');
            o.style.display = 'flex';
            o.querySelector('.big-txt').textContent = t;
            o.querySelector('p').innerHTML = s;
            const btn = document.getElementById('start-btn');
            btn.textContent = b;
            btn.onclick = cb;
        }

        function endGame() {
            const win = successes >= 10;
            showMsg(win ? "NEGOCI RODÓ!" : "RUÏNA TOTAL",
                `Has encertat <b>${successes}/12</b> lots.<br>${win ? 'Ets un mestre de les subhastes!' : 'Cal millorar la teva vista clínica.'}`,
                "TORNAR A PROVAR", () => startGame());
        }
    </script>
</body>

</html>
