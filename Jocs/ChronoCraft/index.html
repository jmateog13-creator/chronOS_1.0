<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrono-Craft: Music Builder</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-sky: #87CEEB;
            --bg-grass: #567d46;
            --wood-dark: #3b2e2a;
            --wood-light: #5c4b43;
            --stone: #7f8c8d;
            --gold: #f1c40f;
            --text-shadow: 2px 2px 0 #000;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'VT323', monospace;
            background-color: #87CEEB;
            background-image: url('img/fons.jpg');
            background-size: cover;
            background-position: center bottom;
            color: white;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* UI Headers */
        header {
            width: 100%;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            border-bottom: 4px solid var(--wood-dark);
            z-index: 100;
        }

        h1 {
            font-size: 2.5rem;
            margin: 0;
            text-shadow: var(--text-shadow);
            letter-spacing: 2px;
        }

        #score-board {
            font-size: 2rem;
            text-shadow: var(--text-shadow);
        }

        /* Main Game Area */
        #game-area {
            display: flex;
            flex-grow: 1;
            width: 100%;
            max-width: 1600px;
            padding: 20px;
            gap: 40px;
            /* More space */
            justify-content: center;
            align-items: stretch;
        }

        /* Villager Side */
        #villager-zone {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            /* No background here, clean look */
        }

        .villager-bubble {
            background: white;
            color: black;
            padding: 20px;
            border-radius: 10px;
            position: relative;
            margin-bottom: 20px;
            font-size: 1.5rem;
            text-align: center;
            border: 4px solid black;
            box-shadow: 5px 5px 0 rgba(0, 0, 0, 0.5);
            max-width: 400px;
        }

        .villager-bubble::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            border: 10px solid transparent;
            border-top-color: black;
        }

        /* HUGE VILLAGER */
        .villager-img {
            width: 450px;
            height: auto;
            image-rendering: pixels;
            filter: drop-shadow(8px 8px 0 rgba(0, 0, 0, 0.4));
            transition: transform 0.2s;
        }

        /* Crafting Table Side */
        #crafting-zone {
            flex: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        .crafting-table {
            background: var(--wood-light);
            padding: 20px;
            border: 8px solid var(--wood-dark);
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            position: relative;
            box-shadow: 10px 10px 0 rgba(0, 0, 0, 0.5);
        }

        .craft-slot {
            width: 100px;
            height: 100px;
            background: rgba(0, 0, 0, 0.5);
            border: 4px inset var(--wood-dark);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #build-btn {
            background: #27ae60;
            border: 4px solid #fff;
            color: white;
            font-family: 'VT323', monospace;
            font-size: 2rem;
            padding: 10px 40px;
            cursor: pointer;
            text-shadow: var(--text-shadow);
            box-shadow: 0 6px 0 #1e8449;
            transition: all 0.1s;
        }

        #build-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #1e8449;
        }

        /* Inventory */
        #inventory {
            width: 100%;
            /* No background, no border -> Clean look */
            /* But we keep padding/grid */
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 20px;
            height: 500px;
            overflow-y: visible;
            /* Try visible to avoid clipping, assuming items fit. If not, auto */
            /* Actually, let's use auto but move tooltips to BODY to fix clipping 100% */
            overflow-y: auto;
            margin-top: auto;
        }

        .cube-container {
            width: 120px;
            height: 120px;
            cursor: grab;
            margin: 5px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .cube-container:hover {
            transform: scale(1.15);
        }

        .block-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
            filter: drop-shadow(5px 5px 0 rgba(0, 0, 0, 0.5));
        }

        /* GLOBAL TOOLTIP - Moved out of container context to BODY */
        #global-tooltip {
            position: fixed;
            /* Fixed to viewport */
            background: rgba(0, 0, 0, 0.95);
            color: #fff;
            padding: 15px;
            font-size: 1.3rem;
            border: 3px solid #fff;
            display: none;
            z-index: 20000;
            width: 300px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            /* Mouse through */
            border-radius: 8px;
        }

        #global-tooltip strong {
            display: block;
            font-size: 1.6rem;
            color: var(--gold);
            margin-bottom: 5px;
        }

        /* Overlays */
        #loading-screen,
        #win-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .start-btn {
            background: #3498db;
            color: white;
            padding: 20px 60px;
            font-size: 2rem;
            border: 4px solid white;
            font-family: 'VT323';
            cursor: pointer;
        }

        .hidden {
            display: none !important;
        }

        @keyframes flash-red {
            0% {
                background: rgba(255, 0, 0, 0.5);
            }

            100% {
                background: transparent;
            }
        }

        .damage-effect {
            animation: flash-red 0.5s ease-out;
        }
    </style>

    <!-- INICIO_AUTO_ZOOM_ANTIGRAVITY -->
    <script>
        function autoEscalar() {
            const anchoDiseno = 1920; 
            const escala = window.innerWidth / anchoDiseno;
            if (escala < 1) {
                document.body.style.zoom = escala;
            } else {
                document.body.style.zoom = 1;
            }
        }
        window.addEventListener('resize', autoEscalar);
        window.addEventListener('DOMContentLoaded', autoEscalar);
    </script>
    <!-- FIN_AUTO_ZOOM_ANTIGRAVITY -->

</head>

<body>
    <!-- Global Tooltip Container -->
    <div id="global-tooltip"></div>

    <!-- Title Screen -->
    <div id="loading-screen" class="title-screen">
        <h1 style="color:var(--gold)">CHRONO-CRAFT</h1>
        <p style="font-size: 1.5rem; color: #ddd;">Music Builder Edition</p>
        <button class="start-btn" onclick="startGame()">JUGAR / START</button>
    </div>

    <!-- Win Screen -->
    <div id="win-screen" class="hidden">
        <h1 style="color: #2ecc71">VICTÒRIA!</h1>
        <button class="start-btn" onclick="location.reload()">NOVA PARTIDA</button>
    </div>

    <!-- Audio -->
    <audio id="bg-music" loop>
        <source src="audio/Blockside Sunrise.m4a" type="audio/mp3">
    </audio>

    <!-- Header -->
    <header>
        <div style="display: flex; align-items: center; gap: 20px;">
            <h1>CHRONO-CRAFT</h1>
            <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.5">
        </div>
        <div id="score-board">REPTE: <span id="current-score">0</span> / 6</div>
    </header>

    <!-- Game Area -->
    <div id="game-area">
        <div id="villager-zone">
            <div class="villager-bubble">
                <p id="request-text" style="font-size: 1.8rem; margin: 0;">Hmmm...</p>
                <div style="font-size: 1.1rem; color: #555; margin-top: 10px;" id="request-hint"></div>
            </div>
            <!-- VILLAGER IMAGE -->
            <img src="img/villager.png" class="villager-img" alt="Vilatà">
        </div>

        <div id="crafting-zone">
            <div class="crafting-table" id="crafting-slots">
                <div class="craft-slot" data-slot="0"></div>
                <div class="craft-slot" data-slot="1"></div>
                <div class="craft-slot" data-slot="2"></div>
                <div style="font-size: 3rem;">➡</div>
                <div class="craft-slot" id="result-slot" style="border: 2px solid var(--gold);">?</div>
            </div>
            <button id="build-btn" onclick="attemptCraft()">FORJAR</button>
            <div id="inventory"></div>
        </div>
    </div>

    <script>
        // --- UPDATED DATA: 3 Items per Era, Simplifed Recipes ---
        const GAME_DATA = {
            win_score: 6, // 1 per era
            ingredients_pool: [
                // MITJANA (Keep 3)
                { id: "monestir", name: "Monestir", type: "mitjana", icon: "⛪", desc: "Centre cultural i religiós medieval.", img: "monestir.png" },
                { id: "llati", name: "Llatí", type: "mitjana", icon: "📜", desc: "Llengua culta de l'Església.", img: "pergami.png" },
                { id: "monodia", name: "Monodia", type: "mitjana", icon: "➖", desc: "Cant d'una sola veu (Cant Gregorià).", img: "monodia.png" },

                // RENAIXEMENT (Keep 3)
                { id: "humanisme", name: "Humanisme", type: "renaix", icon: "🧠", desc: "L'home és el centre, no Déu.", img: "humanisme.png" },
                { id: "polifonia", name: "Polifonia", type: "renaix", icon: "🎼", desc: "Moltes veus sonant alhora.", img: "polifonia.png" },
                { id: "equilibri", name: "Equilibri", type: "renaix", icon: "⚖️", desc: "Art proporcionat i simètric.", img: "equilibri.png" },

                // BARROC (Keep 3)
                { id: "baixcontinu", name: "Baix Continu", type: "barroc", icon: "🎹", desc: "La base rítmica i harmònica del Barroc.", img: "baixcontinu.png" },
                { id: "contrast", name: "Contrast", type: "barroc", icon: "🌗", desc: "Fort vs Fluix, Llum vs Foscor.", img: "contrast.png" },
                { id: "luxe", name: "Luxe", type: "barroc", icon: "👑", desc: "Decoració recarregada i or.", img: "luxe.png" },

                // CLASSICISME (Keep 3)
                { id: "rao", name: "Raó/Ordre", type: "classic", icon: "📐", desc: "Música lògica, clara i ordenada.", img: "rao.png" },
                { id: "melodia_ac", name: "Melodia Acomp.", type: "classic", icon: "🎶", desc: "Melodia clara amb acompanyament suau.", img: "melodia.png" },
                { id: "orquestra", name: "Orquestra", type: "classic", icon: "🎻", desc: "L'orquestra simfònica neix aquí.", img: "orquesta.png" },

                // ROMANTICISME (Keep 3)
                { id: "sentiment", name: "Sentiment", type: "roman", icon: "❤️", desc: "Expressar emoció pura i passió.", img: "sentiment.png" },
                { id: "natura", name: "Natura", type: "roman", icon: "🌲", desc: "Boscos misteriosos i tempestes.", img: "natura.png" },
                { id: "virtuos", name: "Virtuosisme", type: "roman", icon: "⚡", desc: "Tocar molt ràpid i difícil.", img: "virtuosisme.png" },

                // SEGLE XX (Keep 3)
                { id: "trencament", name: "Trencament", type: "sxx", icon: "🔨", desc: "Trencar les normes del passat.", img: "trencament.png" },
                { id: "tecnologia", name: "Tecnologia", type: "sxx", icon: "💾", desc: "Noves eines electròniques.", img: "tecnologia.png" },
                { id: "dissonancia", name: "Dissonància", type: "sxx", icon: "💢", desc: "Sons que xoquen i molesten.", img: "dissonancia.png" }
            ],
            recipes: [
                { name: "Cant Gregorià (E. Mitjana)", req: ["Monestir", "Llatí", "Monodia"], hint: "Busca els 3 blocs de l'EDAT MITJANA." },
                { name: "Missa Polifònica (Renaixement)", req: ["Humanisme", "Polifonia", "Equilibri"], hint: "Busca els 3 blocs del RENAIXEMENT." },
                { name: "Concert Barroc (Barroc)", req: ["Baix Continu", "Contrast", "Luxe"], hint: "Busca els 3 blocs del BARROC." },
                { name: "Simfonia (Classicisme)", req: ["Raó/Ordre", "Melodia Acomp.", "Orquestra"], hint: "Busca els 3 blocs del CLASSICISME." },
                { name: "Poema Simfònic (Romanticisme)", req: ["Sentiment", "Natura", "Virtuosisme"], hint: "Busca els 3 blocs del ROMANTICISME." },
                { name: "Música Electrònica (S.XX)", req: ["Trencament", "Tecnologia", "Dissonància"], hint: "Busca els 3 blocs del SEGLE XX." }
            ]
        };

        let score = 0;
        let currentRecipeIndex = 0; // NEW: Sequential Progress
        let currentRecipe = null;
        let placedBlocks = [null, null, null];
        let gameActive = false;
        const music = document.getElementById('bg-music');

        // Tooltip Logic
        const tooltip = document.getElementById('global-tooltip');

        function showTooltip(e, name, desc) {
            tooltip.innerHTML = `<strong>${name}</strong>${desc}`;
            tooltip.style.display = 'block';
            moveTooltip(e);
        }

        function hideTooltip() {
            tooltip.style.display = 'none';
        }

        function moveTooltip(e) {
            const x = e.clientX;
            const y = e.clientY;
            let finalX = x + 20;
            let finalY = y + 20;

            if (finalX + 300 > window.innerWidth) finalX = x - 320;
            if (finalY + 100 > window.innerHeight) finalY = y - 100;

            tooltip.style.left = finalX + 'px';
            tooltip.style.top = finalY + 'px';
        }

        function startGame() {
            document.getElementById('loading-screen').classList.add('hidden');
            document.getElementById('loading-screen').classList.add('hidden');

            // Audio Context Resume/Init on first interaction
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            music.volume = 0.5;
            music.play().catch(e => console.log("Audio prevent", e));

            gameActive = true;
            generateInventory();

            // START SEQUENTIAL
            currentRecipeIndex = 0;
            loadRound();
        }

        document.getElementById('volume-slider').addEventListener('input', (e) => music.volume = e.target.value);

        function generateInventory() {
            const container = document.getElementById('inventory');
            container.innerHTML = '';

            // Randomly shuffle the pool for game challenge
            const pool = [...GAME_DATA.ingredients_pool].sort(() => Math.random() - 0.5);

            pool.forEach(item => {
                const cw = document.createElement('div');
                cw.className = 'cube-container';
                cw.draggable = true;
                cw.dataset.id = item.name;
                cw.dataset.img = item.img;

                const imgPath = `img/${item.img}`;

                cw.innerHTML = `
                    <img src="${imgPath}" class="block-img" alt="${item.name}">
                `;

                cw.addEventListener('mouseenter', (e) => showTooltip(e, item.name, item.desc));
                cw.addEventListener('mouseleave', hideTooltip);
                cw.addEventListener('mousemove', moveTooltip);
                cw.addEventListener('dragstart', handleDragStart);
                container.appendChild(cw);
            });
        }

        function loadRound() {
            placedBlocks = [null, null, null];
            updateCraftingTable();
            document.getElementById('result-slot').textContent = '?';

            // Allow clicking again
            gameActive = true;

            // SEQUENTIAL RECIPE
            if (currentRecipeIndex >= GAME_DATA.recipes.length) {
                // If this is reached without winning, force win
                gameActive = false;
                document.getElementById('win-screen').classList.remove('hidden');
                playSound('win');
                return;
            }

            currentRecipe = GAME_DATA.recipes[currentRecipeIndex];

            document.getElementById('request-text').innerHTML = `Vull crear:<br><span style="color:blue">${currentRecipe.name}</span>`;
            document.getElementById('request-hint').textContent = currentRecipe.hint;

            const villager = document.querySelector('.villager-img');
            villager.style.transform = 'translateY(-20px) scale(1.05)';
            setTimeout(() => villager.style.transform = 'translateY(0) scale(1)', 300);

            playSound('villager');
        }

        let draggedItem = null;
        function handleDragStart(e) {
            draggedItem = {
                name: this.dataset.id,
                idForImg: this.querySelector('img').src,
            };
            hideTooltip();
        }

        const slots = document.querySelectorAll('.craft-slot');
        slots.forEach((slot, index) => {
            if (!slot.id) {
                slot.addEventListener('dragover', e => e.preventDefault());
                slot.addEventListener('drop', e => {
                    e.preventDefault();
                    if (!draggedItem) return;
                    placedBlocks[index] = draggedItem;
                    updateCraftingTable();
                    playSound('plop');
                });
                slot.addEventListener('click', () => {
                    placedBlocks[index] = null;
                    updateCraftingTable();
                });
            }
        });

        function updateCraftingTable() {
            const slotEls = document.querySelectorAll('.craft-slot');
            placedBlocks.forEach((block, i) => {
                const el = slotEls[i];
                el.innerHTML = '';
                if (block) {
                    el.innerHTML = `
                        <div class="cube-container" style="width:100%; height:100%; margin:0; cursor:default;">
                             <img src="${block.idForImg}" class="block-img">
                        </div>
                    `;
                }
            });
        }

        function attemptCraft() {
            try {
                if (!gameActive) return;

                // Ensure currentRecipe exists
                if (!currentRecipe) {
                    console.error("No recipe loaded!");
                    return;
                }

                // Check basics
                if (placedBlocks.includes(null)) {
                    document.body.classList.add('damage-effect');
                    setTimeout(() => document.body.classList.remove('damage-effect'), 500);
                    playSound('damage');
                    return;
                }

                const placedNames = placedBlocks.map(b => b.name);
                const needed = currentRecipe.req;

                console.log("Crafting try:", placedNames, "Needed:", needed);

                let success = true;
                if (placedNames.length !== needed.length) success = false;
                needed.forEach(reqName => {
                    if (!placedNames.includes(reqName)) success = false;
                });

                if (success) {
                    // Lock Game
                    gameActive = false;

                    playSound('levelup');
                    document.body.style.backgroundColor = "#fff";
                    document.getElementById('result-slot').textContent = '💎';

                    setTimeout(() => {
                        document.body.style.backgroundColor = "";
                        placedBlocks = [null, null, null];
                        updateCraftingTable();
                    }, 300);

                    currentRecipeIndex++;
                    score = currentRecipeIndex;
                    document.getElementById('current-score').textContent = score;

                    if (currentRecipeIndex >= GAME_DATA.recipes.length) {
                        setTimeout(() => {
                            document.body.style.backgroundColor = "";
                            document.getElementById('win-screen').classList.remove('hidden');
                            playSound('win');
                        }, 500);
                    } else {
                        setTimeout(() => {
                            loadRound();
                        }, 1200);
                    }
                } else {
                    document.body.classList.add('damage-effect');
                    setTimeout(() => document.body.classList.remove('damage-effect'), 500);
                    playSound('damage');

                    placedBlocks = [null, null, null];
                    updateCraftingTable();
                }
            } catch (err) {
                console.error("Error in craft:", err);
                alert("Error crafting: " + err.message);
            }
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'plop') {
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'villager') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'levelup') {
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(880, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'damage') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'win') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(1046, audioCtx.currentTime + 1);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                osc.start(); osc.stop(audioCtx.currentTime + 1);
            }
        }
    </script>
</body>

</html>
