<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L'Hort del Temps</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Indie+Flower&family=Roboto:wght@400;700&display=swap');

        :root {
            --soil-dark: #3e2723;
            --soil-light: #5d4037;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            background-color: #81d4fa;
            /* Fallback */
            background-size: cover;
            background-position: center;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none;
            transition: background-image 1s;
        }

        h1 {
            font-family: 'Indie Flower', cursive;
            font-size: 3.5rem;
            color: #2e7d32;
            text-shadow: 2px 2px 0px white;
            margin-bottom: 20px;
        }

        /* SCREENS */
        #game-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            text-align: center;
        }

        .era-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 30px;
        }


        .btn-era.completed {
            background-color: #c8e6c9 !important;
            /* Green tint */
            border-color: #2ecc71 !important;
            color: #1b5e20 !important;
            position: relative;
        }

        .btn-era.completed::after {
            content: '✓';
            position: absolute;
            top: 5px;
            right: 10px;
            font-size: 1.2rem;
            color: #2ecc71;
            font-weight: bold;
        }

        #volume-controls {
            margin-top: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px 20px;
            border-radius: 20px;
            border: 2px solid #2e7d32;
        }

        .btn-era {
            background: #fff;
            border: 3px solid #2e7d32;
            color: #2e7d32;
            padding: 15px 30px;
            font-size: 1.4rem;
            font-family: 'Indie Flower', cursive;
            cursor: pointer;
            border-radius: 15px;
            transition: transform 0.1s, background 0.2s;
            box-shadow: 0 5px 0 #1b5e20;
        }

        .btn-era:hover {
            transform: scale(1.05);
            background: #e8f5e9;
        }

        .btn-era:active {
            transform: translateY(5px);
            box-shadow: none;
        }

        /* GAME */
        #garden {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding-bottom: 20px;
            position: relative;
        }

        /* INVENTORY */
        #inventory {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 20px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 3px solid #2e7d32;
            max-width: 300px;
        }

        .seed-packet {
            width: 90px;
            height: 120px;
            background-image: url('img/semilla.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            cursor: grab;
            padding-bottom: 25px;
            font-family: 'Indie Flower', cursive;
            font-weight: bold;
            font-size: 1rem;
            color: #3e2723;
            text-align: center;
            /* Enhance text readability */
            text-shadow: 0 0 3px white;
            transition: transform 0.2s;
        }

        .seed-packet:hover {
            transform: scale(1.1) rotate(-5deg);
        }

        .seed-packet:active {
            cursor: grabbing;
        }

        /* GROUND & PLANTS */
        #ground {
            /* Ground is now implied by the hole images placed at the bottom */
            height: 250px;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            /* Align bottom */
            padding: 0 50px;
        }

        .pot-container {
            width: 180px;
            height: 250px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
        }

        .hole {
            width: 160px;
            height: 80px;
            background-image: url('img/forat.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center bottom;
            position: absolute;
            bottom: 0;
            z-index: 5;
            transition: opacity 0.5s;
        }

        .plant {
            width: 250px;
            /* Large plants */
            height: 250px;
            position: absolute;
            bottom: 30px;
            /* Slight offset so it grows FROM the hole */
            background-size: contain;
            background-repeat: no-repeat;
            background-position: bottom center;
            transform-origin: bottom center;
            transform: scale(0);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }

        .plant.grown {
            transform: scale(1);
        }


        /* Floating Tooltip/Text for plant */
        .plant-label {
            position: absolute;
            top: -65px;
            /* Higher to fit description */
            background: rgba(255, 255, 255, 0.95);
            padding: 8px 12px;
            border-radius: 10px;
            border: 2px solid #2e7d32;
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s 0.5s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            pointer-events: none;
            z-index: 20;
            min-width: 140px;
            transform: translateY(10px);
        }

        .plant.grown+.plant-label {
            opacity: 1;
            transform: translateY(0);
        }

        .label-title {
            font-family: 'Indie Flower', cursive;
            font-weight: bold;
            font-size: 1.1rem;
            color: #2e7d32;
            display: block;
            margin-bottom: 2px;
        }

        .label-desc {
            font-family: 'Roboto', sans-serif;
            font-size: 0.8rem;
            color: #555;
            display: block;
            line-height: 1.1;
        }

        /* FEEDBACK */
        #feedback-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
            color: white;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        /* PARTICLES */
        .particle {
            position: absolute;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            font-size: 1.5rem;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }

            100% {
                transform: translateY(-100px) scale(1.5);
                opacity: 0;
            }
        }
    </style>

    <!-- INICIO_AUTO_ZOOM_ANTIGRAVITY -->
    <script>
        function autoEscalar() {
            const anchoDiseno = 1920; 
            const escala = window.innerWidth / anchoDiseno;
            if (escala < 1) {
                document.body.style.zoom = escala;
            } else {
                document.body.style.zoom = 1;
            }
        }
        window.addEventListener('resize', autoEscalar);
        window.addEventListener('DOMContentLoaded', autoEscalar);
    </script>
    <!-- FIN_AUTO_ZOOM_ANTIGRAVITY -->

</head>

<body>

    <audio id="bg-music" loop>
        <source src="audio/Garden Siege Groove.m4a" type="audio/mpeg">
    </audio>
    <audio id="sfx-grow"></audio>
    <audio id="sfx-die"></audio>

    <div id="game-container">
        <!-- Start Screen -->
        <div id="start-screen">
            <h1>L'HORT DEL TEMPS</h1>
            <p style="font-size: 1.5rem; max-width: 600px; margin-bottom: 20px; color: #333;">
                Descobreix la Flora Musical de la història! Planta les llavors correctes a cada època per veure-les
                florir.
            </p>

            <div id="volume-controls">
                <span style="font-size: 1.5rem;">🔊</span>
                <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.5">
            </div>

            <div class="era-grid">
                <button class="btn-era" data-era="edat_mitjana">Edat Mitjana</button>
                <button class="btn-era" data-era="renaixement">Renaixement</button>
                <button class="btn-era" data-era="barroc">Barroc</button>
                <button class="btn-era" data-era="classicisme">Classicisme</button>
                <button class="btn-era" data-era="romanticisme">Romanticisme</button>
                <button class="btn-era" data-era="segle_xx">Segle XX</button>
            </div>
        </div>

        <!-- Game Garden -->
        <div id="garden" class="hidden">
            <div id="inventory">
                <!-- Seeds injected here -->
            </div>

            <div id="ground">
                <div class="pot-container">
                    <div class="hole" data-id="1"></div>
                </div>
                <div class="pot-container">
                    <div class="hole" data-id="2"></div>
                </div>
                <div class="pot-container">
                    <div class="hole" data-id="3"></div>
                </div>
                <div class="pot-container">
                    <div class="hole" data-id="4"></div>
                </div>
            </div>

            <button class="btn-era" style="position: absolute; top: 20px; left: 20px;"
                onclick="document.getElementById('garden').classList.add('hidden'); document.getElementById('start-screen').style.display='flex';">🔙
                Menú</button>
        </div>

        <!-- Feedback Overlay -->
        <div id="feedback-overlay">
            <h2 id="end-title" style="font-size: 3rem; margin-bottom: 10px;"></h2>
            <p id="end-msg" style="font-size: 1.5rem; margin-bottom: 30px;"></p>
            <button class="btn-era" onclick="resetGame()">TORNA-HO A PROVAR</button>
        </div>
    </div>

    <script>
        // --- ASSET MAPPING ---
        const BACKGROUNDS = {
            edat_mitjana: 'img/fonsmitjana.jpg',
            renaixement: 'img/fonsreniaxement.jpg', // Fixed Typo
            barroc: 'img/fonsbarroc.jpg',
            classicisme: 'img/fonsclassic.jpg',
            romanticisme: 'img/fonsromanticisme.jpg',
            segle_xx: 'img/fonssegleXX.jpg'
        };

        const PLANT_IMAGES = {
            "Cant Gregorià": "img/cantgregoria.png",
            "Monodia": "img/monodia.png",
            "Neumes": "img/neumes.png",
            "Trobador": "img/trobador.png",

            "Polifonia": "img/polifonia.png",
            "Madrigal": "img/madrigal.png",
            "Llaüt": "img/llaut.png",
            "Humanisme": "img/humanisme.png",

            "Baix Continu": "img/baixcontinu.png",
            "Clavicèmbal": "img/clave.png",
            "Fuga": "img/fuga.png",
            "Ornament": "img/ornament.png",

            "Simfonia": "img/simfonia.png",
            "Sonata": "img/sonata.png",
            "Equilibri": "img/equilibri.png",
            "Clarinet": "img/clarinet.png",

            "Passió": "img/passio.png",
            "Lied": "img/lied.png",
            "Piano": "img/clave.png",
            "Poema Simfònic": "img/poemasimfonic.png",

            "Atonalitat": "img/atonalitat.png",
            "Dodecafonisme": "img/dodecafonisme.png",
            "Soroll": "img/soroll.png",
            "Electrònica": "img/eelctronica.png"
        };

        const DEFINITIONS = {
            "Cant Gregorià": "Cant monòdic religiós en llatí.",
            "Monodia": "Música d'una única línia melòdica.",
            "Neumes": "Primers signes d'escriptura musical.",
            "Trobador": "Poeta músic de l'amor cortès.",
            "Polifonia": "Diverses veus sonant alhora.",
            "Madrigal": "Cançó profana molt expressiva.",
            "Llaüt": "Instrument de corda molt popular.",
            "Humanisme": "L'home com a centre de tot.",
            "Baix Continu": "Base harmònica constant i ferma.",
            "Clavicèmbal": "Teclat de corda pinçada (agut).",
            "Fuga": "Melodia que es persegueix a ella mateixa.",
            "Ornament": "Notes de decoració ràpides.",
            "Simfonia": "Gran obra per a tota l'orquestra.",
            "Sonata": "Obra estructurada per a 1 instrument.",
            "Equilibri": "Bellesa a través de la proporció.",
            "Clarinet": "Nou instrument de vent de l'època.",
            "Passió": "Sentiment intens i desbordant.",
            "Lied": "Poesia cantada amb piano.",
            "Piano": "L'instrument rei, ple de matisos.",
            "Poema Simfònic": "Música que explica una història.",
            "Atonalitat": "Música sense una nota clau.",
            "Dodecafonisme": "Sistema matemàtic de 12 notes.",
            "Soroll": "El so brut com a art.",
            "Electrònica": "Música feta amb màquines."
        };

        const DB = {
            edat_mitjana: ["Cant Gregorià", "Monodia", "Neumes", "Trobador"],
            renaixement: ["Polifonia", "Madrigal", "Llaüt", "Humanisme"],
            barroc: ["Baix Continu", "Clavicèmbal", "Fuga", "Ornament"],
            classicisme: ["Simfonia", "Sonata", "Equilibri", "Clarinet"],
            romanticisme: ["Passió", "Lied", "Piano", "Poema Simfònic"],
            segle_xx: ["Atonalitat", "Dodecafonisme", "Soroll", "Electrònica"]
        };

        // --- GAME STATE ---
        let currentEra = null;
        let plantsGrown = 0;
        let plantsTried = 0;

        // --- AUDIO ENGINE ---
        const bgMusic = document.getElementById('bg-music');
        const volumeSlider = document.getElementById('volume-slider');
        bgMusic.volume = 0.5;

        volumeSlider.addEventListener('input', (e) => {
            bgMusic.volume = e.target.value;
            if (bgMusic.paused) bgMusic.play().catch(() => { });
        });

        // Initialize Completed Eras
        window.addEventListener('load', () => {
            document.querySelectorAll('.btn-era').forEach(btn => {
                const era = btn.dataset.era;
                if (localStorage.getItem('hort_completed_' + era) === 'true') {
                    btn.classList.add('completed');
                }
            });
        });

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'grow') {
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.3);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.4);
            } else if (type === 'die') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(50, now + 0.3);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.4);
            }
            osc.start(now);
            osc.stop(now + 0.5);
        }

        function resetGame() {
            document.getElementById('feedback-overlay').style.display = 'none';
            startGame();
        }

        // --- LOGIC ---
        document.querySelectorAll('.btn-era').forEach(btn => {
            if (btn.dataset.era) {
                btn.addEventListener('click', () => {
                    if (bgMusic.paused) bgMusic.play().catch(e => console.log("Audio requires interaction"));

                    currentEra = btn.dataset.era;
                    document.body.style.backgroundImage = `url('${BACKGROUNDS[currentEra]}')`;
                    startGame();
                });
            }
        });

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('garden').classList.remove('hidden');

            plantsGrown = 0;
            plantsTried = 0;

            const seeds = [];

            // Correct
            DB[currentEra].forEach(item => {
                seeds.push({ text: item, correct: true, era: currentEra });
            });

            // Incorrect
            const otherEras = Object.keys(DB).filter(e => e !== currentEra);
            for (let i = 0; i < 4; i++) {
                const randomEra = otherEras[Math.floor(Math.random() * otherEras.length)];
                const item = DB[randomEra][Math.floor(Math.random() * DB[randomEra].length)];
                seeds.push({ text: item, correct: false, era: randomEra });
            }

            seeds.sort(() => Math.random() - 0.5);

            const inv = document.getElementById('inventory');
            inv.innerHTML = '';

            seeds.forEach(seed => {
                const el = document.createElement('div');
                el.className = 'seed-packet';
                el.draggable = true;
                el.innerText = seed.text;

                el.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', JSON.stringify(seed));
                    el.classList.add('dragging');
                    setTimeout(() => el.style.opacity = '0.5', 0);
                });

                el.addEventListener('dragend', () => {
                    el.classList.remove('dragging');
                    el.style.opacity = '1';
                });

                // Click fallback for touch/mobile
                el.addEventListener('click', () => {
                    // Ideally handle touch, but simplified here
                });

                inv.appendChild(el);
            });

            // Reset Holes
            document.querySelectorAll('.pot-container').forEach(pot => {
                const oldPlant = pot.querySelector('.plant');
                if (oldPlant) oldPlant.remove();
                const oldLabel = pot.querySelector('.plant-label');
                if (oldLabel) oldLabel.remove();

                const hole = pot.querySelector('.hole');
                hole.style.opacity = '1';

                const newHole = hole.cloneNode(true);
                hole.parentNode.replaceChild(newHole, hole);

                newHole.addEventListener('dragover', e => e.preventDefault());
                newHole.addEventListener('drop', handleDrop);
            });
        }

        function handleDrop(e) {
            e.preventDefault();
            const hole = e.currentTarget;
            if (hole.style.opacity === '0') return;

            const data = JSON.parse(e.dataTransfer.getData('text/plain'));
            const pot = hole.parentElement;

            const dragging = document.querySelector('.dragging');
            if (dragging) dragging.remove();

            const plant = document.createElement('div');
            plant.className = 'plant';
            plant.style.backgroundImage = `url('${PLANT_IMAGES[data.text]}')`;

            // Create Label with Description
            const label = document.createElement('div');
            label.className = 'plant-label';

            // Safe definition check
            const desc = DEFINITIONS[data.text] || "Una planta molt curiosa";
            label.innerHTML = `<span class="label-title">${data.text}</span><span class="label-desc">${desc}</span>`;

            pot.appendChild(plant);
            pot.appendChild(label);

            hole.style.opacity = '0';

            void plant.offsetWidth;

            if (data.correct) {
                plant.classList.add('grown');
                playSound('grow');
                plantsGrown++;
                spawnParticles(e.clientX, e.clientY, '✨');
            } else {
                plant.style.filter = "grayscale(1) brightness(0.5)";
                plant.style.transform = "scale(0.5) rotate(90deg)";
                setTimeout(() => plant.classList.add('grown'), 50);
                playSound('die');
                spawnParticles(e.clientX, e.clientY, '💨');
            }

            plantsTried++;
            checkGameOver();
        }

        function spawnParticles(x, y, char) {
            for (let i = 0; i < 5; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.innerText = char;
                p.style.left = (x - 20 + Math.random() * 40) + 'px';
                p.style.top = (y - 20 + Math.random() * 40) + 'px';
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 1000);
            }
        }

        function checkGameOver() {
            if (plantsTried === 4) {
                setTimeout(() => {
                    const overlay = document.getElementById('feedback-overlay');
                    const title = document.getElementById('end-title');
                    const msg = document.getElementById('end-msg');
                    const btn = overlay.querySelector('button');

                    overlay.style.display = 'flex';

                    if (plantsGrown === 4) {
                        title.textContent = "JARDÍ PERFECTE! 🌸";
                        title.style.color = "#4caf50";
                        msg.textContent = "Has dominat la flora d'aquesta època.";
                        localStorage.setItem('hort_completed_' + currentEra, 'true');
                        // On win, button goes to menu (or restart same level if they want to admire it)
                        // But usually win -> menu to pick next era
                        btn.innerText = "TORNAR AL MENÚ";
                        btn.onclick = () => location.reload();
                    } else {
                        title.textContent = "JARDÍ DESASTRÓS... 🥀";
                        title.style.color = "#e57373";
                        msg.textContent = `Només han florit ${plantsGrown} de 4 plantes.`;
                        // On lose, fast restart
                        btn.innerText = "TORNA-HO A PROVAR";
                        btn.onclick = resetGame;
                    }
                }, 1500);
            }
        }
    </script>
</body>

</html>
