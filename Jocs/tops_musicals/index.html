<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Els Tops Musicals</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Roboto:wght@400;700&display=swap');

        :root {
            --grass-light: #81c784;
            --grass-dark: #388e3c;
            --dirt: #5d4037;
            --hole-bg: #3e2723;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            background-color: #e8f5e9;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="15" fill="none" stroke="red" stroke-width="3"/><line x1="20" y1="5" x2="20" y2="35" stroke="red" stroke-width="2"/><line x1="5" y1="20" x2="35" y2="20" stroke="red" stroke-width="2"/></svg>') 20 20, auto;
        }

        #game-container {
            width: 100%;
            height: 100%;
            max-width: 800px;
            position: relative;
            background: radial-gradient(circle, var(--grass-light), var(--grass-dark));
            border: 8px solid #2e7d32;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Start Screen */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            text-align: center;
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 3.5rem;
            color: #2e7d32;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0 #fff;
        }

        .era-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .btn-era {
            background: #fff;
            border: 3px solid #2e7d32;
            color: #2e7d32;
            padding: 15px 20px;
            font-size: 1.2rem;
            font-family: 'Fredoka One', cursive;
            cursor: pointer;
            border-radius: 15px;
            transition: transform 0.1s;
        }

        .btn-era:hover {
            transform: scale(1.05);
            background: #c8e6c9;
        }

        /* Game Interface */
        #game-board {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 20px;
            padding: 20px;
            margin-top: 60px;
            /* Space for HUD */
        }

        .hole {
            background: var(--hole-bg);
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 10px 10px rgba(0, 0, 0, 0.5);
        }

        .mole {
            width: 95%;
            height: 95%;
            position: absolute;
            bottom: -100%;
            /* Hidden */
            left: 2.5%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            transition: bottom 0.2s;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            cursor: pointer;
        }

        .mole.up {
            bottom: 5%;
        }

        .mole-label {
            background: rgba(255, 255, 255, 0.9);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: bold;
            margin-top: 5px;
            text-align: center;
            pointer-events: none;
            z-index: 2;
            border: 2px solid var(--grass-dark);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .mole-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            position: absolute;
            bottom: 0;
            z-index: 1;
        }

        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: space-around;
            align-items: center;
            color: white;
            font-family: 'Fredoka One', cursive;
            font-size: 1.5rem;
            z-index: 10;
        }

        /* Feedback Overlay */
        #feedback-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
            display: none;
            color: white;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        /* Hammer Animation */
        .hammer-hit {
            transform: rotate(-45deg);
            transition: transform 0.1s;
        }
    </style>
</head>

<body>

    <div id="game-container">
        <!-- Start Screen -->
        <div id="start-screen">
            <h1>ELS TOPS MUSICALS</h1>
            <p>Colpeja només els compositors de la teva època!</p>
            <div class="era-grid">
                <button class="btn-era" data-era="edat_mitjana">Edat Mitjana</button>
                <button class="btn-era" data-era="renaixement">Renaixement</button>
                <button class="btn-era" data-era="barroc">Barroc</button>
                <button class="btn-era" data-era="classicisme">Classicisme</button>
                <button class="btn-era" data-era="romanticisme">Romanticisme</button>
                <button class="btn-era" data-era="segle_xx">Segle XX</button>
            </div>
        </div>

        <!-- Game Board -->
        <div id="game-board" class="hidden">
            <div class="hole" id="hole-0">
                <div class="mole"></div>
            </div>
            <div class="hole" id="hole-1">
                <div class="mole"></div>
            </div>
            <div class="hole" id="hole-2">
                <div class="mole"></div>
            </div>
            <div class="hole" id="hole-3">
                <div class="mole"></div>
            </div>
            <div class="hole" id="hole-4">
                <div class="mole"></div>
            </div>
            <div class="hole" id="hole-5">
                <div class="mole"></div>
            </div>
            <div class="hole" id="hole-6">
                <div class="mole"></div>
            </div>
            <div class="hole" id="hole-7">
                <div class="mole"></div>
            </div>
            <div class="hole" id="hole-8">
                <div class="mole"></div>
            </div>
        </div>

        <div id="hud" class="hidden">
            <span>NIVELL: <span id="level">1</span>/5</span>
            <span>PUNTS: <span id="score">0</span>/<span id="target">8</span></span>
            <span>VIDES: <span id="lives">3</span></span>
        </div>

        <!-- Feedback Overlay -->
        <div id="feedback-overlay">
            <h2 id="end-title"></h2>
            <p id="end-msg"></p>
            <button class="btn-era" onclick="location.reload()">TORNAR A JUGAR</button>
        </div>
    </div>

    <script>
        // --- DATA ---
        const DB = {
            edat_mitjana: ["Leonín", "Perotín", "Hildegard", "Cant Gregorià", "Trobadors", "Neumes", "Monodia"],
            renaixement: ["Palestrina", "Josquin", "Victoria", "Polifonia", "Madrigal", "Humanisme", "Impremta"],
            barroc: ["Bach", "Vivaldi", "Händel", "Baix Continu", "Òpera", "Ornamentació", "Contrast"],
            classicisme: ["Mozart", "Haydn", "Beethoven", "Simfonia", "Sonata", "Ordre", "Piano"],
            romanticisme: ["Chopin", "Wagner", "Verdi", "Passió", "Lied", "Virtuosisme", "Orquestra"],
            segle_xx: ["Stravinsky", "Debussy", "Schoenberg", "Jazz", "Atonalitat", "Electrònica", "Avantguarda"]
        };

        const ICONS = {
            edat_mitjana: "🏰",
            renaixement: "⚜️",
            barroc: "🎻",
            classicisme: "🏛️",
            romanticisme: "🌹",
            segle_xx: "🚀"
        };
        const TOPO_IMAGES = ["topo1.png", "topo2.png", "topo3.png", "topo4.png", "topo5.png"];

        // --- GAME STATE ---
        let currentEra = null;
        let level = 1;
        let score = 0;
        let targetScore = 8;
        let lives = 3;
        let gameActive = false;
        let moleInterval;
        let moleSpeed = 1500;
        let activeMoles = [];

        // --- AUDIO ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'hit') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(0.01, now + 0.1);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'miss') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, now);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'pop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.linearRampToValueAtTime(600, now + 0.1);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            }
        }

        // --- LOGIC ---
        document.querySelectorAll('.btn-era').forEach(btn => {
            if (btn.parentElement.id === 'feedback-overlay') return;
            btn.addEventListener('click', () => {
                currentEra = btn.dataset.era;
                startGame();
            });
        });

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-board').classList.remove('hidden');
            document.getElementById('hud').classList.remove('hidden');

            level = 1;
            lives = 3;
            startLevel();
        }

        function startLevel() {
            score = 0;
            targetScore = 8;
            // Slower progression: Level 1: 1500, Level 2: 1300, Level 3: 1100, Level 4: 950, Level 5: 800
            const speeds = [1500, 1300, 1100, 950, 800];
            moleSpeed = speeds[level - 1] || 800;

            document.getElementById('level').textContent = level;
            document.getElementById('score').textContent = score;
            document.getElementById('target').textContent = targetScore;
            document.getElementById('lives').textContent = lives;

            gameActive = true;
            clearInterval(moleInterval);
            moleInterval = setInterval(spawnMole, moleSpeed);
        }

        function spawnMole() {
            if (!gameActive) return;

            // Clear random hole if full? No, just pick empty one
            const holes = document.querySelectorAll('.hole');
            const emptyHoles = Array.from(holes).filter(h => !h.querySelector('.mole').classList.contains('up'));

            if (emptyHoles.length === 0) return;

            const hole = emptyHoles[Math.floor(Math.random() * emptyHoles.length)];
            const mole = hole.querySelector('.mole');

            // Determine content
            const isCorrect = Math.random() > 0.4;
            let text, icon;

            if (isCorrect) {
                const pool = DB[currentEra];
                // 60% chance for famous composers (first 3), 40% for concepts
                if (Math.random() < 0.6) {
                    text = pool[Math.floor(Math.random() * 3)];
                } else {
                    text = pool[3 + Math.floor(Math.random() * (pool.length - 3))];
                }
                if (!text) text = pool[0]; // Fallback
                icon = ICONS[currentEra];
            } else {
                const otherEras = Object.keys(DB).filter(e => e !== currentEra);
                const randomEra = otherEras[Math.floor(Math.random() * otherEras.length)];
                const pool = DB[randomEra];
                text = pool[Math.floor(Math.random() * pool.length)];
                icon = ICONS[randomEra];
            }

            const randomTopo = TOPO_IMAGES[Math.floor(Math.random() * TOPO_IMAGES.length)];
            mole.innerHTML = `<img src="./img/${randomTopo}" class="mole-img"><div class="mole-label">${text}</div>`;
            mole.dataset.correct = isCorrect;

            mole.classList.add('up');
            playSound('pop');

            // Auto hide
            setTimeout(() => {
                if (mole.classList.contains('up')) {
                    mole.classList.remove('up');
                }
            }, moleSpeed * 0.8);
        }

        document.querySelectorAll('.mole').forEach(mole => {
            mole.addEventListener('mousedown', () => {
                if (!mole.classList.contains('up') || !gameActive) return;

                mole.classList.remove('up');
                const isCorrect = mole.dataset.correct === "true";

                if (isCorrect) {
                    score++;
                    playSound('hit');
                    document.getElementById('score').textContent = score;
                    if (score >= targetScore) {
                        nextLevel();
                    }
                } else {
                    lives--;
                    playSound('miss');
                    document.getElementById('lives').textContent = lives;
                    if (lives <= 0) endGame(false);
                }
            });
        });

        function nextLevel() {
            gameActive = false;
            clearInterval(moleInterval);

            if (level >= 5) {
                endGame(true);
            } else {
                level++;
                // Flash level up?
                setTimeout(startLevel, 1000);
            }
        }

        function endGame(win) {
            gameActive = false;
            clearInterval(moleInterval);

            const overlay = document.getElementById('feedback-overlay');
            const title = document.getElementById('end-title');
            const msg = document.getElementById('end-msg');

            overlay.style.display = 'flex';

            if (win) {
                title.textContent = "TOP MUNDIAL!";
                title.style.color = "#81c784";
                msg.textContent = "Has esclafat tots els intrusos.";
            } else {
                title.textContent = "GAME OVER";
                title.style.color = "red";
                msg.textContent = "T'han envaït els compositors equivocats.";
            }
        }

    </script>
</body>

</html>
