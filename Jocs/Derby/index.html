<html lang="ca">

<head>
    <meta charset="UTF-8">

    <title>El Gran Derby Històric: Camells</title>
    <style>
        :root {
            --sand-light: #e6cca5;
            --sand-dark: #c2a67a;
            --wood-mahogany: #4a3728;
            --gold: #ffd700;
            --text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        body {
            margin: 0;
            background-color: #111;
            font-family: 'Verdana', serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            user-select: none;
        }

        #game-cabinet {
            width: 95vw;
            height: 90vh;
            /* Desert Theme Background */
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F7FA 40%, var(--sand-light) 40%, var(--sand-dark) 100%);
            border: 25px solid var(--wood-mahogany);
            border-radius: 20px;
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }

        /* WOOD OVERLAY */
        #game-cabinet::after {
            content: "";
            position: absolute;
            top: -25px;
            left: -25px;
            right: -25px;
            bottom: -25px;
            border: 25px solid rgba(0, 0, 0, 0.1);
            border-radius: 20px;
            pointer-events: none;
            z-index: 100;
        }

        /* --- HEADER --- */
        header {
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 4px solid var(--gold);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 10px;
        }

        h1 {
            font-size: 2rem;
            margin: 0;
            color: var(--gold);
            text-shadow: var(--text-shadow);
            text-transform: uppercase;
        }

        .level-info {
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 20px;
            border-radius: 10px;
            border: 1px solid var(--gold);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .level-info:hover {
            background: rgba(255, 215, 0, 0.2);
        }

        /* --- RACETRACK --- */
        #racetrack {
            flex: 1;
            /* Desert Sand Track */
            background: repeating-linear-gradient(90deg,
                    var(--sand-dark),
                    var(--sand-dark) 100px,
                    #a88e63 100px,
                    #a88e63 200px);
            border: 8px solid var(--wood-mahogany);
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            padding: 20px 0;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .lane {
            height: 100px;
            border-bottom: 2px dashed rgba(255, 255, 255, 0.3);
            position: relative;
            display: flex;
            align-items: center;
        }

        .lane:last-child {
            border-bottom: none;
        }

        .camel {
            width: 100px;
            height: 80px;
            position: absolute;
            right: 10px;
            /* Start from Right, consistent with Derby logic */
            font-size: 4rem;
            display: flex;
            justify-content: center;
            align-items: center;
            filter: drop-shadow(5px 5px 5px rgba(0, 0, 0, 0.5));
            transition: right 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            z-index: 10;
        }

        .camel-label {
            position: absolute;
            top: -25px;
            font-size: 1rem;
            background: rgba(0, 0, 0, 0.8);
            padding: 2px 8px;
            border-radius: 4px;
            color: white;
            white-space: nowrap;
        }

        #finish-line {
            position: absolute;
            left: 50px;
            /* Finish line on Left */
            top: 0;
            bottom: 0;
            width: 20px;
            background: repeating-linear-gradient(0deg, #fff, #fff 10px, #000 10px, #000 20px);
            z-index: 5;
            box-shadow: 0 0 10px black;
        }

        /* --- CONTROL PANEL --- */
        #control-panel {
            background: var(--wood-mahogany);
            border-top: 5px solid var(--gold);
            padding: 20px;
            border-radius: 0 0 15px 15px;
            height: 250px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        #question-display {
            background: #000;
            color: var(--gold);
            font-size: 1.3rem;
            padding: 15px;
            border: 2px solid #555;
            border-radius: 10px;
            width: 80%;
            text-align: center;
            box-shadow: 0 0 15px var(--gold);
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #answers-container {
            display: flex;
            gap: 20px;
            width: 100%;
            justify-content: center;
        }

        .ans-btn {
            background: #f0f0f0;
            color: #000;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 15px;
            border: 5px solid #ccc;
            border-radius: 10px;
            width: 25%;
            cursor: pointer;
            box-shadow: 0 5px 0 #999;
            transition: 0.1s;
        }

        .ans-btn:active {
            transform: translateY(5px);
            box-shadow: none;
        }

        .ans-btn:hover {
            background: #fff;
        }

        .correct {
            background: #4caf50 !important;
            border-color: #2e7d32 !important;
            color: white;
        }

        .wrong {
            background: #f44336 !important;
            border-color: #c62828 !important;
            color: white;
            animation: shake 0.3s;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }
        }

        /* --- MODALS --- */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-box {
            background: #222;
            border: 4px double var(--gold);
            padding: 40px;
            text-align: center;
            border-radius: 20px;
            max-width: 800px;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .btn-modal {
            background: var(--gold);
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            border-radius: 5px;
            color: #111;
        }

        .btn-modal:hover {
            background: #fff;
        }

        #level-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 30px;
            width: 100%;
        }

        .level-btn {
            background: #333;
            border: 2px solid var(--gold);
            color: var(--gold);
            padding: 20px;
            cursor: pointer;
            border-radius: 10px;
            font-size: 1.2rem;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .level-btn:hover {
            background: #444;
            transform: scale(1.05);
        }

        .level-btn.completed {
            background: #2d5a27;
            color: white;
            border-color: #4caf50;
            box-shadow: 0 0 15px #2d5a27;
        }

        .level-btn.completed::after {
            content: "🏆";
            margin-top: 10px;
            font-size: 1.5rem;
        }
    </style>

    <!-- INICIO_AUTO_ZOOM_ANTIGRAVITY -->
    <script>
        function autoEscalar() {
            const anchoDiseno = 1920; 
            const escala = window.innerWidth / anchoDiseno;
            if (escala < 1) {
                document.body.style.zoom = escala;
            } else {
                document.body.style.zoom = 1;
            }
        }
        window.addEventListener('resize', autoEscalar);
        window.addEventListener('DOMContentLoaded', autoEscalar);
    </script>
    <!-- FIN_AUTO_ZOOM_ANTIGRAVITY -->

</head>

            </p>

        </div>

                <button class="btn-modal" onclick="game.replayLevel()"
                    style="background:#555; color:#fff;">REPETIR</button>
            </div>
        </div>
    </div>

                    { q: "Minimalisme?", options: ["Repetició i canvi lent", "Molt ràpid", "Caos"], correct: 0 },
                    { q: "Neoclassicisme?", options: ["Retorn a formes antigues", "Futurisme", "Sorollisme"], correct: 0 },
                    { q: "Jazz origen?", options: ["EUA (Nova Orleans)", "Europa", "Àfrica"], correct: 0 },
                    { q: "Element clau del Jazz?", options: ["Improvisació", "Partitura estricta", "Silenci"], correct: 0 },
                    { q: "Ritme del Jazz?", options: ["Swing", "Marxa", "Vals"], correct: 0 },
                    { q: "Rock and Roll (anys)?", options: ["50s", "20s", "90s"], correct: 0 },
                    { q: "Rei del Rock?", options: ["Elvis Presley", "Beatles", "Queen"], correct: 0 },
                    { q: "Grup més famós 60s?", options: ["The Beatles", "Nirvana", "ABBA"], correct: 0 },
                    { q: "Instrument electrònic?", options: ["Sintetitzador", "Violí", "Flauta"], correct: 0 },
                    { q: "Banda Sonora Original?", options: ["Música de pel·lícula", "Música de concert", "Música de ball"], correct: 0 }
                ]
            }
        ];

        // --- GAME ENGINE PORTED FROM DERBY.HTML ---
        class Game {
            constructor() {
                this.wins = 0;
                this.isPlaying = false;
                this.audioCtx = null;
                this.currentLevel = 0;
                this.currentPool = [];
                this.playerPos = 10; // Distance from RIGHT (starts at 10px)
                this.housePos = 10;
                this.finishLine = 0;
                this.houseSpeed = 0.5;
                this.houseInterval = null;
                this.completedLevels = [false, false, false, false, false, false];
            }

            // Called when level button is clicked
            initLevel(levelIdx) {
                this.currentLevel = levelIdx;
                document.getElementById('modal-start').style.display = 'none';
                this.initAudio();
                this.resetRace();
            }

            initAudio() {
                if (!this.audioCtx) {
                    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playTone(freq, type, duration) {
                if (!this.audioCtx) return;
                const osc = this.audioCtx.createOscillator();
                const gain = this.audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, this.audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.audioCtx.destination);
                osc.start();
                osc.stop(this.audioCtx.currentTime + duration);
            }

            playFanfare() {
                [523, 659, 783, 1046].forEach((f, i) => {
                    setTimeout(() => this.playTone(f, 'square', 0.3), i * 150);
                });
            }

            playGallop() {
                if (!this.audioCtx) return;
                const bufferSize = this.audioCtx.sampleRate * 0.1;
                const buffer = this.audioCtx.createBuffer(1, bufferSize, this.audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

                const noise = this.audioCtx.createBufferSource();
                noise.buffer = buffer;
                const gain = this.audioCtx.createGain();
                gain.gain.value = 0.1;
                noise.connect(gain);
                gain.connect(this.audioCtx.destination);
                noise.start();
            }

            resetRace() {
                document.getElementById('modal-result').style.display = 'none';
                this.isPlaying = true;
                this.playerPos = 10;
                this.housePos = 10;
                this.updatePositions();

                // Calculate finish line based on track width
                const trackWidth = document.getElementById('racetrack').offsetWidth;
                // Finish line is left:50px. So distance is Width - 50 - CamelWidth(100) approx.
                // Let's ensure they cross it.
                // The Camel is 'right: X px'. It moves Left. 
                // It crosses finish line when right > (Width - FinishLineLeft).
                this.finishLine = trackWidth - 80;

                this.playFanfare();

                // Init Question Pool
                let p = [...DERBY_DATA[this.currentLevel].pool];
                p.sort(() => Math.random() - 0.5);
                this.currentPool = p;

                this.nextQuestion();
                this.startHouseAI();
            }

            updatePositions() {
                document.getElementById('camel-player').style.right = this.playerPos + 'px';
                document.getElementById('camel-house').style.right = this.housePos + 'px';
            }

            startHouseAI() {
                if (this.houseInterval) clearInterval(this.houseInterval);

                // Difficulty increases with level index
                // Level 0: Slow. Level 5: Fast.
                const baseSpeed = 0.3 + (this.currentLevel * 0.15);
                const mistakeChance = Math.max(0.05, 0.2 - (this.currentLevel * 0.03));

                this.houseInterval = setInterval(() => {
                    if (!this.isPlaying) return;

                    // AI Mistake Logic
                    if (Math.random() < mistakeChance) {
                        return; // Stumble
                    }

                    // Move
                    const speed = baseSpeed + (Math.random() * 0.5);
                    this.housePos += speed;
                    this.updatePositions();

                    if (this.housePos >= this.finishLine) {
                        this.endRace('house');
                    }
                }, 50);
            }

            nextQuestion() {
                if (!this.isPlaying) return;

                if (this.currentPool.length === 0) {
                    let p = [...DERBY_DATA[this.currentLevel].pool];
                    p.sort(() => Math.random() - 0.5);
                    this.currentPool = p;
                }

                const q = this.currentPool.pop();
                document.getElementById('question-display').innerText = q.q;

                const container = document.getElementById('answers-container');
                container.innerHTML = '';

                let opts = q.options.map((t, i) => ({ txt: t, isC: i === q.correct }));
                opts.sort(() => Math.random() - 0.5);

                opts.forEach(o => {
                    const btn = document.createElement('button');
                    btn.className = 'ans-btn';
                    btn.innerText = o.txt;
                    btn.onclick = () => this.checkAnswer(o.isC, btn);
                    container.appendChild(btn);
                });
            }

            checkAnswer(isCorrect, btnElement) {
                if (!this.isPlaying) return;

                // Disable all buttons temporarily
                const all = document.querySelectorAll('.ans-btn');
                all.forEach(x => x.disabled = true);

                if (this.audioCtx && this.audioCtx.state === 'suspended') this.audioCtx.resume();

                if (isCorrect) {
                    this.playGallop();
                    // Boost
                    this.playerPos += 40; // Significant boost
                    this.updatePositions();
                    btnElement.classList.add('correct');

                    if (this.playerPos >= this.finishLine) {
                        this.endRace('player');
                    } else {
                        setTimeout(() => this.nextQuestion(), 500);
                    }
                } else {
                    this.playTone(150, 'sawtooth', 0.3);
                    btnElement.classList.add('wrong');

                    // Penalty
                    this.playerPos = Math.max(0, this.playerPos - 10);
                    this.updatePositions();

                    setTimeout(() => {
                        if (this.isPlaying) this.nextQuestion();
                    }, 500);
                }
            }

            endRace(winner) {
                this.isPlaying = false;
                clearInterval(this.houseInterval);

                const modal = document.getElementById('modal-result');
                const title = document.getElementById('result-title');
                const msg = document.getElementById('result-msg');

                modal.style.display = 'flex';

                if (winner === 'player') {
                    this.playFanfare();
                    title.innerText = "VICTÒRIA!";
                    title.style.color = "#4caf50";
                    msg.innerText = "El teu camell ha arribat primer!";

                    this.completedLevels[this.currentLevel] = true;
                    this.updateMenu();
                } else {
                    this.playTone(100, 'sawtooth', 1);
                    title.innerText = "DERROTA...";
                    title.style.color = "#f44336";
                    msg.innerText = "La IA t'ha guanyat aquesta vegada.";
                }
            }

            replayLevel() {
                this.resetRace();
            }

            updateMenu() {
                const grid = document.getElementById('level-grid');
                grid.innerHTML = "";
                let totalWins = this.completedLevels.filter(x => x).length;
                document.getElementById('wins-display').innerText = totalWins;

                DERBY_DATA.forEach((era, idx) => {
                    const btn = document.createElement('div');
                    btn.className = "level-btn";
                    if (this.completedLevels[idx]) btn.classList.add('completed');

                    btn.innerHTML = `<div>${era.name}</div>`;
                    btn.onclick = () => this.initLevel(idx);
                    grid.appendChild(btn);
                });
            }
        }

        const game = new Game();

        // Initial Menu Render
        function showMenu() {
            document.getElementById('modal-result').style.display = 'none';
            game.isPlaying = false;
            clearInterval(game.houseInterval);
            game.updateMenu();
            document.getElementById('modal-start').style.display = 'flex';
        }

        window.onload = function () {
            game.updateMenu();
        };

    </script>
</body>
