    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@400;700&display=swap"

    <style>
        body {
            font-family: 'Lato', sans-serif;
            background-color: #0f172a;
            color: #cbd5e1;
        }

        .font-thrones {
            font-family: 'Cinzel', serif;
        }

        .bg-ice {
            background: linear-gradient(to bottom, #0f172a, #1e3a8a);
        }

        .text-ice {
            color: #67e8f9;
            text-shadow: 0 0 10px #22d3ee;
        }

        .text-fire {
            color: #fca5a5;
            text-shadow: 0 0 10px #ef4444;
        }

        .snowflake {
            position: absolute;
            color: #fff;
            opacity: 0.3;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh);
            }
        }
    </style>

    <!-- INICIO_AUTO_ZOOM_ANTIGRAVITY -->
    <script>
        function autoEscalar() {
            const anchoDiseno = 1920; 
            const escala = window.innerWidth / anchoDiseno;
            if (escala < 1) {
                document.body.style.zoom = escala;
            } else {
                document.body.style.zoom = 1;
            }
        }
        window.addEventListener('resize', autoEscalar);
        window.addEventListener('DOMContentLoaded', autoEscalar);
    </script>
    <!-- FIN_AUTO_ZOOM_ANTIGRAVITY -->

</head>

                "pool": [

            },
            "Romanticisme": {

                "pool": [

                    { name: "Wagner", quote: "Això no és una òpera, és una Obra d'Art Total.", type: "ally", img: "wagner.png" },

                ]
            },
            "Segle XX": {
                "title": "EL MUR DEL FUTUR",
                "pool": [
                    { name: "Stravinsky", quote: "El ritme de la Consagració trenca les normes.", type: "ally", img: "stravinsy.png" },
                    { name: "Schoenberg", quote: "Utilitzo 12 notes sense repetir-ne cap.", type: "ally", img: "schoemberg.png" },
                    { name: "John Cage", quote: "La meva obra són 4 minuts i 33 segons de silenci.", type: "ally", img: "cage.png" },
                    { name: "Sintetitzador", quote: "Creo sons nous amb electricitat.", type: "ally", img: "sintetitzador.png" },
                    { name: "Caminant Mozart", quote: "Això sona fatal! On és la melodia bonica?", type: "walker", img: "caminantmozart1.png" },
                    { name: "Espectre Barroc", quote: "Falta el Baix Continu!", type: "walker", img: "caminentbarroc.png" },
                    { name: "Trobador", quote: "Què és l'electricitat?", type: "walker", img: "caminanttrobador.png" },
                    { name: "Verdi", quote: "Vull cantar una òpera romàntica.", type: "walker", img: "caminantberdi.png" },
                    { name: "Jazzman", quote: "Improvisem amb swing i notes blaves.", type: "ally", img: "jazzman.png" },
                    { name: "Guitarra Elèctrica", quote: "Puc distorsionar el so.", type: "ally", img: "rocker.png" }
                ]
            }
        };

        const Snow = () => (
            <div className="absolute inset-0 pointer-events-none z-0">
                {[...Array(20)].map((_, i) => (
                    <div
                        key={i}
                        className="snowflake"
                        style={{
                            left: `${Math.random() * 100}%`,
                            animationDuration: `${Math.random() * 5 + 5}s`,
                            animationDelay: `${Math.random() * 5}s`,
                            fontSize: `${Math.random() * 20 + 20}px`
                        }}
                    >
                        <img src="./img/copodeneu.png" className="w-6 h-6 opacity-60" alt="snowflake" />
                    </div>
                ))}
            </div>
        );

        const App = () => {
            const [gameStage, setGameStage] = useState('menu');
            const [selectedEra, setSelectedEra] = useState(null);
            const [wave, setWave] = useState(0);
            const [horde, setHorde] = useState([]);
            const [shields, setShields] = useState(4);
            const [feedback, setFeedback] = useState(null);
            const [volume, setVolume] = useState(0.3);
            const [completedEras, setCompletedEras] = useState([]);

            const bgMusicRef = useRef(null);

            // Initialize audio only once
            useEffect(() => {
                bgMusicRef.current = new Audio('audio/Shadows On The Wall.mp3');
                bgMusicRef.current.loop = true;
                bgMusicRef.current.volume = volume;

                // Attempt play
                const playPromise = bgMusicRef.current.play();
                if (playPromise !== undefined) {
                    playPromise.catch(error => {
                        console.log("Auto-play prevented");
                    });
                }

                return () => {
                    if (bgMusicRef.current) {
                        bgMusicRef.current.pause();
                        bgMusicRef.current = null;
                    }
                };
            }, []);

            // Handle volume changes
            useEffect(() => {
                if (bgMusicRef.current) {
                    bgMusicRef.current.volume = volume;
                }
            }, [volume]);

            const sounds = useMemo(() => ({
                ice: new Audio('https://assets.mixkit.co/active_storage/sfx/619/619-preview.mp3'),
                win: new Audio('https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3'),
                gameover: new Audio('https://assets.mixkit.co/active_storage/sfx/290/290-preview.mp3')
            }), []);

            const startGame = (era) => {
                // Ensure music plays on interaction
                if (bgMusicRef.current && bgMusicRef.current.paused) {
                    bgMusicRef.current.play().catch(e => console.log(e));
                }

                setSelectedEra(era);
                const data = THRONES_DATA[era];
                const pool = data.pool;

                // Shuffle the exact 10 characters to ensure everyone appears once randomly
                const newHorde = [...data.pool].sort(() => Math.random() - 0.5);

                setHorde(newHorde);
                setWave(0);
                setShields(4);
                setFeedback(null);
                setGameStage('playing');
            };

            const handleAction = (action) => {
                // action: 'gate' | 'dracarys'
                const char = horde[wave];
                let isCorrect = false;

                // Ally -> Gate
                // Walker -> Dracarys
                if (action === 'gate' && char.type === 'ally') isCorrect = true;
                if (action === 'dracarys' && char.type === 'walker') isCorrect = true;

                if (isCorrect) {
                    if (action === 'gate') {
                        setFeedback({ type: 'door', text: "Benvingut, Germà." });
                    } else {
                        setFeedback({ type: 'fire', text: "DRACARYS!" });
                    }
                } else {
                    sounds.ice.currentTime = 0;
                    sounds.ice.play();
                    setShields(s => s - 1);
                    setFeedback({ type: 'broken', text: char.type === 'walker' ? "Traïció! Era un enemic!" : "No! Era un aliat!" });
                }

                setTimeout(() => {
                    setFeedback(null);
                    const nextShields = shields - (isCorrect ? 0 : 1);

                    if (nextShields <= 0) {
                        setGameStage('gameover');
                        sounds.gameover.play();
                    } else if (wave >= horde.length - 1) {
                        setGameStage('win');
                        sounds.win.play();
                        // Mark era as completed
                        setCompletedEras(prev => {
                            if (!prev.includes(selectedEra)) return [...prev, selectedEra];
                            return prev;
                        });
                    } else {
                        setWave(w => w + 1);
                    }
                }, 1500);
            };

            return (
                <div className="w-full h-full font-sans select-none relative">
                    {/* Background Image - using style for safety */}
                    <div
                        className="absolute inset-0 bg-cover bg-center z-0"
                        style={{ backgroundImage: "url('./img/fons.jpg')" }}
                    ></div>
                    <div className="absolute inset-0 bg-gradient-to-t from-slate-900 via-slate-900/50 to-transparent z-0 opacity-80"></div>

                    <Snow />

                    {/* MENU */}
                    {gameStage === 'menu' && (
                        <motion.div
                            initial={{ opacity: 0 }} animate={{ opacity: 1 }}
                            className="h-full flex flex-col items-center justify-center p-6 text-center space-y-8 z-10 relative bg-black/40 backdrop-blur-sm"
                        >
                            {/* Volume Slider - Fixed Top Right in Menu */}
                            <div className="absolute top-4 right-4 z-50 group flex items-center gap-2 bg-black/50 p-2 rounded-full backdrop-blur-md hover:bg-black/80 transition-all border border-slate-700">
                                <span className="text-xl text-slate-300">🔊</span>
                                <input
                                    type="range"
                                    min="0"
                                    max="1"
                                    step="0.01"
                                    value={volume}
                                    onChange={(e) => setVolume(parseFloat(e.target.value))}
                                    className="w-8 md:w-24 h-1 bg-slate-600 rounded-lg appearance-none cursor-pointer accent-blue-400"
                                />
                            </div>

                            <div className="space-y-2">
                                <h1 className="text-5xl md:text-8xl font-thrones text-ice tracking-widest drop-shadow-[0_0_15px_rgba(34,211,238,0.5)]">
                                    GAME OF TONES
                                </h1>
                                <h2 className="text-2xl md:text-3xl text-gray-400 font-thrones border-b-2 border-slate-600 pb-4 inline-block px-12">
                                    LA GUÀRDIA DEL TEMPS
                                </h2>
                            </div>
                            <p className="text-gray-300 text-lg md:text-xl max-w-2xl mx-auto italic font-serif">
                                "La nit és fosca i plena d'errors històrics. Obre la porta als Aliats, crema els Anacronismes."
                            </p>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 w-full max-w-4xl max-h-[50vh] overflow-y-auto px-4 py-2 no-scrollbar">
                                {Object.keys(THRONES_DATA).map(era => {
                                    const isCompleted = completedEras.includes(era);
                                    return (
                                        <motion.button
                                            key={era}
                                            whileHover={{ scale: 1.02 }}
                                            whileTap={{ scale: 0.98 }}
                                            onClick={() => startGame(era)}
                                            className={`p-6 border rounded-lg text-left transition-all flex justify-between items-center group shadow-lg
                                                ${isCompleted
                                                    ? "bg-green-900/80 border-green-500 shadow-[0_0_15px_rgba(34,255,100,0.3)]"
                                                    : "bg-slate-900/80 border-slate-600 hover:border-blue-400"
                                                }
                                            `}
                                        >
                                            <span className={`font-thrones font-bold text-xl uppercase transition-colors ${isCompleted ? "text-green-200" : "group-hover:text-blue-300"}`}>
                                                {era} {isCompleted && "✓"}
                                            </span>
                                            <span className="text-sm text-gray-400 italic">{THRONES_DATA[era].title}</span>
                                        </motion.button>
                                    );
                                })}
                            </div>
                        </motion.div>
                    )}

                    {/* PLAYING */}
                    {gameStage === 'playing' && (
                        <div className="h-full flex flex-col relative z-20">
                            {/* Top HUD */}
                            <div className="bg-slate-950/90 p-4 md:p-6 flex justify-between items-center border-b-4 border-slate-800 shadow-2xl z-30 relative">
                                {/* Left: Volume */}
                                <div className="flex items-center gap-2 bg-black/30 p-2 rounded-full border border-slate-700 w-32 md:w-48">
                                    <span className="text-xl text-slate-300">🔊</span>
                                    <input
                                        type="range"
                                        min="0"
                                        max="1"
                                        step="0.01"
                                        value={volume}
                                        onChange={(e) => setVolume(parseFloat(e.target.value))}
                                        className="w-full h-1 bg-slate-600 rounded-lg appearance-none cursor-pointer accent-blue-400"
                                    />
                                </div>

                                {/* Center: Era Title */}
                                <div className="absolute left-1/2 transform -translate-x-1/2 text-center pointer-events-none">
                                    <div className="text-xs md:text-sm text-blue-400 uppercase tracking-[0.2em] font-bold">Guàrdia Nocturna</div>
                                    <div className="font-thrones text-2xl md:text-4xl text-white drop-shadow-md">{selectedEra}</div>
                                </div>

                                {/* Right: Shields & Wave */}
                                <div className="flex flex-col items-end">
                                    <div className="flex gap-2 text-3xl md:text-4xl">
                                        {[...Array(4)].map((_, i) => (
                                            <div key={i} className={`filter transition-all duration-500 ${i < shields ? "opacity-100 drop-shadow-[0_0_8px_rgba(255,255,255,0.6)] saturate-100" : "opacity-20 grayscale blur-sm"}`}>
                                                <img src="./img/escut.png" className="w-8 h-8 md:w-10 md:h-10 object-contain" alt="shield" />
                                            </div>
                                        ))}
                                    </div>
                                    <div className="text-sm font-bold text-slate-500 mt-2 tracking-wider">
                                        ONADA {wave + 1} / 10
                                    </div>
                                </div>
                            </div>

                            {/* Main Display */}
                            <div className="flex-1 flex flex-col items-center justify-center p-6 relative overflow-hidden">
                                <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-slate-900/50 via-slate-950/80 to-transparent pointer-events-none"></div>

                                <AnimatePresence mode="wait">
                                    {horde[wave] && (
                                        <motion.div
                                            key={wave}
                                            initial={{ scale: 0.9, opacity: 0, y: 50 }}
                                            animate={{ scale: 1, opacity: 1, y: 0 }}
                                            exit={{ scale: 0.9, opacity: 0, y: -50 }}
                                            transition={{ type: "spring", stiffness: 100, damping: 20 }}
                                            className="relative z-10 w-full max-w-xl flex flex-col items-center text-center"
                                        >
                                            {/* Character Image */}
                                            <div className="mb-6 relative group">
                                                <div className="absolute inset-0 bg-blue-500/20 blur-xl rounded-full group-hover:bg-blue-400/30 transition-all"></div>
                                                <img
                                                    src={`./img/${horde[wave].img}`}
                                                    alt={horde[wave].name}
                                                    className="w-64 h-64 md:w-80 md:h-80 object-cover rounded-full border-4 border-slate-600 shadow-2xl relative z-10"
                                                    onError={(e) => { e.target.src = 'https://via.placeholder.com/300?text=No+Image'; }}
                                                />
                                            </div>

                                            {/* Name */}
                                            <h3 className="text-3xl md:text-5xl font-thrones font-bold mb-4 text-slate-100 tracking-wide drop-shadow-lg">
                                                {horde[wave].name}
                                            </h3>

                                            {/* Quote (No Quotes) */}
                                            <p className="text-xl md:text-2xl italic text-slate-300 px-4 font-serif leading-relaxed opacity-90">
                                                {horde[wave].quote}
                                            </p>
                                        </motion.div>
                                    )}
                                </AnimatePresence>

                                {/* Feedback */}
                                <AnimatePresence>
                                    {feedback && (
                                        <motion.div
                                            initial={{ opacity: 0 }}
                                            animate={{ opacity: 1 }}
                                            exit={{ opacity: 0 }}
                                            className={`absolute inset-0 z-50 flex flex-col items-center justify-center pointer-events-none backdrop-blur-sm
                                                ${feedback.type === 'fire' ? 'bg-red-900/40' :
                                                    feedback.type === 'door' ? 'bg-yellow-900/40' : 'bg-blue-900/60'}
                                            `}
                                        >
                                            <motion.div
                                                initial={{ scale: 0.5, rotate: -10 }}
                                                animate={{ scale: 1.5, rotate: 0 }}
                                                className={`text-6xl md:text-8xl font-thrones font-bold uppercase drop-shadow-[0_0_25px_black] border-4 border-current px-12 py-6 rounded-xl
                                                    ${feedback.type === 'fire' ? 'text-red-500' :
                                                        feedback.type === 'door' ? 'text-yellow-400' : 'text-blue-300'}
                                                `}
                                            >
                                                {feedback.text}
                                            </motion.div>
                                            {feedback.type === 'fire' &&
                                                <img src="./img/foc.png" className="w-32 h-32 mt-8 animate-bounce" alt="fire" />
                                            }
                                        </motion.div>
                                    )}
                                </AnimatePresence>
                            </div>

                            {/* Controls */}
                            <div className="w-full grid grid-cols-2 h-24 md:h-32 bg-black border-t-2 border-slate-800 z-30">
                                <button
                                    onClick={() => !feedback && handleAction('gate')}
                                    disabled={!!feedback}
                                    className="h-full bg-slate-900 hover:bg-yellow-900/30 border-r border-slate-800 hover:border-r hover:border-yellow-600/50 flex flex-col items-center justify-center transition-all active:bg-slate-800 group relative overflow-hidden"
                                >
                                    <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/wood-pattern.png')] opacity-10"></div>
                                    <img src="./img/porta.png" className="w-12 h-12 mb-2 group-hover:scale-110 transition-transform relative z-10 object-contain" alt="gate" />
                                    <span className="font-thrones font-bold text-lg md:text-2xl text-slate-300 group-hover:text-yellow-400 transition-colors relative z-10">OBRIR PORTA</span>
                                    <span className="text-xs uppercase text-slate-500 mt-1 relative z-10">És un Aliat</span>
                                </button>
                                <button
                                    onClick={() => !feedback && handleAction('dracarys')}
                                    disabled={!!feedback}
                                    className="h-full bg-slate-900 hover:bg-red-900/30 flex flex-col items-center justify-center transition-all active:bg-slate-800 group relative overflow-hidden"
                                >
                                    <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')] opacity-10"></div>
                                    <img src="./img/foc.png" className="w-12 h-12 mb-2 group-hover:scale-110 transition-transform relative z-10 object-contain" alt="fire" />
                                    <span className="font-thrones font-bold text-lg md:text-2xl text-slate-300 group-hover:text-red-500 transition-colors relative z-10">DRACARYS</span>
                                    <span className="text-xs uppercase text-slate-500 mt-1 relative z-10">És un Enemic</span>
                                </button>
                            </div>
                        </div>
                    )}

                    {/* END SCREEN */}
                    {(gameStage === 'win' || gameStage === 'gameover') && (
                        <div className="absolute inset-0 z-50 bg-black/95 flex flex-col items-center justify-center text-center p-8 space-y-8">
                            <div className="text-9xl animate-pulse">
                                {gameStage === 'win' ? '⚔️' : <img src="./img/copodeneu.png" className="w-32 h-32 opacity-80" alt="snow" />}
                            </div>
                            <h2 className={`text-5xl md:text-7xl font-thrones tracking-wide ${gameStage === 'win' ? 'text-yellow-500 drop-shadow-[0_0_20px_rgba(234,179,8,0.5)]' : 'text-blue-500 drop-shadow-[0_0_20px_rgba(59,130,246,0.5)]'}`}>
                                {gameStage === 'win' ? 'GUÀRDIA FINALITZADA' : 'EL MUR HA CAIGUT'}
                            </h2>
                            <p className="text-2xl text-gray-400 font-serif italic max-w-2xl leading-relaxed">
                                {gameStage === 'win'
                                    ? "Has defensat la línia del temps amb honor. Els Mestre de la Ciutadella escriuran cançons sobre tu."
                                    : "Els Caminants Blancs (anacronismes) han envaït la història. L'Hivern ha arribat."}
                            </p>
                            <button
                                onClick={() => setGameStage('menu')}
                                className="mt-8 px-12 py-5 bg-slate-100 text-slate-900 font-thrones font-bold text-xl rounded shadow-[0_0_20px_rgba(255,255,255,0.3)] hover:bg-white hover:scale-105 transition-transform"
                            >
                                JURAMENT NOU
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
