<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Bugaderia del Temps</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Roboto:wght@400;700&display=swap');

        :root {
            --metal: #cfd8dc;
            --panel: #263238;
            --led-off: #37474f;
            --led-on: #00e676;
            --led-red: #ff1744;
            --accent: #ffa502;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            background-color: #2c3e50;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none;
            color: #333;
        }

        #game-container {
            width: 100%;
            height: 100%;
            max-width: 1100px;
            position: relative;
            background: #455a64;
            border: 12px solid #263238;
            box-shadow: 0 0 100px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
        }

        /* Start Screen */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            text-align: center;
            color: white;
            padding: 20px;
        }

        h1 {
            font-family: 'Roboto Mono', monospace;
            font-size: 3.5rem;
            margin-bottom: 10px;
            color: var(--led-on);
            text-shadow: 0 0 20px var(--led-on);
        }

        .subtitle {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 30px;
        }

        .era-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 800px;
        }

        .btn-era {
            background: #37474f;
            border: 2px solid var(--led-on);
            color: white;
            padding: 20px;
            font-size: 1.1rem;
            font-family: 'Roboto Mono', monospace;
            cursor: pointer;
            transition: 0.3s;
            border-radius: 10px;
        }

        .btn-era:hover {
            background: var(--led-on);
            color: black;
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 230, 118, 0.3);
        }

        /* Laundry Room */
        #laundry-room {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            background: radial-gradient(circle, #78909c, #37474f);
        }

        #machine {
            width: 500px;
            height: 600px;
            background: #cfd8dc;
            border-radius: 30px;
            border: 15px solid #eceff1;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            padding-top: 40px;
        }

        #door-outer {
            width: 320px;
            height: 320px;
            border-radius: 50%;
            border: 25px solid #b0bec5;
            background: #263238;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 1);
            position: relative;
            overflow: hidden;
        }

        #door-glass {
            width: 100%;
            height: 100%;
            background: rgba(135, 206, 235, 0.1);
            position: absolute;
            z-index: 10;
            pointer-events: none;
        }

        #item-display {
            width: 80%;
            height: 80%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 50%;
            /* Ensure it stays within the circle */
        }

        #item-display img {
            width: 40%;
            height: 40%;
            object-fit: contain;
            filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.3));
        }

        .washing #item-display {
            animation: wash-spin 1s linear infinite;
        }

        @keyframes wash-spin {
            0% {
                transform: rotate(0deg) scale(1);
            }

            50% {
                transform: rotate(180deg) scale(0.8);
            }

            100% {
                transform: rotate(360deg) scale(1);
            }
        }

        #control-panel {
            width: 100%;
            height: 180px;
            background: var(--panel);
            margin-top: auto;
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 20px;
            box-shadow: inset 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        .dial-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            color: #ccc;
            font-family: 'Roboto Mono', monospace;
            font-size: 0.75rem;
            width: 140px;
        }

        .dial {
            width: 80px;
            height: 80px;
            background: #ecf0f1;
            border-radius: 50%;
            border: 4px solid #7f8c8d;
            position: relative;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .dial::after {
            content: '';
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 25px;
            background: #e74c3c;
            border-radius: 3px;
        }

        /* 6 positions for the dial */
        .dial[data-val="0"] {
            transform: rotate(-75deg);
        }

        .dial[data-val="1"] {
            transform: rotate(-45deg);
        }

        .dial[data-val="2"] {
            transform: rotate(-15deg);
        }

        .dial[data-val="3"] {
            transform: rotate(15deg);
        }

        .dial[data-val="4"] {
            transform: rotate(45deg);
        }

        .dial[data-val="5"] {
            transform: rotate(75deg);
        }

        .led-strip {
            display: flex;
            gap: 4px;
            margin-top: 5px;
        }

        .led {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--led-off);
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.5);
        }

        .led.active {
            background: var(--led-on);
            box-shadow: 0 0 8px var(--led-on);
        }

        .val-label {
            margin-top: 5px;
            font-weight: bold;
            color: var(--led-on);
            text-align: center;
            min-height: 1.2em;
        }

        #btn-start {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--led-red);
            border: 6px solid #b71c1c;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 8px 0 #7b1313, 0 10px 20px rgba(0, 0, 0, 0.5);
            transition: 0.1s;
        }

        #btn-start:active {
            transform: translateY(5px);
            box-shadow: 0 3px 0 #7b1313;
        }

        #btn-start:disabled {
            filter: grayscale(1);
            cursor: not-allowed;
            opacity: 0.5;
        }

        #info-overlay {
            position: absolute;
            top: 30px;
            padding: 15px 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            border-left: 10px solid var(--accent);
            max-width: 400px;
        }

        #info-overlay h2 {
            margin: 0;
            color: #333;
            font-size: 1.5rem;
        }

        #info-overlay p {
            margin: 5px 0 0;
            color: #666;
            font-style: italic;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            font-family: 'Roboto Mono', monospace;
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        /* End Screen */
        #feedback-screen {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            color: white;
        }

        #volume-control {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 10px;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
        }
    </style>
</head>

<body>

    <div id="game-container">
        <!-- Start Screen -->
        <div id="start-screen">
            <h1>LA BUGADERIA DEL TEMPS</h1>
            <p class="subtitle">Identifica el material i la resistència de cada objecte històric.</p>
            <button class="btn-era" style="width: 200px; height: 200px; border-radius: 50%; font-size: 1.5rem;"
                onclick="game.startGame()">INICIAR TORN</button>
        </div>

        <div id="hud">NIVELL: <span id="ui-level">1</span>/18 | ERRORS: <span id="ui-fails">0</span>/5</div>

        <!-- Laundry Room -->
        <div id="laundry-room">
            <div id="info-overlay">
                <h2 id="item-name">...</h2>
                <p id="item-desc">...</p>
            </div>

            <div id="machine">
                <div id="door-outer">
                    <div id="door-glass"></div>
                    <div id="item-display">👕</div>
                </div>

                <div id="control-panel">
                    <div class="dial-group">
                        <span>MATERIAL</span>
                        <div class="dial" id="dial-material" data-val="0" onclick="game.rotateDial('material')"></div>
                        <div class="led-strip" id="leds-material"></div>
                        <div class="val-label" id="label-material">PAPER</div>
                    </div>

                    <button id="btn-start" onclick="game.startWash()">START</button>

                    <div class="dial-group">
                        <span>EDAT</span>
                        <div class="dial" id="dial-era" data-val="0" onclick="game.rotateDial('era')">
                        </div>
                        <div class="led-strip" id="leds-era"></div>
                        <div class="val-label" id="label-era">BARROC</div>
                    </div>
                </div>
            </div>
        </div>

        <div id="volume-control">
            🔊 <input type="range" id="bgm-slider" min="0" max="1" step="0.1" value="0.5">
        </div>

        <audio id="bgm-player" loop>
            <source src="audio/Soft Spin Cycle.m4a" type="audio/mpeg">
        </audio>

        <!-- Feedback Screen -->
        <div id="feedback-screen" class="hidden">
            <h1 id="end-title">OCUPAT!</h1>
            <p id="end-msg" style="font-size: 1.5rem; margin: 20px 0;"></p>
            <button class="btn-era" onclick="location.reload()">OCUPAR EL TEMPS DE NOU</button>
        </div>
    </div>

    <script>
        // Shuffled Materials and Resistances for the Dials
        // Order: MIXED (Non-chronological)
        const MATERIALS = [
            "FIBRA DISSONANT",    // 0 (XX)
            "PELL GREGORIANA",    // 1 (Mitjana)
            "COTÓ HARMÒNIC",      // 2 (Classicisme)
            "SEDA CONTRAPUNT",    // 3 (Barroc)
            "VELLUT POLIFÒNIC",   // 4 (Renaixement)
            "LLANA DRAMÀTICA"     // 5 (Romanticisme)
        ];

        // Shuffled Eras
        const ERAS_DIAL = [
            "BARROC",            // 0 
            "ROMANTICISME",      // 1
            "SEGLE XX",          // 2
            "RENAIXEMENT",       // 3
            "EDAT MITJANA",      // 4
            "CLASSICISME"        // 5
        ];

        // Mapping Era Keys to Dial Indices
        const ERA_MAP = {
            edat_mitjana: 4,
            renaixement: 3,
            barroc: 0,
            classicisme: 5,
            romanticisme: 1,
            segle_xx: 2
        };

        const DB = {
            edat_mitjana: [
                { name: "Túnica de Monjo", desc: "Teixit aspre de llana del S. XII.", matId: 1, img: "img/monjo.png" },
                { name: "Capa de Trobador", desc: "Pell i teixit resistent del S. XIII.", matId: 1, img: "img/capatrobador.png" },
                { name: "Calces de Malles", desc: "Protecció de cames del S. XI.", matId: 1, img: "img/cotamalles.png" }
            ],
            renaixement: [
                { name: "Vestit de Vellut", desc: "Teixit car d'Itàlia del S. XV.", matId: 4, img: "img/vestitvellut.png" },
                { name: "Gorra d'Humanista", desc: "Vellut suau intel·lectual del S. XV.", matId: 4, img: "img/gorrahumanista.png" },
                { name: "Camisa de Lli", desc: "Roba interior fina del S. XVI.", matId: 4, img: "img/camisalli.png" }
            ],
            barroc: [
                { name: "Casaca de Seda", desc: "Roba d'etiqueta del S. XVII.", matId: 3, img: "img/casacaseda.png" },
                { name: "Perruca de Versalles", desc: "Cabell postís i seda del S. XVII.", matId: 3, img: "img/perruca.png" },
                { name: "Mitges de Seda", desc: "Luxe per a les cames del S. XVIII.", matId: 3, img: "img/mitgesseda.png" }
            ],
            classicisme: [
                { name: "Vestit Imperi", desc: "Cotó vaporós del S. XIX.", matId: 2, img: "img/vestitimperi.png" },
                { name: "Lleva Blanca", desc: "Jaqueta de cotó net del S. XVIII.", matId: 2, img: "img/llevablanca.png" },
                { name: "Mocador de Coll", desc: "Complement de cotó del S. XVIII.", matId: 2, img: "img/mocadorcoll.png" }
            ],
            romanticisme: [
                { name: "Capa del Viatger", desc: "Llana pesada del S. XIX.", matId: 5, img: "img/capaviatger.png" },
                { name: "Mocador de Llàgrimes", desc: "Teixit poètic de llana fina del S. XIX.", matId: 5, img: "img/mocadorllagrimes.png" },
                { name: "Barret de Copa", desc: "Feltre i llana del S. XIX.", matId: 5, img: "img/barretcopa.png" }
            ],
            segle_xx: [
                { name: "Samarreta Grunge", desc: "Fibra sintètica del S. XX.", matId: 0, img: "img/grunge.png" },
                { name: "Texans", desc: "Teixit resistent industrial del S. XX.", matId: 0, img: "img/texans.png" },
                { name: "Jaqueta de Cuir Rock", desc: "Originalment pell, ara sintètic.", matId: 0, img: "img/jaquetacuir.png" }
            ]
        };

        class LaundryGame {
            constructor() {
                this.deck = [];
                this.currentItem = null;
                this.level = 0;
                this.fails = 0;
                this.isWashing = false;
                this.settings = { material: 0, era: 0 };

                this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();

                this.bgm = document.getElementById('bgm-player');
                this.bgm.volume = 0.5;

                document.getElementById('bgm-slider').oninput = (e) => {
                    this.bgm.volume = e.target.value;
                };

                this.initLEDs();
            }

            initLEDs() {
                ['material', 'era'].forEach(type => {
                    const strip = document.getElementById(`leds-${type}`);
                    strip.innerHTML = '';
                    for (let i = 0; i < 6; i++) {
                        const led = document.createElement('div');
                        led.className = 'led';
                        led.id = `led-${type}-${i}`;
                        strip.appendChild(led);
                    }
                });
                this.updateUI();
            }

            startGame() {
                this.level = 0;
                this.fails = 0;
                this.buildDeck();
                document.getElementById('start-screen').classList.add('hidden');

                // Start Music
                this.bgm.play().catch(e => console.log("Audio play failed (user interaction needed first):", e));

                this.loadNextItem();
                this.playSound('click');
            }

            buildDeck() {
                this.deck = [];
                for (const [eraKey, items] of Object.entries(DB)) {
                    items.forEach(item => {
                        this.deck.push({ ...item, eraKey: eraKey });
                    });
                }
                // Shuffle Deck
                this.deck.sort(() => Math.random() - 0.5);
            }

            loadNextItem() {
                if (this.deck.length === 0) {
                    this.endGame(true);
                    return;
                }

                this.currentItem = this.deck.pop();

                document.getElementById('item-name').textContent = this.currentItem.name;
                document.getElementById('item-desc').textContent = this.currentItem.desc;

                const display = document.getElementById('item-display');
                display.innerHTML = `<img src="${this.currentItem.img}" alt="${this.currentItem.name}">`;

                this.isWashing = false;
                document.getElementById('machine').classList.remove('washing');
                document.getElementById('btn-start').disabled = false;
                this.updateUI();
            }

            rotateDial(type) {
                if (this.isWashing) return;
                this.settings[type] = (this.settings[type] + 1) % 6;
                this.playSound('click');
                this.updateUI();
            }

            updateUI() {
                // Update Material
                const dMat = document.getElementById('dial-material');
                dMat.dataset.val = this.settings.material;
                document.getElementById('label-material').textContent = MATERIALS[this.settings.material];
                for (let i = 0; i < 6; i++) {
                    document.getElementById(`led-material-${i}`).classList.toggle('active', i === this.settings.material);
                }

                // Update Era
                const dEra = document.getElementById('dial-era');
                dEra.dataset.val = this.settings.era;
                document.getElementById('label-era').textContent = ERAS_DIAL[this.settings.era];
                for (let i = 0; i < 6; i++) {
                    document.getElementById(`led-era-${i}`).classList.toggle('active', i === this.settings.era);
                }

                // HUD
                document.getElementById('ui-level').textContent = this.level + 1;
                document.getElementById('ui-fails').textContent = this.fails;
            }

            startWash() {
                if (this.isWashing) return;
                this.isWashing = true;
                document.getElementById('btn-start').disabled = true;
                document.getElementById('machine').classList.add('washing');
                this.playSound('wash');

                setTimeout(() => this.checkResult(), 2500);
            }

            checkResult() {
                const targetEraIndex = ERA_MAP[this.currentItem.eraKey];
                const success = this.settings.material === this.currentItem.matId && this.settings.era === targetEraIndex;

                if (success) {
                    this.playSound('success');
                    this.level++;
                    if (this.level >= 18) { // Win after 18 correct washes
                        this.endGame(true);
                    } else {
                        setTimeout(() => this.loadNextItem(), 1000);
                    }
                } else {
                    this.playSound('fail');
                    this.fails++;
                    this.updateUI();
                    if (this.fails >= 5) {
                        this.endGame(false);
                    } else {
                        this.isWashing = false;
                        document.getElementById('machine').classList.remove('washing');
                        document.getElementById('btn-start').disabled = false;
                    }
                }
            }

            endGame(won) {
                const screen = document.getElementById('feedback-screen');
                const title = document.getElementById('end-title');
                const msg = document.getElementById('end-msg');

                title.textContent = won ? "BUGADA REIAL! 🧼" : "S'HA ACABAT EL SABÓ... 😵";
                title.style.color = won ? "var(--led-on)" : "var(--led-red)";
                msg.textContent = won
                    ? "Has deixat la història neta i lluent com una patena."
                    : "Has destrossat massa relíquies. El museu et reclama danys i perjudicis!";

                screen.classList.remove('hidden');
            }

            playSound(type) {
                if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
                const osc = this.audioCtx.createOscillator();
                const gain = this.audioCtx.createGain();
                const now = this.audioCtx.currentTime;

                osc.connect(gain);
                gain.connect(this.audioCtx.destination);

                if (type === 'click') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(800, now);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(); osc.stop(now + 0.1);
                } else if (type === 'wash') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(60, now);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0, now + 2.5);
                    osc.start(); osc.stop(now + 2.5);
                } else if (type === 'success') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.2);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(); osc.stop(now + 0.3);
                } else if (type === 'fail') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.linearRampToValueAtTime(50, now + 0.4);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    osc.start(); osc.stop(now + 0.5);
                }
            }
        }

        const game = new LaundryGame();
    </script>
</body>

</html>
