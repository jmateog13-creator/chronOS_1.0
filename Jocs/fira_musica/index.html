<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Fira de la Música</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rye&family=Roboto:wght@400;700&display=swap');

        :root {
            --wood-dark: #5d4037;
            --wood-light: #8d6e63;
            --curtain-red: #b71c1c;
            --gold: #ffd700;
            --sky-blue: #87ceeb;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            background-color: #222;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none;
            cursor: crosshair;
            /* Default cursor fallback */
        }

        #game-container {
            width: 100%;
            height: 100%;
            max-width: 1000px;
            position: relative;
            background: var(--sky-blue);
            border: 10px solid var(--wood-dark);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }

        /* Start Screen */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            text-align: center;
            color: white;
        }

        h1 {
            font-family: 'Rye', serif;
            font-size: 4rem;
            color: var(--gold);
            text-shadow: 3px 3px 0 #000;
            margin-bottom: 10px;
        }

        .era-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .btn-era {
            background: var(--curtain-red);
            border: 3px solid var(--gold);
            color: white;
            padding: 15px 20px;
            font-size: 1.2rem;
            font-family: 'Rye', serif;
            cursor: pointer;
            transition: transform 0.1s;
            border-radius: 5px;
        }

        .btn-era:hover {
            transform: scale(1.05);
            background: #d32f2f;
        }

        /* Game Interface */
        #booth {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* Top Curtain */
        #curtain {
            width: 100%;
            height: 80px;
            background: repeating-linear-gradient(90deg,
                    var(--curtain-red),
                    var(--curtain-red) 40px,
                    #8e0000 40px,
                    #8e0000 80px);
            border-bottom: 5px solid var(--gold);
            position: relative;
            z-index: 10;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #hud {
            background: rgba(0, 0, 0, 0.7);
            padding: 5px 20px;
            border-radius: 20px;
            border: 2px solid var(--gold);
            color: white;
            font-family: 'Rye', serif;
            font-size: 1.2rem;
            display: flex;
            gap: 20px;
        }

        /* Shooting Range */
        #range {
            flex: 1;
            position: relative;
            background: url('https://www.transparenttextures.com/patterns/wood-pattern.png'), #a1887f;
            overflow: hidden;
        }

        .shelf {
            position: absolute;
            width: 100%;
            height: 20px;
            background: var(--wood-dark);
            border-top: 5px solid #3e2723;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3);
        }

        #shelf-1 {
            top: 30%;
        }

        #shelf-2 {
            top: 55%;
        }

        #shelf-3 {
            top: 80%;
        }

        /* Targets */
        .target {
            position: absolute;
            width: 140px;
            /* Increased from 80 */
            height: 140px;
            /* Increased from 80 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none;
            cursor: none;
        }

        .target-img {
            width: 130px;
            /* Increased from 70 */
            height: 130px;
            /* Increased from 70 */
            object-fit: contain;
            filter: drop-shadow(4px 4px 5px rgba(0, 0, 0, 0.6));
            transition: transform 0.1s;
        }

        .target-label {
            background: white;
            color: black;
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 1.4rem;
            /* Doubled size */
            font-weight: 900;
            text-transform: uppercase;
            text-align: center;
            white-space: nowrap;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.4);
            margin-top: -15px;
            /* Pull up closer */
            z-index: 2;
            border: 2px solid #5d4037;
        }

        /* Ammo Bar */
        #ammo-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 5px;
            z-index: 15;
        }

        .bullet {
            width: 20px;
            height: 40px;
            background: var(--gold);
            border: 1px solid #b8860b;
            border-radius: 5px 5px 0 0;
        }

        .bullet.empty {
            background: rgba(0, 0, 0, 0.3);
            border-color: #333;
        }

        #reload-btn {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--curtain-red);
            color: white;
            padding: 10px 30px;
            font-family: 'Rye', serif;
            font-size: 1.5rem;
            border: 3px solid white;
            border-radius: 10px;
            cursor: pointer;
            display: none;
            z-index: 20;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% {
                transform: translateX(-50%) scale(1);
            }

            50% {
                transform: translateX(-50%) scale(1.1);
            }

            100% {
                transform: translateX(-50%) scale(1);
            }
        }

        /* Custom Cursor */
        #crosshair {
            position: fixed;
            width: 40px;
            height: 40px;
            border: 2px solid red;
            border-radius: 50%;
            pointer-events: none;
            z-index: 99999;
            /* Ensure strictly on top of everything */
            transform: translate(-50%, -50%);
        }

        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: red;
        }

        #crosshair::before {
            top: 50%;
            left: 0;
            width: 100%;
            height: 1px;
        }

        #crosshair::after {
            left: 50%;
            top: 0;
            height: 100%;
            width: 1px;
        }

        /* Feedback Overlay */
        #feedback-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
            display: none;
            color: white;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        #audio-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid var(--gold);
            z-index: 1000;
        }

        #volume-slider {
            width: 100px;
            cursor: pointer;
            accent-color: var(--gold);
        }
    </style>
</head>

<body>

    <div id="crosshair"></div>

    <!-- Audio Panel -->
    <div id="audio-panel">
        <span style="color:white">🔊</span>
        <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.3">
    </div>

    <audio id="bg-music" loop>
        <source src="El Shotter de la Feria.m4a" type="audio/mpeg">
    </audio>

    <div id="game-container">
        <!-- Start Screen -->
        <div id="start-screen">
            <h1>LA FIRA DE LA MÚSICA</h1>
            <p>Dispara només als objectius de la teva època!</p>
            <div class="era-grid">
                <button class="btn-era" data-era="edat_mitjana">Edat Mitjana</button>
                <button class="btn-era" data-era="renaixement">Renaixement</button>
                <button class="btn-era" data-era="barroc">Barroc</button>
                <button class="btn-era" data-era="classicisme">Classicisme</button>
                <button class="btn-era" data-era="romanticisme">Romanticisme</button>
                <button class="btn-era" data-era="segle_xx">Segle XX</button>
            </div>
        </div>

        <!-- Game Booth -->
        <div id="booth" class="hidden">
            <div id="curtain">
                <div id="hud">
                    <span>PUNTS: <span id="score">0</span></span>
                    <span>TEMPS: <span id="time">60</span>s</span>
                    <span>VIDES: <span id="lives">3</span></span>
                </div>
            </div>

            <div id="range">
                <div class="shelf" id="shelf-1"></div>
                <div class="shelf" id="shelf-2"></div>
                <div class="shelf" id="shelf-3"></div>
                <!-- Targets spawn here -->
            </div>

            <div id="ammo-container">
                <div class="bullet"></div>
                <div class="bullet"></div>
                <div class="bullet"></div>
                <div class="bullet"></div>
                <div class="bullet"></div>
                <div class="bullet"></div>
            </div>

            <button id="reload-btn" onclick="reloadGun()">RECARREGAR!</button>
        </div>

        <!-- Feedback Overlay -->
        <div id="feedback-overlay">
            <h2 id="end-title"></h2>
            <p id="end-msg"></p>
            <button class="btn-era" onclick="location.reload()">TORNAR A JUGAR</button>
        </div>
    </div>

    <script>
        // --- DATA ---
        const DB = {
            edat_mitjana: ["Cant Gregorià", "Monodia", "Neumes", "Trobador", "Guido d'Arezzo", "Viola de Roda", "Ars Nova", "Leonin", "Perotin", "Missa"],
            renaixement: ["Polifonia", "Humanisme", "Impremta", "Madrigal", "Palestrina", "Josquin", "Viola da Gamba", "Llaüt", "Coral", "Ensalada"],
            barroc: ["Baix Continu", "Clavicèmbal", "Bach", "Vivaldi", "Händel", "Òpera", "Fuga", "Contrast", "Ornament", "Castrato"],
            classicisme: ["Mozart", "Haydn", "Beethoven", "Sonata", "Equilibri", "Clarinet", "Piano", "Simfonia", "Quartet", "Senzillesa"],
            romanticisme: ["Wagner", "Chopin", "Verdi", "Lied", "Rubato", "Passió", "Poema Simfònic", "Virtuosisme", "Tuba", "Nacionalisme"],
            segle_xx: ["Atonalitat", "Dodecafonisme", "Stravinsky", "Cage", "Sintetitzador", "Jazz", "Minimalisme", "Soroll", "Aleatòria", "Electrònica"]
        };

        const TARGET_ICONS = ["🦆", "🍽️", "🎯", "🧸", "🎈"];

        // --- GAME STATE ---
        let currentEra = null;
        let score = 0;
        let lives = 3;
        let time = 60;
        let ammo = 6;
        let gameActive = false;
        let targets = [];
        let spawnInterval = null;
        let timerInterval = null;
        let gameLoopInterval = null;

        // --- AUDIO ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'shot') {
                // Air gun pop
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(0.01, now + 0.1);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'hit') {
                // Metal ping
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(800, now);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'break') {
                // Glass break / Error
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.linearRampToValueAtTime(100, now + 0.2);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'reload') {
                // Click clack
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.05);
                osc.start(now);
                osc.stop(now + 0.05);

                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(500, now + 0.1);
                gain2.gain.setValueAtTime(0.2, now + 0.1);
                gain2.gain.linearRampToValueAtTime(0, now + 0.15);
                osc2.start(now + 0.1);
                osc2.stop(now + 0.15);
            } else if (type === 'empty') {
                // Click
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, now);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.05);
                osc.start(now);
                osc.stop(now + 0.05);
            }
        }

        // --- MOUSE TRACKING ---
        document.addEventListener('mousemove', e => {
            const crosshair = document.getElementById('crosshair');
            crosshair.style.left = e.clientX + 'px';
            crosshair.style.top = e.clientY + 'px';
        });

        document.addEventListener('mousedown', e => {
            if (!gameActive) return;
            // Prevent shooting if clicking UI buttons
            if (e.target.tagName === 'BUTTON') return;

            shoot(e.clientX, e.clientY);
        });

        // --- LOGIC ---
        document.querySelectorAll('.btn-era').forEach(btn => {
            if (btn.parentElement.id === 'feedback-overlay') return;
            btn.addEventListener('click', () => {
                currentEra = btn.dataset.era;
                startGame();
            });
        });

        // Volume logic
        const bgMusic = document.getElementById('bg-music');
        const volSlider = document.getElementById('volume-slider');

        bgMusic.volume = 0.3; // Default

        volSlider.addEventListener('input', (e) => {
            bgMusic.volume = e.target.value;
        });

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('booth').classList.remove('hidden');

            // Start Music
            bgMusic.play().catch(e => console.log("Audio autoplay blocked"));

            score = 0;
            lives = 3;
            time = 60;
            ammo = 6;
            gameActive = true;
            targets = [];

            updateHUD();
            updateAmmo();

            spawnInterval = setInterval(spawnTarget, 800);
            timerInterval = setInterval(updateTime, 1000);
            gameLoopInterval = requestAnimationFrame(gameLoop);
        }

        function updateTime() {
            time--;
            document.getElementById('time').textContent = time;
            if (time <= 0) {
                endGame(score >= 1000);
            }
        }

        function spawnTarget() {
            if (!gameActive) return;

            const lanes = [1, 2, 3];
            const lane = lanes[Math.floor(Math.random() * lanes.length)];
            const shelf = document.getElementById(`shelf-${lane}`);

            // 50% chance correct
            const isCorrect = Math.random() > 0.5;
            let era, text;

            if (isCorrect) {
                era = currentEra;
                text = DB[currentEra][Math.floor(Math.random() * DB[currentEra].length)];
            } else {
                const eras = Object.keys(DB).filter(e => e !== currentEra);
                era = eras[Math.floor(Math.random() * eras.length)];
                text = DB[era][Math.floor(Math.random() * DB[era].length)];
            }

            // Fixed Target Image
            const targetImage = "img/diana.png";

            const el = document.createElement('div');
            el.className = 'target';
            el.style.zIndex = "100"; // Force on top

            // Image with fallback handling
            el.innerHTML = `<img src="${targetImage}" class="target-img" draggable="false" alt="Diana" onerror="console.error('Img Load Error'); this.style.display='none'; this.parentElement.style.backgroundColor='red';"><div class="target-label">${text}</div>`;

            // Randomize direction
            const direction = Math.random() > 0.5 ? 1 : -1;
            const startX = direction === 1 ? -150 : shelf.clientWidth + 150; // Increased buffer

            el.style.left = startX + 'px';
            el.style.bottom = '10px'; // Adjusted vertical position

            shelf.appendChild(el);

            targets.push({
                element: el,
                x: startX,
                y: 0,
                speed: (Math.random() * 2 + 2) * direction,
                isCorrect: isCorrect,
                active: true
            });
        }

        function gameLoop() {
            if (!gameActive) return;

            targets.forEach((t, i) => {
                if (!t.active) return;

                t.x += t.speed;
                t.element.style.left = t.x + 'px';

                // Remove if out of bounds
                const shelfWidth = document.getElementById('range').clientWidth;
                if ((t.speed > 0 && t.x > shelfWidth + 100) || (t.speed < 0 && t.x < -100)) {
                    t.element.remove();
                    t.active = false;
                    // Penalty for missing correct target? Not in spec, but "perds combo" mentioned.
                    // For simplicity, no penalty for missing, only for wrong shots.
                }
            });

            // Cleanup inactive targets
            targets = targets.filter(t => t.active);

            requestAnimationFrame(gameLoop);
        }

        function shoot(x, y) {
            if (ammo <= 0) {
                playSound('empty');
                document.getElementById('reload-btn').style.display = 'block';
                return;
            }

            ammo--;
            updateAmmo();
            playSound('shot');

            // Check collision
            // We need to check collision with DOM elements since they are moving
            // Use document.elementFromPoint? No, that might hit overlay or other things.
            // Better to iterate targets and check rects.

            let hit = false;

            // Iterate backwards to hit top-most if overlap (though shelves separate them vertically)
            for (let i = targets.length - 1; i >= 0; i--) {
                const t = targets[i];
                const rect = t.element.getBoundingClientRect();

                if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
                    hitTarget(t);
                    hit = true;
                    break; // Only hit one
                }
            }
        }

        function hitTarget(target) {
            target.active = false;

            if (target.isCorrect) {
                score += 50;
                playSound('hit');
                // Visual effect
                target.element.style.transform = "scale(0) rotate(360deg)";
                setTimeout(() => target.element.remove(), 200);
            } else {
                lives--;
                playSound('break');
                target.element.style.filter = "grayscale(100%)";
                target.element.innerHTML = "❌";
                setTimeout(() => target.element.remove(), 500);
            }

            updateHUD();
            checkGameOver();
        }

        function reloadGun() {
            ammo = 6;
            updateAmmo();
            playSound('reload');
            document.getElementById('reload-btn').style.display = 'none';
        }

        function updateAmmo() {
            const bullets = document.querySelectorAll('.bullet');
            bullets.forEach((b, i) => {
                if (i < ammo) b.classList.remove('empty');
                else b.classList.add('empty');
            });
        }

        function updateHUD() {
            document.getElementById('score').textContent = score;
            document.getElementById('lives').textContent = lives;
        }

        function checkGameOver() {
            if (lives <= 0) {
                endGame(false);
            } else if (score >= 1000 && time > 0) {
                // Win immediately upon reaching target
                endGame(true);
            }
        }

        function endGame(win) {
            gameActive = false;
            clearInterval(spawnInterval);
            clearInterval(timerInterval);
            cancelAnimationFrame(gameLoopInterval);

            const overlay = document.getElementById('feedback-overlay');
            const title = document.getElementById('end-title');
            const msg = document.getElementById('end-msg');

            overlay.style.display = 'flex';

            if (win) {
                title.textContent = "PREMI GROS!";
                title.style.color = "var(--gold)";
                msg.textContent = `Has aconseguit ${score} punts! Eres un franctirador històric.`;
            } else {
                title.textContent = "GAME OVER";
                title.style.color = "red";
                msg.textContent = "T'has quedat sense vides o temps. Torna a provar!";
            }
        }

    </script>
</body>

</html>
