<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ink Master Històric</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rye&family=Metal+Mania&family=Roboto:wght@400;700&display=swap');

        :root {
            --neon-pink: #d32f2f;
            /* Blood Red */
            --neon-blue: #ffc107;
            /* Gold/Brass */
            --skin: #e0ac69;
            --ink-black: #1a1a1a;
            --scroll-bg: #f5e6ca;
            /* Parchment color */
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            background-color: #111;
            color: white;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        #game-container {
            width: 100%;
            height: 100%;
            max-width: 1000px;
            position: relative;
            background: url('img/fons.jpg') no-repeat center center;
            background-size: cover;
            border: 5px solid #333;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Start Screen */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            text-align: center;
        }

        h1 {
            font-family: 'Rye', serif;
            /* Tattoo Style Font */
            font-size: 5rem;
            color: var(--neon-pink);
            margin-bottom: 20px;
            text-shadow: 3px 3px 0 #000, 0 0 20px var(--neon-pink);
            letter-spacing: 2px;
        }

        .era-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 40px;
        }

        .btn-era {
            background: #222;
            border: 2px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 15px 30px;
            font-size: 1.4rem;
            font-family: 'Rye', serif;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .btn-era:hover {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 20px var(--neon-blue);
            transform: scale(1.05);
        }

        /* Completed Era Button */
        .btn-era.completed {
            border-color: #2ecc71;
            color: #2ecc71;
            box-shadow: 0 0 10px #2ecc71;
        }

        .btn-era.completed::after {
            content: ' ✓';
        }

        /* Studio Interface */
        #studio {
            flex: 1;
            display: flex;
            flex-direction: row;
            /* Side by side layout */
            padding: 20px;
            position: relative;
            background: rgba(0, 0, 0, 0.5);
            gap: 20px;
            overflow: hidden;
            /* Prevent body scroll */
        }

        /* VOLUME SLIDER */
        #sound-controls {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 5px 10px;
            border-radius: 5px;
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
        }

        #volume-slider {
            width: 100px;
            cursor: pointer;
        }

        #client-area {
            flex: 2;
            /* Takes 2/3 of space */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            height: 100%;
        }

        #client-img {
            max-height: 80%;
            max-width: 90%;
            filter: drop-shadow(0 0 20px rgba(0, 0, 0, 0.5));
            pointer-events: none;
        }

        #skin-zone {
            position: absolute;
            width: 250px;
            height: 250px;
            /* Transparent trigger zone over the skin image */
            /* background: rgba(255, 0, 0, 0.2); Debug */
            top: 55%;
            /* Adjusted for the new layout image position */
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* The tattooed image inside skin zone */
        #skin-zone img {
            max-width: 100%;
            max-height: 100%;
            filter: drop-shadow(2px 2px 2px rgba(0, 0, 0, 0.5));
        }

        /* BANNER / SCROLL STYLE */
        #bubble {
            margin-bottom: 25px;
            background: var(--scroll-bg);
            color: #3e3e3e;
            padding: 15px 40px;
            border-radius: 2px;
            font-family: 'Rye', serif;
            font-size: 1.5rem;
            max-width: 80%;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
            z-index: 10;
            position: relative;
            border: 2px solid #5d4037;
            /* Scroll ends illusion */
        }

        #bubble::before,
        #bubble::after {
            content: '';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 80%;
            background: #5d4037;
            z-index: -1;
        }

        #bubble::before {
            left: -10px;
            border-radius: 5px 0 0 5px;
        }

        #bubble::after {
            right: -10px;
            border-radius: 0 5px 5px 0;
        }

        #flash-sheet {
            flex: 1;
            /* Takes 1/3 of space */
            height: 100%;
            background: rgba(10, 10, 10, 0.9);
            border-left: 4px double var(--neon-pink);
            border-radius: 0;
            display: flex;
            flex-direction: column;
            /* Vertical list */
            align-items: center;
            justify-content: flex-start;
            gap: 20px;
            padding: 20px;
            overflow-y: auto;
            /* Scroll if many options */
        }

        .stencil {
            width: 90%;
            min-height: 150px;
            /* Fixed height for consistency */
            border: 2px solid #333;
            display: flex;
            flex-direction: row;
            /* Horizontal stencil card */
            align-items: center;
            justify-content: flex-start;
            cursor: grab;
            background: #fffdf0;
            /* Paper color */
            transition: transform 0.2s;
            padding: 10px;
            gap: 15px;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
        }

        .stencil:hover {
            transform: scale(1.02) rotate(-1deg);
            border-color: var(--neon-pink);
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.5);
        }

        .stencil:active {
            cursor: grabbing;
        }

        .stencil-img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            filter: contrast(1.1) sepia(0.2);
        }

        .stencil-label {
            font-family: 'Rye', serif;
            font-size: 1.1rem;
            color: #333;
            font-weight: normal;
            flex: 1;
        }

        #hud {
            position: absolute;
            top: 10px;
            right: 15px;
            font-family: 'Rye', cursive;
            font-size: 1.8rem;
            color: var(--neon-blue);
            z-index: 10;
            text-shadow: 2px 2px 0 #000;
        }

        /* Feedback Overlay */
        #feedback-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
            display: none;
            color: white;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        /* Tattoo applied style */
        .tattoo-applied {
            mix-blend-mode: multiply;
            /* Make it look like ink on skin */
            opacity: 0.9;
        }
    </style>

    <!-- INICIO_AUTO_ZOOM_ANTIGRAVITY -->
    <script>
        function autoEscalar() {
            const anchoDiseno = 1920; 
            const escala = window.innerWidth / anchoDiseno;
            if (escala < 1) {
                document.body.style.zoom = escala;
            } else {
                document.body.style.zoom = 1;
            }
        }
        window.addEventListener('resize', autoEscalar);
        window.addEventListener('DOMContentLoaded', autoEscalar);
    </script>
    <!-- FIN_AUTO_ZOOM_ANTIGRAVITY -->

</head>

<body>

    <div id="game-container">

        <div id="sound-controls">
            <span>🎵</span>
            <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.5">
        </div>

        <audio id="bg-music" loop>
            <source src="audio/Midnight Ink Boogie.m4a" type="audio/mpeg">
        </audio>

        <!-- Start Screen -->
        <div id="start-screen">
            <h1>INK MASTER HISTÒRIC</h1>
            <p
                style="font-size: 1.4rem; color: #e0ac69; font-family: 'Rye', serif; max-width: 600px; margin: 0 auto 30px auto;">
                Tria una època i completa <strong>5 tatuatges</strong> correctes.<br>
                Si comets <strong>3 errors</strong>, seràs acomiadat!
            </p>
            <div class="era-grid">
                <button class="btn-era" id="btn-edat_mitjana" data-era="edat_mitjana">Edat Mitjana</button>
                <button class="btn-era" id="btn-renaixement" data-era="renaixement">Renaixement</button>
                <button class="btn-era" id="btn-barroc" data-era="barroc">Barroc</button>
                <button class="btn-era" id="btn-classicisme" data-era="classicisme">Classicisme</button>
                <button class="btn-era" id="btn-romanticisme" data-era="romanticisme">Romanticisme</button>
                <button class="btn-era" id="btn-segle_xx" data-era="segle_xx">Segle XX</button>
            </div>
        </div>

        <!-- Studio -->
        <div id="studio" class="hidden">
            <div id="hud">
                TATTOOS: <span id="score">0</span>/5 | ERRORS: <span id="fails">0</span>/3
            </div>

            <div id="client-area">
                <div id="bubble">...</div>
                <!-- Using uploaded skin base -->
                <img id="client-img" src="img/pell.png" alt="Client Skin">
                <div id="skin-zone"></div>
            </div>

            <div id="flash-sheet">
                <!-- Stencils injected here -->
            </div>
        </div>

        <!-- Feedback Overlay -->
        <div id="feedback-overlay">
            <h2 id="end-title"></h2>
            <p id="end-msg"></p>
            <button class="btn-era" id="btn-restart">TORNAR AL MENÚ</button>
        </div>
    </div>

    <script>
        // --- DATA ---
        // Mapping all assets to eras. 
        // req: The client's request text.
        // img: filename of the correct tattoo.
        // label: display name of the tattoo.

        const DB_FULL = {
            edat_mitjana: [
                { id: "monjo", label: "Cant Gregorià", img: "img/monjo.png", req: "Vull un monjo pietós per recordar els cants antics." },
                { id: "neumes", label: "Neumes", img: "img/neumes.png", req: "Tatua'm aquelles notes quadrades antigues." },
                { id: "trobador", label: "Trobador", img: "img/trobador.png", req: "Soc un poeta de l'amor cortès. Vull un llaüt." },
                { id: "monodia", label: "Monodia", img: "img/monodia.png", req: "Una sola línia melòdica, sense harmonies. Simple." }
            ],
            renaixement: [
                { id: "polifonia", label: "Polifonia", img: "img/polifonia.png", req: "Vull representar moltes veus cantant juntes." },
                { id: "llaut", label: "Llaüt", img: "img/llaut.png", req: "L'instrument més popular de la meva època." },
                { id: "madrigal", label: "Madrigal", img: "img/madrigal.png", req: "Un drama musical profà, màscares i passió." },
                { id: "impremta", label: "Impremta", img: "img/impremta.png", req: "La màquina que va canviar la difusió de la música." }
            ],
            barroc: [
                { id: "clave", label: "Clavicèmbal", img: "img/clave.png", req: "El teclat que sona puntejant les cordes." },
                { id: "baix", label: "Baix Continu", img: "img/baixcontinu.png", req: "La base sòlida de tota l'orquestra barroca." },
                { id: "fuga", label: "Fuga", img: "img/fuga.png", req: "Una melodia que es persegueix a si mateixa." },
                { id: "vivaldi", label: "Vivaldi", img: "img/vivaldi.png", req: "Les quatre estacions en un violí." }
            ],
            classicisme: [
                { id: "mozart", label: "Mozart", img: "img/mozart.png", req: "Un geni nen, una llegenda de Viena." },
                { id: "piano", label: "Piano", img: "img/piano.png", req: "L'instrument que va substituir el clavicèmbal." },
                { id: "simfonia", label: "Simfonia", img: "img/simofnia.png", req: "Estructura perfecta, com una columna grega." }, // Filename has typo simofnia
                { id: "clarinet", label: "Clarinet", img: "img/clarient.png", req: "L'instrument de vent preferit de Mozart." }   // Filename has typo clarient
            ],
            romanticisme: [
                { id: "wagner", label: "Wagner", img: "img/wagner.png", req: "Vull l'èpica de les Valquíries!" },
                { id: "lied", label: "Lied", img: "img/lied.png", req: "Poesia i música íntima, una rosa i una ploma." },
                { id: "chopin", label: "Chopin", img: "img/chopin.png", req: "El piano del romanticisme, pur sentiment." },
                { id: "passio", label: "Passió", img: "img/passio.png", req: "Trencar les normes amb una tempesta d'emocions." }
            ],
            segle_xx: [
                { id: "atonal", label: "Atonalisme", img: "img/atonalitat.png", req: "Trenca la tonalitat! Vull caos geomètric." },
                { id: "jazz", label: "Jazz", img: "img/jazz.png", req: "Swing, improvisació i un saxo daurat." },
                { id: "electro", label: "Electrònica", img: "img/electronica.png", req: "La música del futur, ones i sintetitzadors." },
                { id: "stravinsky", label: "Stravinsky", img: "img/stravinsky.png", req: "Ritmes primitius que causen escàndol." }
            ]
        };

        // --- GAME STATE ---
        let currentEra = null;
        let score = 0;
        let fails = 0;
        let currentTask = null;
        let isTattooing = false;
        let completedEras = []; // Track completed eras

        // Music logic
        const bgMusic = document.getElementById('bg-music');
        const volSlider = document.getElementById('volume-slider');
        bgMusic.volume = 0.5;
        volSlider.addEventListener('input', (e) => bgMusic.volume = e.target.value);

        // --- AUDIO FX ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'buzz') {
                // Correct: Satisfying coil machine buzz
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(80, now);
                osc.frequency.linearRampToValueAtTime(60, now + 0.5);
                gainNode.gain.setValueAtTime(0.15, now);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);

                // Add a "ding" harmony
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(523.25, now); // C5
                gain2.gain.setValueAtTime(0.1, now);
                gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc2.start(now);
                osc2.stop(now + 0.5);

            } else if (type === 'scratch') {
                // Error: Harsh noise
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(50, now + 0.3);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        // --- GAME LOGIC ---
        // Setup buttons
        document.querySelectorAll('.btn-era').forEach(btn => {
            if (btn.id === 'btn-restart') return; // Skip logic for restart button
            btn.addEventListener('click', () => {
                currentEra = btn.dataset.era;
                if (completedEras.includes(currentEra)) {
                    // Optional: maybe ask if they want to replay? For now just let them replay.
                }
                startGame();
            });
        });

        document.getElementById('btn-restart').addEventListener('click', () => {
            document.getElementById('feedback-overlay').style.display = 'none';
            document.getElementById('studio').classList.add('hidden');
            document.getElementById('start-screen').style.display = 'flex';
            updateEraButtons();
        });

        function updateEraButtons() {
            completedEras.forEach(era => {
                const btn = document.getElementById(`btn-${era}`);
                if (btn) btn.classList.add('completed');
            });
        }

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('studio').classList.remove('hidden');
            bgMusic.play().catch(e => console.log("Audio play prevented"));

            score = 0;
            fails = 0;
            updateHUD();
            nextClient();

            // Setup Drop zone (remove old listener to avoid duplicates if re-running script? No, replace content handles text, but keeping logic clean)
            // Ideally we check if listener exists, but simpler to just re-attach or ensure elements are static.
            // Elements are static in DOM, listeners added once? No, this script runs once. OK.
        }

        // Ensure manual listener setup one time or cleaner structure. 
        // We will just set ondrop attribute or use logic outside. 
        // Better:
        const zone = document.getElementById('skin-zone');
        zone.ondragover = e => e.preventDefault();
        zone.ondrop = handleDrop;

        function nextClient() {
            if (score >= 5) {
                endGame(true);
                return;
            }

            isTattooing = false;
            document.getElementById('skin-zone').innerHTML = ''; // Clear previous tattoo

            // Randomize logic
            const eraPool = DB_FULL[currentEra];
            const target = eraPool[Math.floor(Math.random() * eraPool.length)];

            currentTask = target;
            document.getElementById('bubble').textContent = currentTask.req;

            // Setup Flash Sheet (All 4 options of the era)
            const sheet = document.getElementById('flash-sheet');
            sheet.innerHTML = '';

            let opts = [...eraPool];
            opts.sort(() => Math.random() - 0.5);

            opts.forEach(opt => {
                const el = document.createElement('div');
                el.className = 'stencil';
                el.draggable = true;
                el.innerHTML = `
                    <img class="stencil-img" src="${opt.img}" draggable="false">
                    <div class="stencil-label">${opt.label}</div>
                `;

                el.addEventListener('dragstart', e => {
                    e.dataTransfer.setData('text/plain', JSON.stringify(opt));
                });

                sheet.appendChild(el);
            });
        }

        function handleDrop(e) {
            if (isTattooing) return;
            e.preventDefault();

            const data = JSON.parse(e.dataTransfer.getData('text/plain'));
            isTattooing = true;

            const zone = document.getElementById('skin-zone');

            if (data.id === currentTask.id) {
                // Correct
                playSound('buzz');
                zone.innerHTML = `<img src="${data.img}" class="tattoo-applied">`;
                score++;
                updateHUD();
                setTimeout(nextClient, 1500);
            } else {
                // Wrong
                playSound('scratch');
                // Could show a red X or the wrong tattoo distorted
                zone.innerHTML = `<img src="${data.img}" class="tattoo-applied" style="filter: grayscale(100%) contrast(200%) sepia(100%) hue-rotate(-50deg);">`;
                fails++;
                updateHUD();

                if (fails >= 3) {
                    setTimeout(() => endGame(false), 1500);
                } else {
                    setTimeout(nextClient, 1500);
                }
            }
        }

        function updateHUD() {
            document.getElementById('score').textContent = score;
            document.getElementById('fails').textContent = fails;
        }

        function endGame(win) {
            const overlay = document.getElementById('feedback-overlay');
            const title = document.getElementById('end-title');
            const msg = document.getElementById('end-msg');

            overlay.style.display = 'flex';

            if (win) {
                title.textContent = "ÈPOCA COMPLETADA!";
                title.style.color = "#2ecc71";
                msg.textContent = "Has dominat l'estil d'aquesta era.";
                if (!completedEras.includes(currentEra)) {
                    completedEras.push(currentEra);
                }
            } else {
                title.textContent = "ESTUDI TANCAT";
                title.style.color = "red";
                msg.textContent = "Massa errors. Els clients han marxat.";
            }
        }

    </script>
</body>

</html>
