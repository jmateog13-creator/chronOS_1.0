            <div className="h-full flex flex-col items-center justify-center bg-yellow-900/90 text-center relative overflow-hidden">
                <div className="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1533038590840-1cde6e668a91?q=80&w=1974&auto=format&fit=crop')] bg-cover bg-center opacity-30"></div>
                <motion.div
                    initial={{ y: 100, opacity: 0 }}
                    animate={{ y: 0, opacity: 1 }}
                    transition={{ duration: 1 }}
                    className="z-10 p-16 border-8 border-double border-yellow-400 bg-black/80 max-w-4xl"
                >
                    <h1 className="text-7xl text-yellow-400 font-bold mb-6 drop-shadow-[0_5px_5px_rgba(0,0,0,0.8)]">LLIBERTAT ACONSEGUIDA!</h1>
                    <p className="text-3xl text-stone-200 mb-10">Has guanyat la Rudis (Espada de Fusta). Ja no ets un esclau, ets un Ciutadà Lliure.</p>
                    <div className="text-6xl animate-bounce">🗡️</div>
                </motion.div>
            </div>
        );

        // --- GAME ENGINE ---

        function App() {
            const [gameState, setGameState] = useState('START'); // START, MENTOR, BOSS_INTRO, COMBAT, VICTORY, GAMEOVER, FINAL
            const [currentEpochIndex, setCurrentEpochIndex] = useState(0);

            // Player stats
            const [playerLives, setPlayerLives] = useState(3);

            // Enemy stats (reset each epoch)
            const [enemyLives, setEnemyLives] = useState(5);

            // Question Logic
            const [currentQuestion, setCurrentQuestion] = useState(null);
            const [shuffledOptions, setShuffledOptions] = useState([]);
            const [feedback, setFeedback] = useState(null); // 'HIT' or 'MISS' or null

            // Load current level data
            const levelData = GLADIATOR_DATA[currentEpochIndex];

            // Setup new question
            const pickQuestion = () => {
                const pool = levelData.pool;
                const q = pool[Math.floor(Math.random() * pool.length)];

                // Shuffle options
                const sentOptions = [...q.opts];
                for (let i = sentOptions.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [sentOptions[i], sentOptions[j]] = [sentOptions[j], sentOptions[i]];
                }

                setCurrentQuestion(q);
                setShuffledOptions(sentOptions);
                setFeedback(null);
            };

            const startGame = () => {
                const audio = document.getElementById('bg-music');
                if (audio) {
                    audio.play().catch(e => console.error("Audio failed to auto-play:", e));
                }
                setGameState('MENTOR');
            };

            const goToBossIntro = () => {
                setGameState('BOSS_INTRO');
            };

            const startCombat = () => {
                setPlayerLives(3);
                setEnemyLives(5);
                pickQuestion();
                setGameState('COMBAT');
            };

            const handleAnswer = (selected) => {
                if (feedback) return; // Prevent double clicks

                if (selected === currentQuestion.ok) {
                    // HIT
                    setFeedback('HIT');
                    setTimeout(() => {
                        const newEnemyLives = enemyLives - 1;
                        setEnemyLives(newEnemyLives);
                        if (newEnemyLives <= 0) {
                            handleWin();
                        } else {
                            pickQuestion();
                        }
                    }, 1500);
                } else {
                    // MISS
                    setFeedback('MISS');
                    setTimeout(() => {
                        const newPlayerLives = playerLives - 1;
                        setPlayerLives(newPlayerLives);
                        if (newPlayerLives <= 0) {
                            setGameState('GAMEOVER');
                        } else {
                            pickQuestion();
                        }
                    }, 1500);
                }
            };

            const handleWin = () => {
                if (currentEpochIndex >= GLADIATOR_DATA.length - 1) {
                    setGameState('FINAL');
                } else {
                    setGameState('VICTORY');
                }
            };

            const nextLevel = () => {
                setCurrentEpochIndex(prev => prev + 1);
                setGameState('MENTOR');
            };

            const retry = () => {
                setCurrentEpochIndex(0);
                setPlayerLives(3);
                setEnemyLives(5);
                setGameState('START');
            };

            // Renders
            return (
                <div className="w-full h-full font-serif relative">
                    {/* Persistent Audio Player */}
                    <audio id="bg-music" loop>
                        <source src="audio/music.mp3" type="audio/mpeg" />
                    </audio>

                    {/* Persistent Audio Control (Bottom Left) */}
                    <div className="absolute bottom-4 left-4 z-[100] flex items-center bg-black/50 p-2 rounded-lg gap-2 border border-stone-600">
                        <span className="text-xl">🔊</span>
                        <input type="range" min="0" max="1" step="0.1" defaultValue="0.5"
                            onChange={(e) => {
                                const audio = document.getElementById('bg-music');
                                if (audio) {
                                    audio.volume = e.target.value;
                                    if (audio.paused) audio.play();
                                }
                            }}
                            className="w-24 accent-yellow-500 cursor-pointer"
                        />
                    </div>

                    <AnimatePresence>
                        {gameState === 'START' && (
                            <motion.div key="start" className="absolute inset-0" exit={{ opacity: 0 }}>
                                <StartScreen onStart={startGame} />
                            </motion.div>
                        )}

                        {gameState === 'MENTOR' && (
                            <motion.div key="mentor" className="absolute inset-0" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}>
                                <MentorScreen mentorText={levelData.mentor} onReady={goToBossIntro} />
                            </motion.div>
                        )}

                        {gameState === 'BOSS_INTRO' && (
                            <motion.div key="boss_intro" className="absolute inset-0 z-40" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}>
                                <BossIntroScreen boss={levelData.boss} onFight={startCombat} />
                            </motion.div>
                        )}

                        {gameState === 'COMBAT' && (
                            <motion.div key="combat" className="absolute inset-0 flex flex-col bg-stone-900 overflow-hidden" initial={{ opacity: 0 }} animate={{ opacity: 1 }}>
                                {/* Background based on epoch (all use fons.jpg as requested) */}
                                <div className="absolute inset-0 bg-[url('img/fons.jpg')] bg-cover bg-center opacity-40"></div>

                                <GladiatorHUD
                                    playerLives={playerLives}
                                    enemyLives={enemyLives}
                                    enemyMaxLives={5}
                                    enemyName={levelData.boss.name}
                                />

                                {/* Main Combat Area */}
                                <div className="flex-1 z-20 flex flex-col items-center justify-end pb-8 px-4 w-full max-w-5xl mx-auto relative">

                                    {/* Boss Figure (Absolute) */}
                                    <div className="absolute bottom-0 left-1/2 transform -translate-x-1/2 w-auto h-[90vh] z-0 flex items-end justify-center pointer-events-none">
                                        <img
                                            src={levelData.boss.image}
                                            alt="Boss"
                                            className="max-h-full w-auto object-contain drop-shadow-2xl"
                                        />
                                    </div>

                                    {/* Status Message / Taunt (Floating above boss) */}
                                    <div className="absolute top-20 left-0 right-0 z-10 flex justify-center pointer-events-none">
                                        <AnimatePresence mode="wait">
                                            {feedback === 'HIT' ? (
                                                <motion.div
                                                    key="hit"
                                                    initial={{ scale: 0.5, opacity: 0, y: 20 }}
                                                    animate={{ scale: 1.5, opacity: 1, y: 0 }}
                                                    exit={{ scale: 0.5, opacity: 0 }}
                                                    className="text-red-500 font-extrabold text-5xl bg-black/50 px-8 py-4 rounded-xl border-4 border-red-600 backdrop-blur-md shadow-[0_0_30px_rgba(220,38,38,0.8)]"
                                                >
                                                    HIT!
                                                </motion.div>
                                            ) : feedback === 'MISS' ? (
                                                <motion.div
                                                    key="miss"
                                                    initial={{ scale: 0.5, opacity: 0, y: 20 }}
                                                    animate={{ scale: 1.5, opacity: 1, y: 0 }}
                                                    exit={{ scale: 0.5, opacity: 0 }}
                                                    className="text-stone-300 font-extrabold text-5xl bg-black/50 px-8 py-4 rounded-xl border-4 border-stone-500 backdrop-blur-md"
                                                >
                                                    MISS!
                                                </motion.div>
                                            ) : (
                                                <div className="bg-black/60 text-white p-4 rounded-lg backdrop-blur-sm max-w-md text-center border border-stone-600">
                                                    <p className="text-xl italic">"{levelData.boss.intro}"</p>
                                                </div>
                                            )}
                                        </AnimatePresence>
                                    </div>

                                    {/* Question Box */}
                                    <div className="w-full bg-stone-900/95 border-2 border-yellow-700 p-6 shadow-[0_0_50px_rgba(0,0,0,0.8)] z-20 relative rounded-xl backdrop-blur-xl">
                                        <h3 className="text-xl md:text-2xl text-center text-yellow-100 font-bold mb-6 min-h-[4rem] flex items-center justify-center">
                                            {currentQuestion?.q}
                                        </h3>

                                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                            {shuffledOptions.map((opt, idx) => (
                                                <button
                                                    key={idx}
                                                    onClick={() => handleAnswer(opt)}
                                                    disabled={!!feedback}
                                                    className={`
                                                        py-4 px-6 text-lg font-bold border-2 transition-all transform
                                                        ${feedback
                                                            ? (opt === currentQuestion.ok
                                                                ? "bg-green-800 border-green-500 text-green-100 scale-105"
                                                                : (feedback === 'MISS' && opt !== currentQuestion.ok ? "bg-red-900/50 border-red-800 text-stone-500" : "bg-stone-700 border-stone-600 opacity-50"))
                                                            : "bg-stone-800 border-stone-600 hover:bg-stone-700 hover:border-yellow-600 hover:text-yellow-100 hover:scale-[1.02]"
                                                        }
                                                    `}
                                                >
                                                    {opt}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                </div>
                            </motion.div>
                        )}

                        {gameState === 'VICTORY' && (
                            <motion.div key="victory" className="absolute inset-0 z-50">
                                <VictoryScreen onNext={nextLevel} />
                            </motion.div>
                        )}

                        {gameState === 'GAMEOVER' && (
                            <motion.div key="gameover" className="absolute inset-0 z-50">
                                <GameOverScreen onRetry={retry} />
                            </motion.div>
                        )}

                        {gameState === 'FINAL' && (
                            <motion.div key="final" className="absolute inset-0 z-50" initial={{ opacity: 0 }} animate={{ opacity: 1, duration: 2 }}>
                                <FinalVictoryScreen />
                            </motion.div>
                        )}

                    </AnimatePresence>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
