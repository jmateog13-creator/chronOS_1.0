<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQUID CHRONOS: GLASS BRIDGE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Orbitron', sans-serif;
        }

        .pink-glow {
            text-shadow: 0 0 10px #FF0080;
            box-shadow: 0 0 20px #FF0080;
        }

        .green-glow {
            text-shadow: 0 0 10px #008C76;
            box-shadow: 0 0 20px #008C76;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.2s ease;
        }

        .glass-panel:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.8);
        }
    </style>
</head>

<body class="bg-[#242424] text-white h-screen overflow-hidden select-none">
    <div id="root"></div>
    <script type="text/babel" data-type="module">
        import { motion, AnimatePresence } from 'https://esm.sh/framer-motion@10.16.4';
        const { useState, useEffect, useMemo } = React;

        const BRIDGE_DATA = {
            "Edat Mitjana": [
                { q: "Textura principal?", left: "Monodia", right: "Polifonia", correct: "Monodia" },
                { q: "Qui escrivia música?", left: "Mozart", right: "Monjos", correct: "Monjos" },
                { q: "Instrument típic?", left: "Llaüt", right: "Piano", correct: "Llaüt" },
                { q: "Idioma del cant?", left: "Llatí", right: "Anglès", correct: "Llatí" },
                { q: "Nom de les notes?", left: "Guido d'Arezzo", right: "Beethoven", correct: "Guido d'Arezzo" },
                { q: "Sistema d'escriptura?", left: "Neumes", right: "Pentagrama", correct: "Neumes" },
                { q: "Músic profà?", left: "Trobador", right: "DJ", correct: "Trobador" },
                { q: "Cant religiós?", left: "Gregorià", right: "Òpera", correct: "Gregorià" },
                { q: "Ritme?", left: "Lliure (Cant Pla)", right: "Marcat", correct: "Lliure (Cant Pla)" },
                { q: "Lloc principal?", left: "Monestir", right: "Estadi", correct: "Monestir" }
            ],
            "Renaixement": [
                { q: "Gran invent?", left: "Impremta", right: "Internet", correct: "Impremta" },
                { q: "Textura reina?", left: "Polifonia", right: "Monodia", correct: "Polifonia" },
                { q: "Compositor espanyol?", left: "T.L. de Victoria", right: "Falla", correct: "T.L. de Victoria" },
                { q: "Forma vocal profana?", left: "Madrigal", right: "Sonata", correct: "Madrigal" },
                { q: "Centre del pensament?", left: "L'Home (Humanisme)", right: "Déu (Teocentrisme)", correct: "L'Home (Humanisme)" },
                { q: "Instrument de corda?", left: "Viola de mà", right: "Guitarra Elèctrica", correct: "Viola de mà" },
                { q: "La Reforma?", left: "Martí Luter", right: "El Papa", correct: "Martí Luter" },
                { q: "Mestre de la Polifonia?", left: "Palestrina", right: "Bach", correct: "Palestrina" },
                { q: "Grup vocal?", left: "Cor A Cappella", right: "Orquestra", correct: "Cor A Cappella" },
                { q: "Dansa cortesana?", left: "Pavana", right: "Techno", correct: "Pavana" }
            ],
            "Barroc": [
                { q: "Instrument de tecla?", left: "Piano", right: "Clavecí", correct: "Clavecí" },
                { q: "Compositor alemany?", left: "Bach", right: "Wagner", correct: "Bach" },
                { q: "Gènere teatral?", left: "Òpera", right: "Musical", correct: "Òpera" },
                { q: "Ritme?", left: "Mecànic", right: "Rubato", correct: "Mecànic" },
                { q: "Veus agudes homes?", left: "Castrati", right: "Tenors", correct: "Castrati" },
                { q: "Base harmònica?", left: "Baix Continu", right: "Acords Jazz", correct: "Baix Continu" },
                { q: "El capellà roig?", left: "Vivaldi", right: "Mozart", correct: "Vivaldi" },
                { q: "Dinàmica?", left: "Contrast (Fort/Fluix)", right: "Pla", correct: "Contrast (Fort/Fluix)" },
                { q: "Lloc de feina?", left: "Palau Reial", right: "Discoteca", correct: "Palau Reial" },
                { q: "Estètica?", left: "Ornamentada", right: "Minimalista", correct: "Ornamentada" }
            ],
            "Classicisme": [
                { q: "Estètica?", left: "Equilibri", right: "Caos", correct: "Equilibri" },
                { q: "Nou instrument?", left: "Clarinet", right: "Saxòfon", correct: "Clarinet" },
                { q: "Gran forma orquestral?", left: "Simfonia", right: "Poema Simfònic", correct: "Simfonia" },
                { q: "Ciutat musical?", left: "Viena", right: "Nova York", correct: "Viena" },
                { q: "Genius?", left: "Mozart", right: "Bach", correct: "Mozart" },
                { q: "Successor del Clavecí?", left: "Piano-Forte", right: "Orgue", correct: "Piano-Forte" },
                { q: "Agrupació de cambra?", left: "Quartet de Corda", right: "Big Band", correct: "Quartet de Corda" },
                { q: "Compositor pont?", left: "Beethoven", right: "Stravinsky", correct: "Beethoven" },
                { q: "Segle?", left: "XVIII (Llums)", right: "XX", correct: "XVIII (Llums)" },
                { q: "Melodia?", left: "Senzilla", right: "Complexa", correct: "Senzilla" }
            ],
            "Romanticisme": [
                { q: "Instrument rei?", left: "Piano", right: "Clavecí", correct: "Piano" },
                { q: "Motor creatiu?", left: "El Sentiment", right: "La Raó", correct: "El Sentiment" },
                { q: "Òpera èpica?", left: "Wagner", right: "Monteverdi", correct: "Wagner" },
                { q: "Tècnica?", left: "Virtuosisme", right: "Senzillesa", correct: "Virtuosisme" },
                { q: "Forma breu piano?", left: "Nocturn", right: "Simfonia", correct: "Nocturn" },
                { q: "Cançó alemanya?", left: "Lied", right: "Madrigal", correct: "Lied" },
                { q: "Poeta del piano?", left: "Chopin", right: "Palestrina", correct: "Chopin" },
                { q: "Temàtica?", left: "Amor i Mort", right: "Religió", correct: "Amor i Mort" },
                { q: "Orquestra?", left: "Gegant", right: "De Cambra", correct: "Gegant" },
                { q: "Moviment polític?", left: "Nacionalisme", right: "Globalització", correct: "Nacionalisme" }
            ],
            "Segle XX": [
                { q: "Harmonia?", left: "Atonalisme", right: "Tonalitat", correct: "Atonalisme" },
                { q: "Estil americà?", left: "Jazz", right: "Vals", correct: "Jazz" },
                { q: "So electrònic?", left: "Sintetitzador", right: "Orgue", correct: "Sintetitzador" },
                { q: "Compositor Rus?", left: "Stravinsky", right: "Txaikovski", correct: "Stravinsky" },
                { q: "Concepte?", left: "Silenci (Cage)", right: "Soroll (Rock)", correct: "Silenci (Cage)" },
                { q: "Revolució elèctrica?", left: "Guitarra Elèctrica", right: "Llaüt", correct: "Guitarra Elèctrica" },
                { q: "Nou mitjà?", left: "Cinema (BSO)", right: "Església", correct: "Cinema (BSO)" },
                { q: "Tècnica serial?", left: "Dodecafonisme", right: "Baix Continu", correct: "Dodecafonisme" },
                { q: "Estil juvenil?", left: "Rock & Roll", right: "Polifonia", correct: "Rock & Roll" },
                { q: "Ruptura total?", left: "Schönberg", right: "Mozart", correct: "Schönberg" }
            ]
        };

        const ERAS = Object.keys(BRIDGE_DATA);

        const IntroScreen = ({ onStart }) => (
            <div class="h-full flex flex-col items-center justify-center p-8 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]">
                <div class="border-4 border-[#FF0080] p-8 bg-black/80 pink-glow mb-8 text-center text-[#FF0080]">
                    <div class="text-4xl mb-4">○ △ □</div>
                    <h1 class="text-5xl md:text-7xl font-bold mb-2">SQUID CHRONOS</h1>
                    <p class="text-white text-xl uppercase tracking-[0.3em]">Glass Bridge</p>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                    {ERAS.map(era => (
                        <button
                            key={era}
                            onClick={() => onStart(era)}
                            class="bg-[#008C76]/20 border border-[#008C76] text-[#008C76] hover:bg-[#008C76] hover:text-white px-6 py-4 font-bold uppercase transition-all"
                        >
                            {era}
                        </button>
                    ))}
                </div>
            </div>
        );

        const GameScreen = ({ era, onGameOver, onWin, onBack }) => {
            const [step, setStep] = useState(0); // 0 to 9
            const questions = useMemo(() => BRIDGE_DATA[era], [era]);

            const handleChoice = (choiceText) => {
                const currentQ = questions[step];
                if (choiceText === currentQ.correct) {
                    // Correct - Ding & Advance
                    if (step < 9) {
                        setStep(prev => prev + 1);
                    } else {
                        onWin();
                    }
                } else {
                    // Wrong - Crash & Fail
                    onGameOver();
                }
            };

            const currentQ = questions[step];

            return (
                <div class="h-full flex flex-col relative bg-gradient-to-b from-[#111] to-[#000]">
                    {/* HUD */}
                    <div class="p-4 flex justify-between items-center bg-[#242424] border-b border-gray-700">
                        <div class="text-white text-lg font-bold">{era.toUpperCase()}</div>
                        <div class="flex items-center gap-4">
                            <div class="text-[#FF0080] text-3xl font-bold">{step + 1} <span class="text-sm text-gray-500">/ 10</span></div>
                            <button onClick={onBack} class="text-xs text-gray-500 hover:text-white">SORTIR</button>
                        </div>
                    </div>

                    {/* BRIDGE VISUAL SCENE */}
                    <div class="flex-grow flex flex-col items-center justify-center p-4 relative overflow-hidden">
                        {/* Perspective lines for bridge */}
                        <div class="absolute inset-0 pointer-events-none opacity-20 bg-[linear-gradient(90deg,transparent_49%,#fff_50%,transparent_51%)]"></div>

                        <div class="z-10 text-center mb-12">
                            <h2 class="text-3xl md:text-4xl font-bold text-white mb-8 bg-black/50 p-4 inline-block border-l-4 border-r-4 border-[#008C76]">{currentQ.q}</h2>
                        </div>

                        <div class="flex justify-center gap-8 md:gap-16 w-full max-w-4xl z-20">
                            {/* LEFT PANEL */}
                            <motion.button
                                whileHover={{ scale: 1.05 }}
                                whileTap={{ scale: 0.95 }}
                                onClick={() => handleChoice(currentQ.left)}
                                class="w-40 h-40 md:w-64 md:h-64 glass-panel rounded-lg flex items-center justify-center p-4"
                            >
                                <span class="text-xl md:text-2xl font-bold text-center">{currentQ.left}</span>
                            </motion.button>

                            {/* RIGHT PANEL */}
                            <motion.button
                                whileHover={{ scale: 1.05 }}
                                whileTap={{ scale: 0.95 }}
                                onClick={() => handleChoice(currentQ.right)}
                                class="w-40 h-40 md:w-64 md:h-64 glass-panel rounded-lg flex items-center justify-center p-4"
                            >
                                <span class="text-xl md:text-2xl font-bold text-center">{currentQ.right}</span>
                            </motion.button>
                        </div>

                        <div class="mt-12 text-[#008C76] text-sm animate-pulse tracking-widest text-center">
                            AVANÇA AMB CURA
                        </div>
                    </div>
                </div>
            );
        };

        const EndScreen = ({ type, onRestart }) => (
            <div class={`h-full flex flex-col items-center justify-center p-8 bg-black ${type === 'gameover' ? 'bg-red-900/20' : 'bg-green-900/20'}`}>
                <div class="text-6xl mb-6">
                    {type === 'gameover' ? '☠️' : '🏆'}
                </div>
                <h1 class={`text-5xl md:text-7xl font-bold mb-4 ${type === 'gameover' ? 'text-[#FF0080]' : 'text-[#008C76]'}`}>
                    {type === 'gameover' ? 'ELIMINAT' : 'VICTÒRIA'}
                </h1>
                <p class="text-white text-xl mb-8 opacity-70">
                    {type === 'gameover' ? 'El vidre s\'ha trencat sota els teus peus.' : 'Has creuat el pont amb seguretat.'}
                </p>
                <button
                    onClick={onRestart}
                    class="px-8 py-4 bg-white text-black font-bold text-xl hover:scale-105 transition-transform"
                >
                    {type === 'gameover' ? 'REINTENTAR' : 'TORNAR AL MENÚ'}
                </button>
            </div>
        );

        const App = () => {
            const [gameState, setGameState] = useState('intro');
            const [selectedEra, setSelectedEra] = useState(null);

            const startGame = (era) => {
                setSelectedEra(era);
                setGameState('playing');
            };

            const reset = () => {
                setGameState('intro');
                setSelectedEra(null);
            };

            return (
                <div class="h-full w-full">
                    {gameState === 'intro' && <IntroScreen onStart={startGame} />}
                    {gameState === 'playing' && (
                        <GameScreen
                            era={selectedEra}
                            onGameOver={() => setGameState('gameover')}
                            onWin={() => setGameState('win')}
                            onBack={reset}
                        />
                    )}
                    {(gameState === 'gameover' || gameState === 'win') && (
                        <EndScreen type={gameState} onRestart={reset} />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
