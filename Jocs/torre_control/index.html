<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torre de Control Musical</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        :root {
            --radar-green: #00ff00;
            --radar-bg: #001100;
            --alert-red: #ff0000;
            --text-color: #00ff00;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Share Tech Mono', monospace;
            background-color: var(--radar-bg);
            color: var(--text-color);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        #game-container {
            width: 100%;
            height: 100%;
            max-width: 1000px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: url('img/fons.jpg') no-repeat center center;
            background-size: cover;
            border: 2px solid var(--radar-green);
            box-shadow: 0 0 20px var(--radar-green);
            overflow: hidden;
        }

        /* Radar Grid */
        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(var(--radar-green) 1px, transparent 1px),
                linear-gradient(90deg, var(--radar-green) 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.1;
            pointer-events: none;
            z-index: 1;
        }

        .radar-sweep {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            background: conic-gradient(from 0deg, transparent 0deg, rgba(0, 255, 0, 0.1) 60deg, transparent 60deg);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: sweep 4s infinite linear;
            pointer-events: none;
            z-index: 2;
        }

        @keyframes sweep {
            from {
                transform: translate(-50%, -50%) rotate(0deg);
            }

            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        /* Start Screen */
        #start-screen {
            background: rgba(0, 20, 0, 0.9);
            padding: 2rem;
            border: 2px solid var(--radar-green);
            text-align: center;
            z-index: 10;
            max-width: 600px;
        }

        h1 {
            font-size: 3rem;
            margin: 0 0 1rem 0;
            text-shadow: 0 0 10px var(--radar-green);
        }

        .sector-btn {
            background: transparent;
            color: var(--radar-green);
            border: 1px solid var(--radar-green);
            padding: 1rem 2rem;
            font-size: 1.2rem;
            font-family: 'Share Tech Mono', monospace;
            cursor: pointer;
            margin: 10px;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .sector-btn:hover {
            background: var(--radar-green);
            color: black;
            box-shadow: 0 0 15px var(--radar-green);
        }

        /* Game Interface */
        #game-interface {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
        }

        #hud {
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.5);
            font-size: 1.5rem;
            border-bottom: 1px solid var(--radar-green);
        }

        #airspace {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        /* Runways */
        #runways-container {
            height: 150px;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            padding-bottom: 20px;
            background: linear-gradient(to bottom, transparent, rgba(0, 50, 0, 0.8));
            border-top: 1px solid var(--radar-green);
        }

        .runway {
            width: 200px;
            height: 120px;
            border: 2px dashed var(--radar-green);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            background: rgba(0, 20, 0, 0.5);
            transition: all 0.3s;
            position: relative;
        }

        .runway.highlight {
            background: rgba(0, 255, 0, 0.2);
            box-shadow: 0 0 20px var(--radar-green);
        }

        /* Planes */
        .plane {
            position: absolute;
            width: 160px;
            height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: grab;
            transition: transform 0.1s;
            z-index: 10;
            user-select: none;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        .plane:active {
            cursor: grabbing;
            transform: scale(1.1);
        }

        .plane-icon {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transform: rotate(180deg);
            mix-blend-mode: screen;
            /* Removes black background box, cleaner look */
        }

        .plane-label {
            background: black;
            border: 1px solid var(--radar-green);
            padding: 2px 5px;
            font-size: 0.8rem;
            margin-top: 5px;
            white-space: nowrap;
        }

        .plane.alert .plane-icon {
            filter: drop-shadow(0 0 5px var(--alert-red));
            color: var(--alert-red);
        }

        .plane.alert .plane-label {
            border-color: var(--alert-red);
            color: var(--alert-red);
        }

        /* Feedback Overlay */
        #feedback-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            display: none;
        }

        #feedback-msg {
            font-size: 3rem;
            margin-bottom: 20px;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

    <div id="game-container">
        <div class="grid-overlay"></div>
        <div class="radar-sweep"></div>

        <!-- Start Screen -->
        <div id="start-screen">
            <h1>TORRE DE CONTROL</h1>
            <div class="instructions-box"
                style="margin-bottom: 2rem; text-align: left; font-size: 1.1rem; line-height: 1.5;">
                <p>1. 📡 <strong>RADAR ACTIVAT:</strong> Detectant trànsit musical entrant.</p>
                <p>2. ✈️ <strong>CLASSIFICA:</strong> Arrossega cada avió a la pista de la seva època.</p>
                <p>3. 💥 <strong>EVITA COL·LISIONS:</strong> No deixis que els avions creuïn la línia inferior.</p>
            </div>

            <div class="volume-control"
                style="margin-bottom: 2rem; display: flex; align-items: center; justify-content: center; gap: 10px;">
                <label for="volume-slider">VOLUME:</label>
                <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.5"
                    style="accent-color: var(--radar-green);">
            </div>

            <div id="sector-selection">
                <button class="sector-btn" data-sector="A">SECTOR A (E. MITJANA / RENAIXEMENT)</button>
                <button class="sector-btn" data-sector="B">SECTOR B (BARROC / CLASSICISME)</button>
                <button class="sector-btn" data-sector="C">SECTOR C (ROMANTICISME / S. XX)</button>
                <button class="sector-btn" data-sector="CAOS">SECTOR CAOS (MIX)</button>
            </div>
        </div>

        <!-- Game Interface -->
        <div id="game-interface" class="hidden">
            <div id="hud">
                <span>AVIONS: <span id="score">0</span>/15</span>
                <span style="color:var(--alert-red)">ACCIDENTS: <span id="lives">0</span>/3</span>
            </div>

            <div id="airspace">
                <!-- Planes spawn here -->
            </div>

            <div id="runways-container">
                <!-- Runways injected here -->
            </div>
        </div>

        <!-- Feedback Overlay -->
        <div id="feedback-overlay">
            <div id="feedback-msg"></div>
            <button class="sector-btn" onclick="location.reload()">TORNAR AL RADAR</button>
        </div>
    </div>

    <script>
        // --- DATA ---
        const DB = {
            edat_mitjana: ["Monodia", "Cant Gregorià", "Trobador", "Neumes", "Guido d'Arezzo", "Viola de Roda", "Ars Nova", "Leonin", "Perotin", "Llatí"],
            renaixement: ["Polifonia", "Humanisme", "Impremta", "Madrigal", "Palestrina", "Josquin", "Viola da Gamba", "Llaüt", "Coral", "Ensalada"],
            barroc: ["Baix Continu", "Clavecí", "Bach", "Vivaldi", "Händel", "Òpera", "Fuga", "Contrast", "Ornamentació", "Castrato"],
            classicisme: ["Mozart", "Haydn", "Beethoven", "Sonata", "Equilibri", "Clarinet", "Piano", "Simfonia", "Quartet", "Senzillesa"],
            romanticisme: ["Wagner", "Chopin", "Verdi", "Lied", "Rubato", "Passió", "Poema Simfònic", "Virtuosisme", "Tuba", "Nacionalisme"],
            segle_xx: ["Atonalitat", "Dodecafonisme", "Stravinsky", "John Cage", "Sintetitzador", "Jazz", "Minimalisme", "Soroll", "Aleatòria", "Electrònica"]
        };

        const SECTORS = {
            A: { eras: ["edat_mitjana", "renaixement"], names: ["EDAT MITJANA", "RENAIXEMENT"] },
            B: { eras: ["barroc", "classicisme"], names: ["BARROC", "CLASSICISME"] },
            C: { eras: ["romanticisme", "segle_xx"], names: ["ROMANTICISME", "SEGLE XX"] },
            CAOS: { eras: ["barroc", "romanticisme", "segle_xx"], names: ["BARROC", "ROMANTICISME", "SEGLE XX"] } // Example mix
        };

        // --- GAME STATE ---
        let currentSector = null;
        let score = 0;
        let lives = 0;
        let gameActive = false;
        let spawnRate = 3000;
        let fallSpeed = 1;
        let planeIdCounter = 0;
        let activePlanes = [];
        let spawnInterval = null;
        let gameLoopInterval = null;
        let bgMusic = null;

        // --- AUDIO ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'roger') {
                // Radio static burst
                const bufferSize = audioCtx.sampleRate * 0.5;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                noise.connect(gainNode);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.2);
                noise.start(now);
            } else if (type === 'explosion') {
                // Low boom
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.exponentialRampToValueAtTime(10, now + 0.5);
                gainNode.gain.setValueAtTime(0.5, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'alarm') {
                // Siren
                osc.type = 'square';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.linearRampToValueAtTime(800, now + 0.2);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            }
        }

        // --- MUSIC ---
        function initAudio() {
            bgMusic = new Audio('audio/Echoes Over Terminal 9.m4a');
            bgMusic.loop = true;
            bgMusic.volume = 0.5;

            const slider = document.getElementById('volume-slider');
            if (slider) {
                slider.addEventListener('input', (e) => {
                    bgMusic.volume = e.target.value;
                });
            }
        }
        initAudio();

        // --- LOGIC ---
        document.querySelectorAll('.sector-btn').forEach(btn => {
            if (btn.parentElement.id === 'feedback-overlay') return;
            btn.addEventListener('click', () => {
                currentSector = SECTORS[btn.dataset.sector];
                startGame();
            });
        });

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-interface').classList.remove('hidden');

            if (audioCtx.state === 'suspended') audioCtx.resume();
            bgMusic.play();

            score = 0;
            lives = 0;
            spawnRate = 3000;
            fallSpeed = 0.5; // Initial speed
            gameActive = true;
            activePlanes = [];

            updateHUD();
            setupRunways();

            spawnInterval = setTimeout(spawnPlane, 1000);
            gameLoopInterval = requestAnimationFrame(gameLoop);
        }

        function setupRunways() {
            const container = document.getElementById('runways-container');
            container.innerHTML = '';

            currentSector.eras.forEach((era, index) => {
                const div = document.createElement('div');
                div.className = 'runway';
                div.textContent = currentSector.names[index];
                div.dataset.era = era;

                // Drop events
                div.addEventListener('dragover', e => {
                    e.preventDefault();
                    div.classList.add('highlight');
                });
                div.addEventListener('dragleave', () => div.classList.remove('highlight'));
                div.addEventListener('drop', e => {
                    e.preventDefault();
                    div.classList.remove('highlight');
                    const planeId = e.dataTransfer.getData('text/plain');
                    handleLanding(planeId, era);
                });

                container.appendChild(div);
            });
        }

        function spawnPlane() {
            if (!gameActive) return;

            // Pick random era from current sector
            const randomEra = currentSector.eras[Math.floor(Math.random() * currentSector.eras.length)];
            const concept = DB[randomEra][Math.floor(Math.random() * DB[randomEra].length)];

            const plane = document.createElement('div');
            plane.className = 'plane';
            plane.id = `plane-${planeIdCounter++}`;
            plane.draggable = true;

            // Random Plane Image
            const planeImgs = ['img/avio1.png', 'img/avio2.png', 'img/avio3.png'];
            const randomImg = planeImgs[Math.floor(Math.random() * planeImgs.length)];

            plane.innerHTML = `<img src="${randomImg}" class="plane-icon"><div class="plane-label">${concept}</div>`;

            // Random X position
            const maxX = document.getElementById('airspace').clientWidth - 160;
            plane.style.left = Math.random() * maxX + 'px';
            plane.style.top = '-60px';

            // Store data
            activePlanes.push({
                element: plane,
                era: randomEra,
                y: -60,
                speed: fallSpeed + (Math.random() * 0.2) // Slight variation
            });

            // Drag events
            plane.addEventListener('dragstart', e => {
                e.dataTransfer.setData('text/plain', plane.id);
                playSound('roger');
            });

            // Touch events for mobile
            plane.addEventListener('touchstart', handleTouchStart, { passive: false });
            plane.addEventListener('touchmove', handleTouchMove, { passive: false });
            plane.addEventListener('touchend', handleTouchEnd);

            document.getElementById('airspace').appendChild(plane);

            // Next spawn
            if (gameActive) {
                spawnInterval = setTimeout(spawnPlane, spawnRate);
            }
        }

        function gameLoop() {
            if (!gameActive) return;

            const airspaceHeight = document.getElementById('airspace').clientHeight;

            activePlanes.forEach((p, index) => {
                p.y += p.speed;
                p.element.style.top = p.y + 'px';

                // Alert if getting close to bottom
                if (p.y > airspaceHeight * 0.7) {
                    p.element.classList.add('alert');
                }

                // Crash if hits bottom
                if (p.y > airspaceHeight) {
                    crashPlane(index);
                }
            });

            if (gameActive) {
                requestAnimationFrame(gameLoop);
            }
        }

        function handleLanding(planeId, runwayEra) {
            const index = activePlanes.findIndex(p => p.element.id === planeId);
            if (index === -1) return;

            const planeObj = activePlanes[index];

            if (planeObj.era === runwayEra) {
                // Success
                score++;
                playSound('roger');

                // Increase difficulty
                if (score % 5 === 0) {
                    fallSpeed += 0.2;
                    spawnRate = Math.max(1000, spawnRate - 200);
                }
            } else {
                // Wrong runway
                lives++;
                playSound('alarm');
            }

            // Remove plane
            planeObj.element.remove();
            activePlanes.splice(index, 1);

            updateHUD();
            checkGameOver();
        }

        function crashPlane(index) {
            const planeObj = activePlanes[index];
            lives++;
            playSound('explosion');

            // Visual explosion
            planeObj.element.innerHTML = ""; // Clear content
            planeObj.element.style.backgroundImage = "url('img/explosion.jpg')";
            planeObj.element.style.backgroundSize = "contain";
            planeObj.element.style.transform = "scale(1.5)";
            setTimeout(() => planeObj.element.remove(), 500);

            activePlanes.splice(index, 1);
            updateHUD();
            checkGameOver();
        }

        function updateHUD() {
            document.getElementById('score').textContent = score;
            document.getElementById('lives').textContent = lives;
        }

        function checkGameOver() {
            if (lives >= 3) {
                endGame(false);
            } else if (score >= 15) {
                endGame(true);
            }
        }

        function endGame(win) {
            gameActive = false;
            clearTimeout(spawnInterval);
            cancelAnimationFrame(gameLoopInterval);
            bgMusic.pause();

            const overlay = document.getElementById('feedback-overlay');
            const msg = document.getElementById('feedback-msg');

            overlay.style.display = 'flex';

            if (win) {
                msg.textContent = "MISSIÓ COMPLETA! CEL SEGUR.";
                msg.style.color = "var(--radar-green)";
            } else {
                msg.textContent = "MAYDAY! MASSA ACCIDENTS.";
                msg.style.color = "var(--alert-red)";
            }
        }

        // Mobile Touch Logic
        let touchClone = null;
        let touchOffset = { x: 0, y: 0 };

        function handleTouchStart(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = this.getBoundingClientRect();
            touchOffset.x = touch.clientX - rect.left;
            touchOffset.y = touch.clientY - rect.top;

            touchClone = this.cloneNode(true);
            touchClone.style.position = 'fixed';
            touchClone.style.zIndex = 1000;
            touchClone.style.opacity = 0.8;
            document.body.appendChild(touchClone);

            moveTouchClone(touch);
            playSound('roger');
        }

        function handleTouchMove(e) {
            e.preventDefault();
            if (touchClone) {
                moveTouchClone(e.touches[0]);
            }
        }

        function handleTouchEnd(e) {
            if (touchClone) {
                const touch = e.changedTouches[0];
                const runways = document.querySelectorAll('.runway');
                let landed = false;

                runways.forEach(r => {
                    const rect = r.getBoundingClientRect();
                    if (touch.clientX >= rect.left && touch.clientX <= rect.right &&
                        touch.clientY >= rect.top && touch.clientY <= rect.bottom) {
                        handleLanding(this.id, r.dataset.era);
                        landed = true;
                    }
                });

                touchClone.remove();
                touchClone = null;
            }
        }

        function moveTouchClone(touch) {
            touchClone.style.left = (touch.clientX - touchOffset.x) + 'px';
            touchClone.style.top = (touch.clientY - touchOffset.y) + 'px';
        }

    </script>
</body>

</html>
