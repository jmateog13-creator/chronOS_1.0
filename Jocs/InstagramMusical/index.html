<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaMusic</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/search.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/activity.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- INICIO_AUTO_ZOOM_ANTIGRAVITY -->
    <script>
        function autoEscalar() {
            const anchoDiseno = 1920; 
            const escala = window.innerWidth / anchoDiseno;
            if (escala < 1) {
                document.body.style.zoom = escala;
            } else {
                document.body.style.zoom = 1;
            }
        }
        window.addEventListener('resize', autoEscalar);
        window.addEventListener('DOMContentLoaded', autoEscalar);
    </script>
    <!-- FIN_AUTO_ZOOM_ANTIGRAVITY -->

</head>

<body>
    <div id="app">
        <!-- Content will be injected here by JS -->
    </div>

    <nav class="bottom-nav">
        <a href="#" class="nav-item active" data-target="feed">
            <i class="fas fa-home"></i>
        </a>
        <a href="#" class="nav-item" data-target="search">
            <i class="fas fa-search"></i>
        </a>
        <a href="#" class="nav-item" data-target="add">
            <i class="far fa-plus-square"></i>
        </a>
        <a href="#" class="nav-item" data-target="activity">
            <i class="far fa-heart"></i>
        </a>
        <a href="#" class="nav-item" data-target="profile">
            <div class="nav-avatar">
                <img src="assets/avatars/bach.png" alt="Profile" id="nav-user-avatar">
            </div>
        </a>
    </nav>

    <!-- Scripts loaded in order for dependency management without modules -->
    <script src="js/data.js"></script>
    <script src="js/services/LikesService.js"></script>
    <script src="js/components/Post.js"></script>
    <script src="js/components/Feed.js"></script>
    <script src="js/components/Search.js"></script>
    <script src="js/components/Modal.js"></script>
    <script src="js/components/Activity.js"></script>
    <script src="js/components/Profile.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
