<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrossFit Musical</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Roboto:wght@400;700&display=swap');

        :root {
            --primary-color: #ff4757;
            --secondary-color: #2f3542;
            --accent-color: #eccc68;
            --text-color: #ffffff;
            --bg-color: #1e272e;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            user-select: none;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-image: url('img/bg.jpg');
            background-size: cover;
            background-position: center;
        }

        #game-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 0;
        }

        /* Start Screen */
        #start-screen {
            text-align: center;
            z-index: 10;
            background: rgba(0, 0, 0, 0.85);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.7);
            max-width: 900px;
            width: 90%;
            border: 2px solid var(--primary-color);
        }

        h1 {
            font-family: 'Black Ops One', cursive;
            font-size: 4.5rem;
            color: var(--primary-color);
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            text-shadow: 4px 4px 0px #000;
        }

        p.subtitle {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            color: var(--accent-color);
        }

        .era-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.2rem;
            margin-top: 2rem;
        }

        .btn-era {
            background: var(--secondary-color);
            border: 2px solid var(--accent-color);
            color: var(--text-color);
            padding: 1.5rem;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 12px;
            text-transform: uppercase;
        }

        .btn-era:hover {
            background: var(--accent-color);
            color: var(--secondary-color);
            transform: scale(1.05) rotate(1deg);
        }

        /* Game HUD */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            z-index: 5;
            font-family: 'Black Ops One', cursive;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.8), transparent);
        }

        .hud-stats {
            display: flex;
            gap: 40px;
            font-size: 2rem;
            text-shadow: 2px 2px 0 #000;
        }

        #reps-counter {
            color: var(--accent-color);
        }

        #lives-counter {
            color: var(--primary-color);
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 15px;
            pointer-events: auto;
        }

        .volume-control span {
            font-size: 1.5rem;
        }

        #bgm-slider {
            width: 120px;
            accent-color: var(--primary-color);
            cursor: pointer;
        }

        /* Game Area */
        #game-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .athlete {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: 700px;
            background-image: url('img/forçut.png');
            background-repeat: no-repeat;
            background-position: bottom center;
            background-size: contain;
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.5));
        }

        .athlete.lifting {
            transform: translateX(-50%) translateY(-30px) scale(1.05);
        }

        .disc {
            position: absolute;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: radial-gradient(circle, #444 30%, #111 100%);
            border: 6px solid #666;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: 800;
            font-size: 1.1rem;
            padding: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
            cursor: pointer;
            user-select: none;
            z-index: 2;
            transition: transform 0.1s;
            color: #ddd;
            text-shadow: 2px 2px 2px black;
            text-transform: uppercase;
        }

        .disc:active {
            transform: scale(0.9);
        }

        .disc.correct {
            border-color: #2ecc71;
            box-shadow: 0 0 20px #2ecc71;
        }

        .disc.wrong {
            border-color: #e74c3c;
            box-shadow: 0 0 20px #e74c3c;
        }

        /* Feedback Effects */
        #damage-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 50%, rgba(255, 0, 0, 0.3) 100%);
            opacity: 0;
            pointer-events: none;
            z-index: 20;
            transition: opacity 0.2s;
        }

        /* End Screen */
        #end-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 30;
            text-align: center;
        }

        #end-title {
            font-family: 'Black Ops One', cursive;
            font-size: 5rem;
            margin-bottom: 1rem;
            text-shadow: 0 0 30px currentColor;
        }

        #end-message {
            font-size: 2.5rem;
            margin-bottom: 3rem;
        }

        .btn-restart {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 1.5rem 4rem;
            font-size: 2rem;
            font-family: 'Black Ops One', cursive;
            cursor: pointer;
            border-radius: 60px;
            transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(255, 71, 87, 0.3);
        }

        .btn-restart:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 30px rgba(255, 71, 87, 0.5);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

    <audio id="bgm" loop>
        <source src="audio/Iron Pulse.m4a" type="audio/mpeg">
    </audio>

    <div id="game-container">
        <!-- Start Screen -->
        <div id="start-screen">
            <h1>CrossFit Musical</h1>
            <p class="subtitle">Entrena el teu cervell musical! Aconsegueix 20 repeticions.</p>
            <div class="era-grid">
                <button class="btn-era" data-era="edat_mitjana">Edat Mitjana</button>
                <button class="btn-era" data-era="renaixement">Renaixement</button>
                <button class="btn-era" data-era="barroc">Barroc</button>
                <button class="btn-era" data-era="classicisme">Classicisme</button>
                <button class="btn-era" data-era="romanticisme">Romanticisme</button>
                <button class="btn-era" data-era="segle_xx">Segle XX</button>
            </div>
        </div>

        <!-- HUD -->
        <div id="hud" class="hidden">
            <div class="volume-control">
                <span>🔊</span>
                <input type="range" id="bgm-slider" min="0" max="1" step="0.1" value="0.5"
                    oninput="setVolume(this.value)">
            </div>
            <div class="hud-stats">
                <div id="reps-counter">REPS: <span id="reps">0</span>/20</div>
                <div id="lives-counter">ERRORS: <span id="lives">0</span>/3</div>
            </div>
        </div>

        <!-- Game Area -->
        <div id="game-area" class="hidden">
            <div class="athlete" id="athlete"></div>
            <!-- Discs will be spawned here -->
        </div>

        <!-- Damage Overlay -->
        <div id="damage-overlay"></div>

        <!-- End Screen -->
        <div id="end-screen">
            <h1 id="end-title"></h1>
            <p id="end-message"></p>
            <button class="btn-restart" onclick="location.reload()">TORNAR AL GIMNÀS</button>
        </div>
    </div>

    <script>
        // --- DATA ---
        const DB = {
            edat_mitjana: [
                "Cant Gregorià", "Monodia", "Neumes", "Guido d'Arezzo", "Trobador", "Joglar", "Cantigas", "Llibre Vermell", "Ars Nova", "Polifonia primitiva",
                "Organum", "Motet", "Missa", "Guillaume de Machaut", "Leonin", "Perotin", "Viola de roda", "Llaüt", "Flauta de bec", "Saltiri",
                "Sac de gemecs", "Dansa de la Mort", "Teocentrisme", "Feudalisme", "Monestir", "Còdex", "Cant pla", "Modes gregorians", "Textura monòdica", "Ritme lliure"
            ],
            renaixement: [
                "Polifonia", "Humanisme", "Impremta", "Josquin des Prez", "Palestrina", "Victoria", "Madrigal", "Villancico", "Ensalada", "Viola da gamba",
                "Llaüt", "Virginal", "Sacbutx", "Consort", "Reforma", "Contrareforma", "Concili de Trento", "Textura polifònica", "Imitació", "Homofonia",
                "Monteverdi", "Gabrieli", "Escola Veneciana", "Escola Romana", "Escola Flamenca", "Orlando di Lasso", "Juan del Encina", "Mateu Fletxa", "Cançoner", "Antropocentrisme"
            ],
            barroc: [
                "Baix Continu", "Opera", "Oratori", "Cantata", "Concert", "Suite", "Sonata", "Fuga", "Vivaldi", "Bach",
                "Händel", "Purcell", "Lully", "Clavecí", "Orgue", "Violí", "Castrati", "Teoria dels Afectes", "Contrast", "Ornamentació",
                "Dinàmica per terrasses", "Mecenatge", "Absolutisme", "Versalles", "Virtuosisme", "Stradivarius", "Toccata", "Preludi", "Coral", "Passió"
            ],
            classicisme: [
                "Sonata", "Simfonia", "Concert solista", "Quartet de corda", "Mozart", "Haydn", "Beethoven", "Clarinet", "Piano", "Orquestra Simfònica",
                "Il·lustració", "Racionalisme", "Equilibri", "Proporció", "Claredat", "Melodia acompanyada", "Forma Sonata", "Minuet", "Rondo", "Viena",
                "Escola de Mannheim", "Stamitz", "Gluck", "Reforma operística", "Òpera bufa", "Singspiel", "Música de cambra", "Societat de concerts", "Revolució Francesa", "Elegància"
            ],
            romanticisme: [
                "Lied", "Poema Simfònic", "Òpera verista", "Drama musical", "Wagner", "Verdi", "Chopin", "Liszt", "Schubert", "Schumann",
                "Brahms", "Berlioz", "Txaikovski", "Piano", "Orquestra gegant", "Saxòfon", "Tuba", "Nacionalisme", "Exotisme", "Individualisme",
                "Sentiment", "Passió", "Llibertat", "Virtuosisme", "Leitmotiv", "Bel Canto", "Gran Òpera", "Música programàtica", "Vals", "Nocturn"
            ],
            segle_xx: [
                "Impressionisme", "Expressionisme", "Dodecafonisme", "Serialisme", "Neoclassicisme", "Música Aleatòria", "Música Electrònica", "Música Concreta", "Minimalisme", "Jazz",
                "Rock", "Debussy", "Ravel", "Stravinsky", "Schoenberg", "Berg", "Webern", "Bartók", "Messiaen", "Stockhausen",
                "Cage", "Boulez", "Glass", "Reich", "Sintetitzador", "Theremin", "Guitarra elèctrica", "Atonalitat", "Poliritmia", "Sorollisme"
            ]
        };

        // --- GAME STATE ---
        let currentEra = null;
        let reps = 0;
        let errors = 0;
        let gameActive = false;
        let spawnInterval = null;
        let gameLoopId = null;
        let discs = [];
        let speedMultiplier = 1;

        // --- AUDIO ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function setVolume(val) {
            const bgm = document.getElementById('bgm');
            if (bgm) bgm.volume = val;
        }

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'hit') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'miss') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'lift') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'win') {
                const now = audioCtx.currentTime;
                [440, 554, 659, 880].forEach((freq, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.type = 'square';
                    o.frequency.value = freq;
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    g.gain.setValueAtTime(0.2, now + i * 0.1);
                    g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.3);
                    o.start(now + i * 0.1);
                    o.stop(now + i * 0.1 + 0.3);
                });
            }
        }

        // --- LOGIC ---
        document.querySelectorAll('.btn-era').forEach(btn => {
            btn.addEventListener('click', () => {
                currentEra = btn.dataset.era;
                startGame();
            });
        });

        function startGame() {
            // Audio bypass
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const bgm = document.getElementById('bgm');
            bgm.volume = document.getElementById('bgm-slider').value;
            bgm.play().catch(console.error);

            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('game-area').classList.remove('hidden');

            reps = 0;
            errors = 0;
            updateHUD();
            gameActive = true;
            discs = [];
            speedMultiplier = 1;

            spawnInterval = setInterval(spawnDisc, 1400);
            gameLoopId = requestAnimationFrame(gameLoop);
        }

        function spawnDisc() {
            if (!gameActive) return;

            const isCorrect = Math.random() > 0.45;
            let text;

            if (isCorrect) {
                const pool = DB[currentEra];
                text = pool[Math.floor(Math.random() * pool.length)];
            } else {
                const eras = Object.keys(DB).filter(e => e !== currentEra);
                const randomEra = eras[Math.floor(Math.random() * eras.length)];
                const pool = DB[randomEra];
                text = pool[Math.floor(Math.random() * pool.length)];
            }

            const disc = document.createElement('div');
            disc.className = 'disc';
            disc.textContent = text;
            disc.dataset.isCorrect = isCorrect;

            const x = Math.random() * (window.innerWidth - 140);
            const y = -140;

            const vx = (Math.random() - 0.5) * 5;
            const vy = (Math.random() * 2 + 2.5) * speedMultiplier;

            disc.style.left = x + 'px';
            disc.style.top = y + 'px';

            document.getElementById('game-area').appendChild(disc);

            discs.push({
                element: disc,
                x: x,
                y: y,
                vx: vx,
                vy: vy
            });

            disc.addEventListener('mousedown', (e) => {
                if (!gameActive) return;
                handleDiscClick(disc, isCorrect);
                e.preventDefault();
            });
        }

        function handleDiscClick(disc, isCorrect) {
            const index = discs.findIndex(d => d.element === disc);
            if (index > -1) {
                discs.splice(index, 1);
                disc.classList.add(isCorrect ? 'correct' : 'wrong');
                setTimeout(() => disc.remove(), 100);
            }

            if (isCorrect) {
                reps++;
                playSound('hit');
                playSound('lift');
                animateAthlete();
                speedMultiplier += 0.04;
                if (reps >= 20) winGame();
            } else {
                errors++;
                playSound('miss');
                triggerDamage();
                if (errors >= 3) loseGame();
            }
            updateHUD();
        }

        function animateAthlete() {
            const athlete = document.getElementById('athlete');
            athlete.classList.add('lifting');
            setTimeout(() => athlete.classList.remove('lifting'), 150);
        }

        function triggerDamage() {
            const overlay = document.getElementById('damage-overlay');
            overlay.style.opacity = 0.8;
            setTimeout(() => overlay.style.opacity = 0, 300);
        }

        function updateHUD() {
            document.getElementById('reps').textContent = reps;
            document.getElementById('lives').textContent = errors;
        }

        function gameLoop() {
            if (!gameActive) return;

            const containerH = window.innerHeight;
            const containerW = window.innerWidth;

            for (let i = discs.length - 1; i >= 0; i--) {
                const d = discs[i];
                d.x += d.vx;
                d.y += d.vy;

                if (d.x <= 0 || d.x >= containerW - 140) d.vx *= -1;

                if (d.y > containerH) {
                    d.element.remove();
                    discs.splice(i, 1);
                    continue;
                }

                d.element.style.left = d.x + 'px';
                d.element.style.top = d.y + 'px';
            }

            gameLoopId = requestAnimationFrame(gameLoop);
        }

        function endGame(win) {
            gameActive = false;
            clearInterval(spawnInterval);
            cancelAnimationFrame(gameLoopId);

            const bgm = document.getElementById('bgm');
            bgm.pause();

            const endScreen = document.getElementById('end-screen');
            const title = document.getElementById('end-title');
            const msg = document.getElementById('end-message');

            endScreen.style.display = 'flex';

            if (win) {
                title.textContent = "ENTRENAMENT COMPLETAT!";
                title.style.color = "#2ecc71";
                msg.textContent = "MÚSCUL CEREBRAL AL MÀXIM!";
                playSound('win');
            } else {
                title.textContent = "LESIÓ!";
                title.style.color = "#ff4757";
                msg.textContent = "HAS SOBRECARREGAT EL CERVELL";
                playSound('miss');
            }
        }

        function winGame() { endGame(true); }
        function loseGame() { endGame(false); }

    </script>
</body>

</html>
