<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChronOS - Viatge pel Temps Musical</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050510;
            --text-color: #e2e8f0;
            --card-bg: rgba(20, 20, 35, 0.6);
            --card-border: rgba(255, 255, 255, 0.1);
            --accent-glow: 0 0 20px rgba(59, 130, 246, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            background-image:
                radial-gradient(circle at 10% 20%, rgba(79, 70, 229, 0.2) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(236, 72, 153, 0.2) 0%, transparent 40%),
                url("https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2072&auto=format&fit=crop");
            /* Subtle space texture */
            background-size: cover;
            background-blend-mode: overlay;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Header */
        header {
            text-align: center;
            padding: 3rem 1rem;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-size: 4rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -2px;
            background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            filter: drop-shadow(0 0 15px rgba(0, 242, 254, 0.5));
            animation: fadeInDown 1s ease-out;
        }

        p.subtitle {
            font-size: 1.2rem;
            color: #bbc7dd;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
            animation: fadeIn 1.5s ease-out;
        }

        /* Timeline Container */
        .timeline-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem 2rem;
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* Prevent scroll */
        }

        .timeline {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 1800px;
            /* Max constraint for huge screens */
            justify-content: center;
            align-items: stretch;
            height: 80%;
        }

        /* Era Card */
        .era-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            flex: 1;
            /* Grow to fill space */
            min-width: 0;
            /* Allow shrinking */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 1.5rem 0.5rem;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
            backdrop-filter: blur(20px);
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .era-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: var(--accent-color, #fff);
            box-shadow: 0 0 15px var(--accent-color, #fff);
        }

        .era-card:hover {
            transform: translateY(-10px);
            flex: 1.2;
            /* Expand slightly on hover */
            background: rgba(30, 30, 50, 0.95);
            z-index: 10;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        /* Era Icon (Image) - Now Circular */
        .img-container {
            width: 80px;
            height: 80px;
            margin-bottom: 8px;
            position: relative;
            z-index: 2;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        .era-card:hover .img-container {
            transform: scale(1.1);
            border-color: var(--accent-color);
        }

        .era-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
            /* Focus on face */
        }

        /* Era Emoji (Top Feature) */
        .era-emoji {
            font-size: 2.5rem;
            margin-bottom: 5px;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.2));
            z-index: 2;
            transition: transform 0.3s ease;
        }

        .era-card:hover .era-emoji {
            transform: scale(1.1) rotate(5deg);
        }

        /* Composer Name */
        .composer-name {
            font-family: 'Outfit', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            z-index: 2;
            opacity: 0.9;
        }

        /* Card Background Glow */
        .card-bg-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            background: var(--accent-color);
            filter: blur(80px);
            opacity: 0.15;
            z-index: 1;
            border-radius: 50%;
            transition: opacity 0.4s ease;
        }

        .era-card:hover .card-bg-glow {
            opacity: 0.4;
        }

        /* Title & Date */
        .era-title {
            font-size: 1.3rem;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 2px;
            color: #fff;
            letter-spacing: 0px;
            z-index: 2;
            word-wrap: break-word;
            /* Prevent overflow */
        }

        .era-date {
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            color: #bbc7dd;
            margin-bottom: 12px;
            background: rgba(0, 0, 0, 0.5);
            padding: 2px 8px;
            border-radius: 12px;
            z-index: 2;
        }

        /* Era Traits (Always Visible now) */
        .era-traits {
            text-align: left;
            width: 100%;
            font-size: 0.8rem;
            /* Smaller font */
            line-height: 1.3;
            color: #e2e8f0;
            list-style: none;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 8px;
            z-index: 2;
            margin-bottom: auto;
            /* Push composer down */
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .era-traits li {
            margin-bottom: 0.5rem;
            padding-left: 1rem;
            position: relative;
        }

        .era-traits li::before {
            content: "➜";
            color: var(--accent-color);
            position: absolute;
            left: 0;
            font-weight: bold;
            font-size: 0.8rem;
            top: 2px;
        }

        /* Colors per Era */
        .era-prehistoria {
            --accent-color: #78716c;
            /* Stone Gray */
        }

        .era-mesopotamia {
            --accent-color: #d97706;
            /* Gold/Sand */
        }

        .era-grecia_roma {
            --accent-color: #ea580c;
            /* Burnt Orange/Terracotta */
        }

        .era-medieval {
            --accent-color: #fbbf24;
        }

        .era-renaixement {
            --accent-color: #ef4444;
        }

        .era-barroc {
            --accent-color: #a855f7;
        }

        .era-classicisme {
            --accent-color: #3b82f6;
        }

        .era-romanticisme {
            --accent-color: #ec4899;
        }

        .era-impressionisme {
            --accent-color: #10b981;
        }

        .era-segleXX {
            --accent-color: #14b8a6;
            /* Teal */
        }

        .era-actualitat {
            --accent-color: #64748b;
            /* Slate */
        }

        /* Context Era (Inactive Bookends) */
        .context-era {
            flex: 0.85;
            /* Wider to overlap less and fit text */
            opacity: 0.85;
            /* Much more visible */
            filter: grayscale(0.3);
            /* Slight desaturation instead of heavy gray */
            transform: scale(0.98);
            background: rgba(20, 20, 30, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            /* Solid, subtle border */
        }

        .context-era:hover {
            transform: scale(1.0);
            /* Full size on hover */
            flex: 0.9;
            opacity: 1;
            filter: grayscale(0);
            /* Full color on hover */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            background: var(--card-bg);
            border-color: var(--accent-color);
        }

        .context-message {
            margin-top: auto;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
            padding-top: 20px;
            font-weight: 600;
        }

        /* Composer Section (Footer) */
        .composer-section {
            margin-top: auto;
            /* Push to bottom */
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .composer-label {
            font-family: 'Outfit', sans-serif;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #fff;
            opacity: 0.7;
            margin-bottom: 15px;
            font-weight: 300;
            border-bottom: 1px solid var(--accent-color);
            padding-bottom: 5px;
            display: inline-block;
        }

        /* CTA Button Container */
        .cta-container {
            text-align: center;
            padding: 3rem;
            position: relative;
            z-index: 10;
        }

        .start-btn {
            display: inline-flex;
            align-items: center;
            gap: 15px;
            background: #fff;
            color: #000;
            font-size: 1.3rem;
            font-weight: 800;
            text-transform: uppercase;
            padding: 1.2rem 3rem;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            border: 4px solid transparent;
        }

        .start-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.6);
            border-color: #3b82f6;
            color: #3b82f6;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* Decorative Background Elements */
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.4;
        }

        .orb-1 {
            width: 300px;
            height: 300px;
            background: #3b82f6;
            top: -50px;
            left: -50px;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: #8b5cf6;
            bottom: -100px;
            right: -100px;
        }
    </style>
</head>

<body>

    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <header>
        <h1>Viatge pel Temps Musical</h1>
        <p class="subtitle">Explora sis èpoques que van canviar la història. Descobreix els secrets de cada període i
            prepara't per a la teva missió d'investigació.</p>
    </header>

    <!-- Dynamic Timeline Container -->
    <div class="timeline-container">
        <div id="timeline" class="timeline">
            <!-- Cards will be injected here by JS -->
        </div>
    </div>

    <div class="cta-container">
        <a href="mapa_investigador.html" class="start-btn">
            Obrir Dossier d'Investigació <span class="btn-icon">🚀</span>
        </a>
    </div>

    <script>
        // Data Model with Pixar-style Images & Emojis
        const eras = [
            {
                id: 'prehistoria',
                title: "Prehistòria",
                date: "Abans del 3000 aC",
                emoji: "🦴",
                type: 'context',
                traits: ["Orígens del So", "Ritme i Instruments", "Imitació de la Natura"]
            },
            {
                id: 'mesopotamia',
                title: "Mesopotàmia i Egipte",
                date: "3000 aC - 800 aC",
                emoji: "👁️",
                type: 'context',
                traits: ["Creació de l'Escriptura", "Música Religiosa", "Lires i Arpes"]
            },
            {
                id: 'grecia_roma',
                title: "Grècia i Roma",
                date: "800 aC - 476 dC",
                emoji: "🏺",
                type: 'context',
                traits: ["Naixement de la Teoria", "Teatre i Cors", "Epitafi de Seikilos"]
            },
            {
                id: 'medieval',
                title: "Edat Mitjana",
                date: "476 - 1450",
                emoji: "🏰",
                character: "Hildegard von Bingen",
                image: "./Jocs/Pixar_Artist/img/hildegard.png",
                traits: ["Monestirs i Castells", "Cant Gregorià (Un veu)", "Naixement de la Polifonia"]
            },
            {
                id: 'renaixement',
                title: "Renaixement",
                date: "1450 - 1600",
                emoji: "🎭",
                character: "Giovanni P. Palestrina",
                image: "./Jocs/Pixar_Artist/img/palestrina.png",
                traits: ["Humanisme i Art", "Polifonia Complexa", "Música Vocal (A Cappella)"]
            },
            {
                id: 'barroc',
                title: "Barroc",
                date: "1600 - 1750",
                emoji: "🎻",
                character: "Johann S. Bach",
                image: "./Jocs/Pixar_Artist/img/bach.png",
                traits: ["Contrast i Ornamentació", "Naixement de l'Òpera", "Clavicèmbal i Orquestra"]
            },
            {
                id: 'classicisme',
                title: "Classicisme",
                date: "1750 - 1820",
                emoji: "🏛️",
                character: "W.A. Mozart",
                image: "./Jocs/Pixar_Artist/img/mozart.png",
                traits: ["Equilibri i Claredat", "Piano i Simfonia", "Melodia Agradable"]
            },
            {
                id: 'romanticisme',
                title: "Romanticisme",
                date: "1820 - 1900",
                emoji: "🎹",
                character: "Frédéric Chopin",
                image: "./Jocs/Pixar_Artist/img/chopin.png",
                traits: ["Emoció i Passió", "Grans Orquestres", "Virtuosisme Instrumental"]
            },
            {
                id: 'segleXX',
                title: "Segle XX",
                date: "1900 - 2000",
                emoji: "🌊",
                character: "John Cage",
                image: "./Jocs/Pixar_Artist/img/cage.png",
                traits: ["Ruptura de Normes", "Nous Sons i Tecnologia", "Varietat d'Estils"]
            },
            {
                id: 'actualitat',
                title: "Actualitat",
                date: "Segle XXI",
                emoji: "📱",
                type: 'context',
                traits: ["Música Digital", "Streaming i IA", "Fusió Global"]
            }
        ];

        // Render Timeline
        const container = document.getElementById('timeline');

        eras.forEach((era, index) => {
            const card = document.createElement('div');
            const isContext = era.type === 'context';

            // Add extra class if it's a context era
            card.className = `era-card era-${era.id} ${isContext ? 'context-era' : ''}`;
            card.style.animationDelay = `${index * 0.1}s`;

            // Build Traits List
            const traitsList = era.traits.map(t => `<li>${t}</li>`).join('');

            // Conditional HTML for Composer Section
            const composerHTML = isContext ?
                `<div class="context-message">No inclòs a la missió</div>` :
                `<div class="composer-section">
                    <div class="composer-label">Icona Musical</div>
                    <div class="img-container">
                        <img src="${era.image}" class="era-img" alt="${era.character}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/4600/4600336.png'"> 
                    </div>
                    <div class="composer-name">${era.character}</div>
                </div>`;

            card.innerHTML = `
                <div class="card-bg-glow"></div>
                
                <div class="era-emoji">${era.emoji}</div>
                <h2 class="era-title">${era.title}</h2>
                <div class="era-date">${era.date}</div>
                
                <ul class="era-traits">
                    ${traitsList}
                </ul>

                ${composerHTML}
            `;

            // Hover logic
            card.addEventListener('mouseenter', () => {
                // Future sound effect
            });

            container.appendChild(card);
        });
    </script>
</body>

</html>
